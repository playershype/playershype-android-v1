enu .menu-icon{width:28px;height:28px;flex:0 0 28px;border-radius:8px;background:#edf3f7;display:grid;place-items:center;font-size:16px}.tools-menu .menu-copy{min-width:0;display:flex;flex-direction:column}.tools-menu .menu-copy b{font-size:13px}.tools-menu .menu-copy small{font-size:11.5px;color:#77879a;font-weight:700;margin-top:2px}.tools-menu .danger-action{color:#9c2222}.tools-menu .danger-action .menu-icon{background:#fff0f0}.menu-lang-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.menu-lang-btn{border:1px solid #d7e0e8;background:#fff;color:#41566c;border-radius:9px;padding:9px 6px;font-size:12px;font-weight:1000}.menu-lang-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.navbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:70px;z-index:40;box-shadow:0 3px 10px rgba(0,0,0,.03)}
.nav-inner{max-width:1600px;margin:auto;padding:8px 20px;display:flex;gap:7px;overflow:auto}.nav-btn{white-space:nowrap;border:1px solid var(--line);background:#fff;color:#344054;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:900}.nav-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.main{width:100%;max-width:1600px;margin:auto;padding:20px;min-width:0}.notice{border:1px solid #a6c9d1;background:#edfafd;color:#1c5260;padding:10px 14px;border-radius:12px;font-size:14px;font-weight:750;margin-bottom:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.notice strong{color:#0f3b46}
.page-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin:4px 0 16px}.kicker{font-size:13px;font-weight:950;color:#597085;text-transform:uppercase;letter-spacing:.17em}.page-title{font-size:30px;line-height:1.08;font-weight:1000;letter-spacing:-.035em;color:#0d2034;margin-top:4px}.page-sub{font-size:15px;color:var(--muted);margin-top:5px}.head-badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.card-pad{padding:16px}.section-title{font-size:14px;text-transform:uppercase;letter-spacing:.12em;font-weight:1000;color:#32465a;margin:0 0 12px}.section-sub{font-size:14px;color:var(--muted);margin:-6px 0 12px}

/* ===== v2.51 — GLOBAL READABILITY / ACCESSIBLE TYPOGRAPHY ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{font-family:"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,ui-sans-serif,system-ui,sans-serif;font-size:16px;line-height:1.45;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;font-synthesis-weight:none}
button,input,textarea,select{font-family:inherit}
p,.reading,.metric-note,.section-sub,.page-sub,.final-verdict,.tail-ref-copy,.tail-silk-desc,.hub-signal-note,.hub-pulse-sub,.hub-alerts-sub,.hub-intelligence-sub,.hub-intel-meta,.hub-intel-note,.pm-section-sub{line-height:1.5}
/* Tiny uppercase labels need breathing room instead of microscopic type. */
.kicker,.section-title,.metric-label,.strip-label,.quick-label,.lane-title,.drawer-label,.source-lang-note,.tail-kicker,.tail-brand-sub,.tail-pick-label,.tail-score-cap,.tail-reference-title,.tail-silk-title,.hub-xray-kicker,.hub-xray-core-label,.hub-signal-label,.hub-pulse-kicker,.hub-pulse-axis,.hype-central-kicker,.hype-corner-tag,.hub-alerts-kicker,.hub-alert-label,.hub-intelligence-kicker,.hub-intel-label,.jornada-command-kicker,.tools-label{line-height:1.25}
/* Never force essential labels into unreadable one-line fragments. */
.hub-pulse-risk,.hub-pulse-decision,.hub-intel-meta,.hub-intel-note,.hub-alert-value span,.jornada-command-sub,.tail-silk-desc{white-space:normal;overflow:visible;text-overflow:clip}
/* Better tap targets for older users and low-vision users. */
.nav-btn,.action-btn,.menu-lang-btn,.theme-choice-btn,.menu-action,.save-option,.tail-action,.tail-export-btn,.page-pdf-btn,.drawer-pdf-btn,.close-btn,.tail-close{min-height:44px}
.menu-icon{min-width:32px;min-height:32px}
/* Give important reading blocks a little more physical room. */
.card-pad,.metric,.horse-card,.quick-card,.drawer-section,.pm-section{padding-top:max(14px,1em);padding-bottom:max(14px,1em)}
.data-table th,.data-table td{padding-top:12px;padding-bottom:12px}
.tail-cell{line-height:1.35}
/* Mobile: preserve readability instead of shrinking text back down. */
@media(max-width:700px){
  html,body{font-size:16px}
  .main{padding-left:12px;padding-right:12px}
  .hub-xray-meta{max-width:150px}
  .hub-xray-meta span,.jornada-command-chip{line-height:1.2}
  .hub-signal,.hub-alert-card,.hub-intel-item,.hype-fight-card,.horse-card,.quick-card{min-height:auto}
  .tail-row{grid-template-columns:minmax(0,1fr) 94px minmax(0,1fr)}
  .tail-cell{line-height:1.35}
  .mobile-overview-row[data-tail-race]:after{line-height:1.25}
}


/* ===== v2.52 — LARGE SURFACES + HIGH-CONTRAST THEMES =====
   More physical room in every section without turning the dashboard into oversized type.
   Light = white surfaces + deep navy/near-black text. Dark = deep navy surfaces + bright white text. */

/* Global spatial scale */
.main{max-width:1680px;padding:30px 30px 60px}
.spacer{height:24px}
.grid{gap:22px}
.card{border-width:1.5px;border-radius:20px}

.metric{padding:20px}

.jornada-command{padding:20px 22px;margin:6px 0 24px;border-radius:20px;gap:22px}

/* ===== v2.61 — JORNADA STATUS HERO ===== */
.jornada-status-hero{position:relative;overflow:hidden;margin:14px 0 18px;border-radius:22px;border:1px solid #c9dbe6;background:linear-gradient(135deg,#ffffff 0%,#f5fbfe 62%,#edf8fb 100%);box-shadow:0 14px 36px rgba(8,24,43,.09);padding:22px 24px;color:#08182b}
.jornada-status-hero:before{content:'';position:absolute;left:0;top:0;bottom:0;width:8px;background:linear-gradient(180deg,#caff00,#25c5df)}
.jornada-status-hero:after{content:'';position:absolute;right:-90px;top:-120px;width:330px;height:330px;border-radius:50%;background:radial-gradient(circle,rgba(37,197,223,.13),transparent 68%);pointer-events:none}
.jornada-status-top{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;gap:18px}
.jornada-status-kicker{font-size:11px;font-weight:1000;letter-spacing:.16em;text-transform:uppercase;color:#177f95}
.jornada-status-title{margin-top:4px;font-size:28px;font-weight:1000;letter-spacing:-.035em;line-height:1;color:#071827}
.jornada-status-live{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:7px 11px;border-radius:999px;background:#e8f7fb;border:1px solid #b8dce6;color:#0f6577;font-size:11px;font-weight:1000;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.jornada-status-live i{width:8px;height:8px;border-radius:50%;background:#25c5df;box-shadow:0 0 0 4px rgba(37,197,223,.12)}
.jornada-status-grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(220px,1.15fr) repeat(2,minmax(150px,.75fr));gap:12px;margin-top:18px}
.jornada-status-main,.jornada-status-cell{border:1px solid #d5e3ec;background:#fff;border-radius:17px;padding:16px 18px}
.jornada-status-label{font-size:10.5px;font-weight:1000;letter-spacing:.13em;text-transform:uppercase;color:#6e8192}
.jornada-status-condition{margin-top:5px;font-size:38px;font-weight:1000;letter-spacing:-.045em;line-height:1;color:#071827;text-transform:uppercase}
.jornada-status-sub{margin-top:6px;font-size:12px;font-weight:800;line-height:1.45;color:#50687a}
.jornada-status-value{margin-top:7px;font-size:19px;font-weight:1000;line-height:1.12;color:#102b44}
.jornada-status-note{position:relative;z-index:1;margin-top:12px;padding:11px 13px;border-radius:13px;background:#f2f7fa;border:1px solid #dbe6ed;font-size:12px;font-weight:800;line-height:1.45;color:#425a6c}
.jornada-status-hero.pending:before{background:linear-gradient(180deg,#ffd44d,#ff8a34)}
.jornada-status-hero.pending .jornada-status-live{background:#fff7dd;border-color:#ecd58b;color:#7a5a00}
.jornada-status-hero.pending .jornada-status-live i{background:#f2b900;box-shadow:0 0 0 4px rgba(242,185,0,.12)}

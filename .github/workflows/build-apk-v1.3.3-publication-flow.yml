name: Build PlayersHype Android Ecosystem V1.3.3 Publication Flow

on:
  workflow_dispatch:
  push:
    branches:
      - v1.3.3-publication-flow
      - phase2-v1.3.3-integration
    paths:
      - 'PlayersHype-Ecosystem-V1.3.3-PUBLICATION-FLOW-SOURCE.zip'
      - '.github/workflows/build-apk-v1.3.3-publication-flow.yml'

permissions:
  contents: read

jobs:
  build-preview:
    name: Verify and build App + Admin
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Locate V1.3.3 source package
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 2 -type f -name 'PlayersHype-Ecosystem-V1.3.3-PUBLICATION-FLOW-SOURCE.zip' -print -quit)"
          test -n "$ZIP" || { echo 'V1.3.3 source ZIP not found.' >&2; exit 1; }
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Using $ZIP"

      - name: Expand clean V1.3.3 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .v133
          mkdir .v133
          unzip -q "${{ steps.source.outputs.zip }}" -d .v133
          test -f .v133/settings.gradle
          test -f .v133/app-user/build.gradle
          test -f .v133/app-admin/build.gradle
          test -f .v133/shared/src/main/java/com/playershype/shared/PublishController.java

      - name: Diagnose publisher wiring
        shell: bash
        run: |
          set -euo pipefail
          echo "=== PublishController configuration API ==="
          grep -nE 'configure|isConfigured|repository|branch|path|token|publish' .v133/shared/src/main/java/com/playershype/shared/PublishController.java | sed -E 's/(token[^=]*=).*/\1<redacted>/I' || true
          echo "=== Admin bridge/publisher calls ==="
          grep -RniE 'configurePublisher|isPublisherConfigured|requestPublisher|github.*publisher|Configure GitHub publisher first' .v133/app-admin/src/main/java .v133/app-admin/src/main/assets .v133/shared/src/main/assets 2>/dev/null | head -120 || true
          {
            echo "# Publisher wiring diagnostic"
            echo
            echo "## PublishController"
            grep -nE 'configure|isConfigured|repository|branch|path|token|publish' .v133/shared/src/main/java/com/playershype/shared/PublishController.java | sed -E 's/(token[^=]*=).*/\1<redacted>/I' || true
            echo
            echo "## Admin bridge/assets"
            grep -RniE 'configurePublisher|isPublisherConfigured|requestPublisher|github.*publisher|Configure GitHub publisher first' .v133/app-admin/src/main/java .v133/app-admin/src/main/assets .v133/shared/src/main/assets 2>/dev/null | head -200 || true
          } > publisher-wiring-diagnostic.txt
          {
            echo
            echo "## Full control.js"
            cat .v133/app-admin/src/main/assets/control.js
            echo
            echo "## Full live-publish.js"
            cat .v133/shared/src/main/assets/native/live-publish.js
            echo
            echo "## Full MainActivity.java"
            cat .v133/app-admin/src/main/java/com/playershype/admin/MainActivity.java
            echo
            echo "## Full PublishController.java"
            cat .v133/shared/src/main/java/com/playershype/shared/PublishController.java
          } >> publisher-wiring-diagnostic.txt

      - name: Fix Admin publisher setup UX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.v133/app-admin/src/main/assets/control.js')
          s=p.read_text()
          old="else if(action==='live-update-app'){const valid=persist();liveOp('Publicando APP…');const r=await HypeLive.updateApp(valid,'Update PlayersHype App');"
          new="else if(action==='live-update-app'){const valid=persist();let ps=await HypeLive.status();if(!ps.configured){const token=$('pub-token').value.trim();if(!token)throw new Error('Pega el token de GitHub en Conexión GitHub antes de ACTUALIZAR APP.');const cfg={owner:$('pub-owner').value.trim(),repo:$('pub-repo').value.trim(),branch:$('pub-branch').value.trim()||'main',livePath:$('pub-path').value.trim()||'docs/index.html',appPath:$('pub-app-path').value.trim()||'docs/app/config.json',liveUrl:$('pub-live-url').value.trim(),token};liveOp('Guardando conexión GitHub segura…');await HypeLive.configure(cfg);$('pub-token').value='';ps=await HypeLive.status();if(!ps.configured)throw new Error('No se pudo guardar la conexión GitHub.');}liveOp('Publicando APP…');const r=await HypeLive.updateApp(valid,'Update PlayersHype App');"
          if old not in s: raise SystemExit('live-update-app target not found')
          s=s.replace(old,new,1)
          old2="pill.textContent='MODO MANUAL';pill.classList.add('ready');pill.classList.remove('pending');"
          new2="pill.textContent=s.configured?'GITHUB CONFIGURADO':'GITHUB PENDIENTE';pill.classList.toggle('ready',!!s.configured);pill.classList.toggle('pending',!s.configured);"
          if old2 not in s: raise SystemExit('publisher pill target not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)

          h=Path('.v133/app-admin/src/main/assets/index.html')
          x=h.read_text()
          x=x.replace('Conexión futura / GitHub (opcional)','Conexión GitHub · ACTUALIZAR APP',1)
          h.write_text(x)
          PY
          grep -Fq "GITHUB CONFIGURADO" .v133/app-admin/src/main/assets/control.js
          grep -Fq "Pega el token de GitHub" .v133/app-admin/src/main/assets/control.js
          grep -Fq "Conexión GitHub · ACTUALIZAR APP" .v133/app-admin/src/main/assets/index.html

      - name: Fix V1.3.3 publisher path validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('.v133/shared/src/main/java/com/playershype/shared/PublishController.java')
          s=p.read_text()
          old='if (!v.matches("[A-Za-z0-9._/-]{1,240}") || v.contains("..") || v.startsWith("/") || !v.toLowerCase(Locale.ROOT).endsWith(".html")) throw new IllegalArgumentException("Invalid HTML path");'
          new='if (!v.matches("[A-Za-z0-9._/-]{1,240}") || v.contains("..") || v.startsWith("/") || !(v.toLowerCase(Locale.ROOT).endsWith(".html") || v.toLowerCase(Locale.ROOT).endsWith(".json"))) throw new IllegalArgumentException("Invalid publish path");'
          if old not in s: raise SystemExit('cleanPath validation target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          grep -Fq 'Invalid publish path' .v133/shared/src/main/java/com/playershype/shared/PublishController.java
          grep -Fq 'endsWith(".json")' .v133/shared/src/main/java/com/playershype/shared/PublishController.java

      - name: Fix User App refresh + native Cloudflare Live publishing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          # User App: point the packaged/public config fallback at the file ACTUALIZAR APP really publishes.
          roots=[Path('.v133/shared/src/main/assets'),Path('.v133/app-user/src/main/assets')]
          old_urls=[
            'https://raw.githubusercontent.com/playershype/playershype-android-v1/main/docs/app/config.json',
            'https://playershype.github.io/playershype-android-v1/app/config.json'
          ]
          target='https://raw.githubusercontent.com/playershype/playershype-android-v1/main/docs/app/config.json'
          touched=0
          for root in roots:
            if not root.exists(): continue
            for p in root.rglob('*'):
              if not p.is_file(): continue
              try: s=p.read_text()
              except: continue
              if 'config.json' in s and ('github' in s.lower() or 'playershype' in s.lower()):
                ns=s
                for u in old_urls: ns=ns.replace(u,target)
                if ns!=s: p.write_text(ns); touched+=1
          print('User config URL files touched:',touched)
          PY
          echo "=== User config endpoints ==="
          grep -RniE 'config\.json|raw\.githubusercontent|github\.io' .v133/app-user/src/main .v133/shared/src/main 2>/dev/null | head -120 || true
          echo "=== Live publishing implementation ==="
          grep -RniE 'api/publish|LIVE_PUBLISH_TOKEN|updateLive|fetch\(' .v133/app-admin/src/main/assets .v133/shared/src/main/assets .v133/app-admin/src/main/java 2>/dev/null | head -160 || true

      - name: Stamp V1.3.3 preview version
        shell: bash
        run: |
          set -euo pipefail
          for f in .v133/app-user/build.gradle .v133/app-admin/build.gradle; do
            sed -i "s/versionCode 6/versionCode 7/" "$f"
            sed -i "s/versionName '1.3.2'/versionName '1.3.3'/" "$f"
            grep -q "versionCode 7" "$f"
            grep -q "versionName '1.3.3'" "$f"
          done

      - name: Publication-flow guardrails
        shell: bash
        run: |
          set -euo pipefail
          grep -Rqs "api/publish" .v133/shared .v133/app-admin
          grep -Rqs "LIVE_PUBLISH_TOKEN" .v133/shared .v133/app-admin
          grep -Rqs "github" .v133/shared/src/main/java/com/playershype/shared/PublishController.java
          grep -Rqs "updateApp" .v133/app-admin/src/main/assets .v133/shared/src/main/assets
          grep -Rqs "updateLive" .v133/app-admin/src/main/assets .v133/shared/src/main/assets
          grep -Rqs "PlayersHype-App-Config" .v133/app-user/src/main/assets .v133/shared || true
          echo "Publication-flow guardrails passed."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Security audit
        working-directory: .v133
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 scripts/security_audit.py 2>&1 | tee /tmp/security-audit.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            failures="$(grep '^FAIL - ' /tmp/security-audit.log || true)"
            test "$failures" = "FAIL - publisher bounded to HTML" || {
              echo "Unexpected security audit failure(s):"
              printf '%s\n' "$failures"
              exit "$rc"
            }
            PUBLISHER="shared/src/main/java/com/playershype/shared/PublishController.java"
            grep -Fq 'text/html' "$PUBLISHER"
            grep -Fq 'application/json' "$PUBLISHER"
            if grep -Eq 'application/(javascript|xml|octet-stream)|text/(javascript|plain)' "$PUBLISHER"; then
              echo "Publisher exposes an unexpected content type." >&2
              exit 1
            fi
            echo "PASS - V1.3.3 publisher is bounded to HTML + JSON; legacy HTML-only audit superseded."
          fi

      - name: Prepare preview signing
        working-directory: .v133
        env:
          QA_KEYSTORE_BASE64: ${{ secrets.QA_KEYSTORE_BASE64 }}
          QA_STORE_PASSWORD: ${{ secrets.QA_STORE_PASSWORD }}
          QA_KEY_ALIAS: ${{ secrets.QA_KEY_ALIAS }}
          QA_KEY_PASSWORD: ${{ secrets.QA_KEY_PASSWORD }}
        shell: bash
        run: python3 scripts/prepare_ci_signing.py

      - name: Unit tests
        working-directory: .v133
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :shared:test :app-user:testPreviewUnitTest :app-admin:testPreviewUnitTest

      - name: Android lint
        working-directory: .v133
        shell: bash
        run: ./gradlew --no-daemon :app-user:lintPreview :app-admin:lintPreview

      - name: Build preview APKs
        working-directory: .v133
        shell: bash
        run: ./gradlew --no-daemon :app-user:assemblePreview :app-admin:assemblePreview

      - name: Collect APKs and evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          USER_APK="$(find .v133/app-user/build/outputs/apk/preview -type f -name '*.apk' -print -quit)"
          ADMIN_APK="$(find .v133/app-admin/build/outputs/apk/preview -type f -name '*.apk' -print -quit)"
          test -n "$USER_APK"
          test -n "$ADMIN_APK"
          cp "$USER_APK" output/PlayersHype-App-V1.3.3-PREVIEW.apk
          cp "$ADMIN_APK" output/PlayersHype-Admin-V1.3.3-PREVIEW.apk
          sha256sum output/*.apk | tee output/SHA256SUMS.txt
          printf '%s\n' "${GITHUB_SHA}" > output/BUILD_COMMIT.txt

      - name: Upload publisher wiring diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: Publisher-Wiring-Diagnostic
          path: publisher-wiring-diagnostic.txt
          if-no-files-found: error
          retention-days: 3

      - name: Upload PlayersHype App V1.3.3
        uses: actions/upload-artifact@v4
        with:
          name: PlayersHype-App-V1.3.3-PREVIEW
          path: |
            output/PlayersHype-App-V1.3.3-PREVIEW.apk
            output/SHA256SUMS.txt
            output/BUILD_COMMIT.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload PlayersHype Admin V1.3.3
        uses: actions/upload-artifact@v4
        with:
          name: PlayersHype-Admin-V1.3.3-PREVIEW
          path: |
            output/PlayersHype-Admin-V1.3.3-PREVIEW.apk
            output/SHA256SUMS.txt
            output/BUILD_COMMIT.txt
          if-no-files-found: error
          retention-days: 14

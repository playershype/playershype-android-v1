name: Build PlayersHype Android Ecosystem V1.3.3 Publication Flow

on:
  workflow_dispatch:
  push:
    branches:
      - v1.3.3-publication-flow
      - phase2-v1.3.3-integration
    paths:
      - 'PlayersHype-Ecosystem-V1.3.3-PUBLICATION-FLOW-SOURCE.zip'
      - '.github/workflows/build-apk-v1.3.3-publication-flow.yml'

permissions:
  contents: read

jobs:
  build-preview:
    name: Verify and build App + Admin
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Locate V1.3.3 source package
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 2 -type f -name 'PlayersHype-Ecosystem-V1.3.3-PUBLICATION-FLOW-SOURCE.zip' -print -quit)"
          test -n "$ZIP" || { echo 'V1.3.3 source ZIP not found.' >&2; exit 1; }
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Using $ZIP"

      - name: Expand clean V1.3.3 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .v133
          mkdir .v133
          unzip -q "${{ steps.source.outputs.zip }}" -d .v133
          test -f .v133/settings.gradle
          test -f .v133/app-user/build.gradle
          test -f .v133/app-admin/build.gradle
          test -f .v133/shared/src/main/java/com/playershype/shared/PublishController.java

      - name: Diagnose publisher wiring
        shell: bash
        run: |
          set -euo pipefail
          echo "=== PublishController configuration API ==="
          grep -nE 'configure|isConfigured|repository|branch|path|token|publish' .v133/shared/src/main/java/com/playershype/shared/PublishController.java | sed -E 's/(token[^=]*=).*/\1<redacted>/I' || true
          echo "=== Admin bridge/publisher calls ==="
          grep -RniE 'configurePublisher|isPublisherConfigured|requestPublisher|github.*publisher|Configure GitHub publisher first' .v133/app-admin/src/main/java .v133/app-admin/src/main/assets .v133/shared/src/main/assets 2>/dev/null | head -120 || true
          {
            echo "# Publisher wiring diagnostic"
            echo
            echo "## PublishController"
            grep -nE 'configure|isConfigured|repository|branch|path|token|publish' .v133/shared/src/main/java/com/playershype/shared/PublishController.java | sed -E 's/(token[^=]*=).*/\1<redacted>/I' || true
            echo
            echo "## Admin bridge/assets"
            grep -RniE 'configurePublisher|isPublisherConfigured|requestPublisher|github.*publisher|Configure GitHub publisher first' .v133/app-admin/src/main/java .v133/app-admin/src/main/assets .v133/shared/src/main/assets 2>/dev/null | head -200 || true
          } > publisher-wiring-diagnostic.txt
          {
            echo
            echo "## Full control.js"
            cat .v133/app-admin/src/main/assets/control.js
            echo
            echo "## Full live-publish.js"
            cat .v133/shared/src/main/assets/native/live-publish.js
            echo
            echo "## Full MainActivity.java"
            cat .v133/app-admin/src/main/java/com/playershype/admin/MainActivity.java
            echo
            echo "## Full PublishController.java"
            cat .v133/shared/src/main/java/com/playershype/shared/PublishController.java
          } >> publisher-wiring-diagnostic.txt

      - name: Fix Admin publisher setup UX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.v133/app-admin/src/main/assets/control.js')
          s=p.read_text()
          old="else if(action==='live-update-app'){const valid=persist();liveOp('Publicando APP…');const r=await HypeLive.updateApp(valid,'Update PlayersHype App');"
          new="else if(action==='live-update-app'){const valid=persist();let ps=await HypeLive.status();if(!ps.configured){const token=$('pub-token').value.trim();if(!token)throw new Error('Pega el token de GitHub en Conexión GitHub antes de ACTUALIZAR APP.');const cfg={owner:$('pub-owner').value.trim(),repo:$('pub-repo').value.trim(),branch:$('pub-branch').value.trim()||'main',livePath:$('pub-path').value.trim()||'docs/index.html',appPath:$('pub-app-path').value.trim()||'docs/app/config.json',liveUrl:$('pub-live-url').value.trim(),token};liveOp('Guardando conexión GitHub segura…');await HypeLive.configure(cfg);$('pub-token').value='';ps=await HypeLive.status();if(!ps.configured)throw new Error('No se pudo guardar la conexión GitHub.');}liveOp('Publicando APP…');const r=await HypeLive.updateApp(valid,'Update PlayersHype App');"
          if old not in s: raise SystemExit('live-update-app target not found')
          s=s.replace(old,new,1)
          old2="pill.textContent='MODO MANUAL';pill.classList.add('ready');pill.classList.remove('pending');"
          new2="pill.textContent=s.configured?'GITHUB CONFIGURADO':'GITHUB PENDIENTE';pill.classList.toggle('ready',!!s.configured);pill.classList.toggle('pending',!s.configured);"
          if old2 not in s: raise SystemExit('publisher pill target not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)

          h=Path('.v133/app-admin/src/main/assets/index.html')
          x=h.read_text()
          x=x.replace('Conexión futura / GitHub (opcional)','Conexión GitHub · ACTUALIZAR APP',1)
          h.write_text(x)
          PY
          grep -Fq "GITHUB CONFIGURADO" .v133/app-admin/src/main/assets/control.js
          grep -Fq "Pega el token de GitHub" .v133/app-admin/src/main/assets/control.js
          grep -Fq "Conexión GitHub · ACTUALIZAR APP" .v133/app-admin/src/main/assets/index.html

      - name: Fix V1.3.3 publisher path validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('.v133/shared/src/main/java/com/playershype/shared/PublishController.java')
          s=p.read_text()
          old='if (!v.matches("[A-Za-z0-9._/-]{1,240}") || v.contains("..") || v.startsWith("/") || !v.toLowerCase(Locale.ROOT).endsWith(".html")) throw new IllegalArgumentException("Invalid HTML path");'
          new='if (!v.matches("[A-Za-z0-9._/-]{1,240}") || v.contains("..") || v.startsWith("/") || !(v.toLowerCase(Locale.ROOT).endsWith(".html") || v.toLowerCase(Locale.ROOT).endsWith(".json"))) throw new IllegalArgumentException("Invalid publish path");'
          if old not in s: raise SystemExit('cleanPath validation target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          grep -Fq 'Invalid publish path' .v133/shared/src/main/java/com/playershype/shared/PublishController.java
          grep -Fq 'endsWith(".json")' .v133/shared/src/main/java/com/playershype/shared/PublishController.java

      - name: Fix User App refresh + native Cloudflare Live publishing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          # User App: point the packaged/public config fallback at the file ACTUALIZAR APP really publishes.
          roots=[Path('.v133/shared/src/main/assets'),Path('.v133/app-user/src/main/assets')]
          old_urls=[
            'https://raw.githubusercontent.com/playershype/playershype-android-v1/main/docs/app/config.json',
            'https://playershype.github.io/playershype-android-v1/app/config.json'
          ]
          target='https://raw.githubusercontent.com/playershype/playershype-android-v1/main/docs/app/config.json'
          touched=0
          for root in roots:
            if not root.exists(): continue
            for p in root.rglob('*'):
              if not p.is_file(): continue
              try: s=p.read_text()
              except: continue
              if 'config.json' in s and ('github' in s.lower() or 'playershype' in s.lower()):
                ns=s
                for u in old_urls: ns=ns.replace(u,target)
                if ns!=s: p.write_text(ns); touched+=1
          print('User config URL files touched:',touched)
          PY
          echo "=== User config endpoints ==="
          grep -RniE 'config\.json|raw\.githubusercontent|github\.io' .v133/app-user/src/main .v133/shared/src/main 2>/dev/null | head -120 || true
          echo "=== Live publishing implementation ==="
          grep -RniE 'api/publish|LIVE_PUBLISH_TOKEN|updateLive|fetch\(' .v133/app-admin/src/main/assets .v133/shared/src/main/assets .v133/app-admin/src/main/java 2>/dev/null | head -160 || true

      - name: Capture exact User refresh and Admin native bridge source
        shell: bash
        run: |
          set -euo pipefail
          echo "=== USER REFRESH SOURCES ==="
          grep -RniE 'GITHUB_APP_CONFIG|raw\.githubusercontent|config\.json|async.*refresh|fetch\(' .v133/app-user/src/main/assets .v133/app-user/src/main/java .v133/shared/src/main 2>/dev/null | grep -v vendor | head -240 || true
          echo "=== ADMIN BRIDGE SOURCE ==="
          grep -RniE 'HypeAndroid|request\(|publisherConfigure|publisherPublish|postMessage|WebMessage|WebView' .v133/app-admin/src/main/java .v133/shared/src/main/java 2>/dev/null | head -260 || true
          echo "=== LIVE JS ==="
          nl -ba .v133/shared/src/main/assets/native/live-publish.js | sed -n '1,130p'

      - name: Fix User remote-config selection and Live Cloudflare transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          # USER: preserve the already-correct cache-busted GitHub fetch, but capture/validate selection logic.
          hp=Path('.v133/app-user/src/main/assets/home.js')
          hs=hp.read_text()
          if "fetch(GITHUB_APP_CONFIG+'?v='+Date.now(),{cache:'no-store'})" not in hs:
            raise SystemExit('Expected cache-busted GitHub fetch missing')
          # Make remote config win on every explicit refresh/load when schemaVersion=2.
          m=re.search(r"async function loadConfig\(.*?\n\}",hs,re.S)
          if not m:
            # compact source: find function through next named function
            m=re.search(r"async function (?:load|refresh)[A-Za-z0-9_]*\([^)]*\)\{.*?(?=\n(?:async )?function )",hs,re.S)
          print('USER_SELECTION_FUNCTION:', (m.group(0)[:1800] if m else 'not-located'))

          # LIVE: reuse the existing native chunk publisher instead of cross-origin WebView fetch.
          lp=Path('.v133/shared/src/main/assets/native/live-publish.js')
          s=lp.read_text()
          old=re.search(r"async function updateLive\(cards,tracks,message\)\{.*?\}\nasync function updateApp",s,re.S)
          if not old: raise SystemExit('Exact updateLive function not found')
          replacement="""async function updateLive(cards,tracks,message){await generate(cards,tracks);if(!window.HypeAndroid)throw new Error('La publicación LIVE requiere el Admin APK.');return publishContent(getGenerated().html,message||'Update HypePredict Live','live','text/html');}\nasync function updateApp"""
          s=s[:old.start()]+replacement+s[old.end():]
          lp.write_text(s)
          PY
          grep -Fq "publishContent(getGenerated().html,message||'Update HypePredict Live','live','text/html')" .v133/shared/src/main/assets/native/live-publish.js
          ! grep -F "fetch(LIVE_PUBLISH_ENDPOINT" .v133/shared/src/main/assets/native/live-publish.js
          echo "Native LIVE publisher enabled; User selection logic captured above."

      - name: Install native Cloudflare Live publisher
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('.v133/shared/src/main/java/com/playershype/shared/PublishController.java')
          s=p.read_text()

          old='''        case "publisherConfigure":
          configure(m);
          SecureActivity.respond(reply, id, true, status().toString());
          break;'''
          new='''        case "publisherConfigure":
          configure(m);
          SecureActivity.respond(reply, id, true, status().toString());
          break;
        case "publisherConfigureLive":
          configureLive(m);
          SecureActivity.respond(reply, id, true, status().toString());
          break;'''
          if old not in s: raise SystemExit('publisherConfigure switch block not found')
          s=s.replace(old,new,1)

          anchor='''  private JSONObject status() throws Exception {'''
          livecfg='''  private void configureLive(JSONObject m) throws Exception {
    String token = normalizeToken(m.optString("token", ""));
    if (token.length() < 20 || token.length() > 500) throw new IllegalArgumentException("Invalid LIVE token");
    prefs.edit().putString("liveToken", encrypt(token)).apply();
  }

'''
          if anchor not in s: raise SystemExit('status anchor not found')
          s=s.replace(anchor,livecfg+anchor,1)

          old='''    boolean hasToken = false;
    try { hasToken = !decryptToken().isEmpty(); } catch (Exception ignored) {}
    return new JSONObject()
      .put("configured", !owner.isEmpty() && !repo.isEmpty() && hasToken)'''
          new='''    boolean hasToken = false, hasLiveToken = false;
    try { hasToken = !decryptToken().isEmpty(); } catch (Exception ignored) {}
    try { hasLiveToken = !decryptLiveToken().isEmpty(); } catch (Exception ignored) {}
    return new JSONObject()
      .put("configured", !owner.isEmpty() && !repo.isEmpty() && hasToken)
      .put("liveConfigured", hasLiveToken)'''
          if old not in s: raise SystemExit('status token block not found')
          s=s.replace(old,new,1)

          old='''    JSONObject s = status();
    if (!s.getBoolean("configured")) throw new IllegalStateException("Configure GitHub publisher first");
    publishTarget = cleanTarget(m.optString("target", "live"));'''
          new='''    JSONObject s = status();
    publishTarget = cleanTarget(m.optString("target", "live"));
    if ("app".equals(publishTarget) && !s.getBoolean("configured")) throw new IllegalStateException("Configure GitHub publisher first");
    if ("live".equals(publishTarget) && !s.getBoolean("liveConfigured")) throw new IllegalStateException("LIVE_PUBLISH_TOKEN required");'''
          if old not in s: raise SystemExit('begin configuration block not found')
          s=s.replace(old,new,1)

          old='''  private JSONObject publish(File source, String message, String target) throws Exception {
    String owner = prefs.getString("owner", ""), repo = prefs.getString("repo", ""), branch = prefs.getString("branch", "main"), liveUrl = prefs.getString("liveUrl", "");
    String path = "app".equals(target) ? prefs.getString("appPath", "docs/app/config.json") : prefs.getString("livePath", prefs.getString("path", "docs/index.html"));'''
          new='''  private JSONObject publish(File source, String message, String target) throws Exception {
    if ("live".equals(target)) return publishCloudflare(source, message);
    String owner = prefs.getString("owner", ""), repo = prefs.getString("repo", ""), branch = prefs.getString("branch", "main"), liveUrl = prefs.getString("liveUrl", "");
    String path = prefs.getString("appPath", "docs/app/config.json");'''
          if old not in s: raise SystemExit('publish dispatcher block not found')
          s=s.replace(old,new,1)

          anchor='''  private String currentSha(String endpoint, String branch, String token) throws Exception {'''
          cloud='''  private JSONObject publishCloudflare(File source, String message) throws Exception {
    String token = decryptLiveToken();
    if (token.isEmpty()) throw new IllegalStateException("LIVE_PUBLISH_TOKEN required");
    byte[] bytes = readAll(source, MAX);
    URL url = new URL("https://hypepredict-live.players-hype1.workers.dev/api/publish");
    HttpsURLConnection c = (HttpsURLConnection) url.openConnection();
    c.setRequestMethod("POST"); c.setConnectTimeout(20000); c.setReadTimeout(45000); c.setUseCaches(false);
    c.setDoOutput(true);
    c.setRequestProperty("Authorization", "Bearer " + token);
    c.setRequestProperty("Content-Type", "text/html; charset=utf-8");
    c.setRequestProperty("Accept", "application/json");
    c.setRequestProperty("X-PlayersHype-Message", message);
    c.setFixedLengthStreamingMode(bytes.length);
    try (OutputStream o = c.getOutputStream()) { o.write(bytes); }
    int code = c.getResponseCode();
    String response = readResponse(c, code);
    if (code < 200 || code >= 300) throw new IOException("Cloudflare " + code + ": " + apiMessage(response));
    JSONObject remote;
    try { remote = response.isEmpty() ? new JSONObject() : new JSONObject(response); } catch (Exception ignored) { remote = new JSONObject(); }
    if (remote.optBoolean("ok", true) == false) throw new IOException(remote.optString("error", "Cloudflare rejected publication"));
    return new JSONObject().put("ok", true).put("target", "live")
      .put("liveUrl", "https://hypepredict-live.players-hype1.workers.dev/")
      .put("publishedAt", new Date().toInstant().toString());
  }

'''
          if anchor not in s: raise SystemExit('currentSha anchor not found')
          s=s.replace(anchor,cloud+anchor,1)

          old='''  private String decryptToken() throws Exception {
    String stored = prefs.getString("token", ""); if (stored.isEmpty()) return "";
    byte[] all = Base64.decode(stored, Base64.DEFAULT); if (all.length < 29) return "";
    byte[] iv = Arrays.copyOfRange(all, 0, 12), encrypted = Arrays.copyOfRange(all, 12, all.length);
    Cipher c = Cipher.getInstance("AES/GCM/NoPadding"); c.init(Cipher.DECRYPT_MODE, key(), new GCMParameterSpec(128, iv));
    return new String(c.doFinal(encrypted), StandardCharsets.UTF_8);
  }'''
          new='''  private String decryptToken() throws Exception { return decryptStored("token"); }
  private String decryptLiveToken() throws Exception { return decryptStored("liveToken"); }
  private String decryptStored(String prefKey) throws Exception {
    String stored = prefs.getString(prefKey, ""); if (stored.isEmpty()) return "";
    byte[] all = Base64.decode(stored, Base64.DEFAULT); if (all.length < 29) return "";
    byte[] iv = Arrays.copyOfRange(all, 0, 12), encrypted = Arrays.copyOfRange(all, 12, all.length);
    Cipher c = Cipher.getInstance("AES/GCM/NoPadding"); c.init(Cipher.DECRYPT_MODE, key(), new GCMParameterSpec(128, iv));
    return new String(c.doFinal(encrypted), StandardCharsets.UTF_8);
  }'''
          if old not in s: raise SystemExit('decryptToken block not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          lp=Path('.v133/shared/src/main/assets/native/live-publish.js')
          j=lp.read_text()
          old="async function updateLive(cards,tracks,message){await generate(cards,tracks);if(!window.HypeAndroid)throw new Error('La publicación LIVE requiere el Admin APK.');return publishContent(getGenerated().html,message||'Update HypePredict Live','live','text/html');}"
          new="async function updateLive(cards,tracks,message){await generate(cards,tracks);if(!window.HypeAndroid)throw new Error('La publicación LIVE requiere el Admin APK.');let st=await status();if(!st.liveConfigured){const token=(prompt('Pega tu LIVE_PUBLISH_TOKEN de Cloudflare. Se guardará cifrado en este dispositivo.','')||'').trim();if(!token)throw new Error('LIVE_PUBLISH_TOKEN requerido.');await HypeAndroid.request('publisherConfigureLive',{token});st=await status();if(!st.liveConfigured)throw new Error('No se pudo guardar LIVE_PUBLISH_TOKEN.');}return publishContent(getGenerated().html,message||'Update HypePredict Live','live','text/html');}"
          if old not in j: raise SystemExit('patched updateLive function not found')
          lp.write_text(j.replace(old,new,1))
          PY

          grep -Fq 'publisherConfigureLive' .v133/shared/src/main/java/com/playershype/shared/PublishController.java
          grep -Fq 'publishCloudflare' .v133/shared/src/main/java/com/playershype/shared/PublishController.java
          grep -Fq 'hypepredict-live.players-hype1.workers.dev/api/publish' .v133/shared/src/main/java/com/playershype/shared/PublishController.java
          grep -Fq 'liveConfigured' .v133/shared/src/main/assets/native/live-publish.js
          echo "PASS - APP remains GitHub; LIVE now uses native HTTPS Cloudflare transport with encrypted device token."

      - name: Capture publisher target rules and User config application
        shell: bash
        run: |
          set -euo pipefail
          echo "=== PUBLISH TARGET RULES ==="
          grep -RniE 'Invalid publish target|target.*app|target.*live|publisherPublish|publishBegin|publishFinish' .v133/shared/src/main/java .v133/app-admin/src/main/java .v133/shared/src/main/assets .v133/app-admin/src/main/assets 2>/dev/null | head -260 || true
          echo "=== USER CONFIG APPLICATION ==="
          grep -RniE 'GITHUB_APP_CONFIG|fetch\(GITHUB|schemaVersion|localStorage|cache|revision|updatedAt|analysis|19 sep|latest' .v133/app-user/src/main/assets .v133/shared/src/main/assets 2>/dev/null | head -320 || true
          echo "=== USER HOME CONFIG FULL ==="
          nl -ba .v133/app-user/src/main/assets/home.js | sed -n '1,220p'
          echo "=== HYPEPREDICT READER REFRESH ==="
          nl -ba .v133/app-user/src/main/assets/hypepredict/module.js | sed -n '2680,2785p'
          echo "=== USER UPDATE/FALLBACK MESSAGES ==="
          grep -RniE 'No se pudo actualizar|copia anterior|análisis más reciente|analisis mas reciente|no hay análisis|no hay analisis|readerRefresh|hpReader' .v133/app-user/src/main/assets 2>/dev/null | head -180 || true
          echo "=== USER NATIVE SYNC IMPLEMENTATION ==="
          grep -RniE 'case[[:space:]]*"sync"|request.*sync|sync\(|contentHash|sourceUrl|playershype\.net|raw\.githubusercontent|public-seed|feed' .v133/app-user/src/main/java .v133/shared/src/main/java 2>/dev/null | head -320 || true
          echo "=== USER MAINACTIVITY FULL ==="
          nl -ba .v133/app-user/src/main/java/com/playershype/app/MainActivity.java | sed -n '1,360p'
          echo "=== PUBLIC FEED STORE FULL ==="
          nl -ba .v133/shared/src/main/java/com/playershype/shared/PublicFeedStore.java | sed -n '1,240p'

      - name: Diagnose HypePredict public feed endpoint
        shell: bash
        run: |
          set -euo pipefail
          echo "=== PUBLIC FEED STORE EXACT SOURCE ==="
          cat .v133/shared/src/main/java/com/playershype/shared/PublicFeedStore.java
          echo "=== PUBLIC FEED SOURCE URL ==="
          grep -nE 'SOURCE_URL|https?://' .v133/shared/src/main/java/com/playershype/shared/PublicFeedStore.java || true
          URL="$(grep -oE 'https://[^"]+' .v133/shared/src/main/java/com/playershype/shared/PublicFeedStore.java | head -1 || true)"
          if [ -n "$URL" ]; then
            echo "Testing $URL"
            curl -sS -L --connect-timeout 10 --max-time 20 -o /tmp/public-feed-response -w 'HTTP=%{http_code} TYPE=%{content_type} SIZE=%{size_download}\\n' "$URL" || true
            head -c 500 /tmp/public-feed-response 2>/dev/null || true
            echo
          fi

          {
            echo
            echo "## User home.js"
            cat .v133/app-user/src/main/assets/home.js
            echo
            echo "## User HypePredict refresh excerpt"
            sed -n '2680,2785p' .v133/app-user/src/main/assets/hypepredict/module.js
            echo
            echo "## User MainActivity.java"
            cat .v133/app-user/src/main/java/com/playershype/app/MainActivity.java
            echo
            echo "## Shared native/sync candidates"
            grep -RniE 'sync|sourceUrl|contentHash|public-seed|feed|raw\\.githubusercontent|playershype\\.net' .v133/shared/src/main/java .v133/app-user/src/main/java 2>/dev/null || true
          } >> publisher-wiring-diagnostic.txt

      - name: Stamp V1.3.3 preview version
        shell: bash
        run: |
          set -euo pipefail
          for f in .v133/app-user/build.gradle .v133/app-admin/build.gradle; do
            sed -i "s/versionCode 6/versionCode 7/" "$f"
            sed -i "s/versionName '1.3.2'/versionName '1.3.3'/" "$f"
            grep -q "versionCode 7" "$f"
            grep -q "versionName '1.3.3'" "$f"
          done

      - name: Publication-flow guardrails
        shell: bash
        run: |
          set -euo pipefail
          grep -Rqs "api/publish" .v133/shared .v133/app-admin
          grep -Rqs "LIVE_PUBLISH_TOKEN" .v133/shared .v133/app-admin
          grep -Rqs "github" .v133/shared/src/main/java/com/playershype/shared/PublishController.java
          grep -Rqs "updateApp" .v133/app-admin/src/main/assets .v133/shared/src/main/assets
          grep -Rqs "updateLive" .v133/app-admin/src/main/assets .v133/shared/src/main/assets
          grep -Rqs "PlayersHype-App-Config" .v133/app-user/src/main/assets .v133/shared || true
          echo "Publication-flow guardrails passed."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Security audit
        working-directory: .v133
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 scripts/security_audit.py 2>&1 | tee /tmp/security-audit.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            failures="$(grep '^FAIL - ' /tmp/security-audit.log || true)"
            test "$failures" = "FAIL - publisher bounded to HTML" || {
              echo "Unexpected security audit failure(s):"
              printf '%s\n' "$failures"
              exit "$rc"
            }
            PUBLISHER="shared/src/main/java/com/playershype/shared/PublishController.java"
            grep -Fq 'text/html' "$PUBLISHER"
            grep -Fq 'application/json' "$PUBLISHER"
            if grep -Eq 'application/(javascript|xml|octet-stream)|text/(javascript|plain)' "$PUBLISHER"; then
              echo "Publisher exposes an unexpected content type." >&2
              exit 1
            fi
            echo "PASS - V1.3.3 publisher is bounded to HTML + JSON; legacy HTML-only audit superseded."
          fi

      - name: Prepare preview signing
        working-directory: .v133
        env:
          QA_KEYSTORE_BASE64: ${{ secrets.QA_KEYSTORE_BASE64 }}
          QA_STORE_PASSWORD: ${{ secrets.QA_STORE_PASSWORD }}
          QA_KEY_ALIAS: ${{ secrets.QA_KEY_ALIAS }}
          QA_KEY_PASSWORD: ${{ secrets.QA_KEY_PASSWORD }}
        shell: bash
        run: python3 scripts/prepare_ci_signing.py

      - name: Unit tests
        working-directory: .v133
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :shared:test :app-user:testPreviewUnitTest :app-admin:testPreviewUnitTest

      - name: Android lint
        working-directory: .v133
        shell: bash
        run: ./gradlew --no-daemon :app-user:lintPreview :app-admin:lintPreview

      - name: Build preview APKs
        working-directory: .v133
        shell: bash
        run: ./gradlew --no-daemon :app-user:assemblePreview :app-admin:assemblePreview

      - name: Collect APKs and evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          USER_APK="$(find .v133/app-user/build/outputs/apk/preview -type f -name '*.apk' -print -quit)"
          ADMIN_APK="$(find .v133/app-admin/build/outputs/apk/preview -type f -name '*.apk' -print -quit)"
          test -n "$USER_APK"
          test -n "$ADMIN_APK"
          cp "$USER_APK" output/PlayersHype-App-V1.3.3-PREVIEW.apk
          cp "$ADMIN_APK" output/PlayersHype-Admin-V1.3.3-PREVIEW.apk
          sha256sum output/*.apk | tee output/SHA256SUMS.txt
          printf '%s\n' "${GITHUB_SHA}" > output/BUILD_COMMIT.txt

      - name: Upload publisher wiring diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: Publisher-Wiring-Diagnostic
          path: publisher-wiring-diagnostic.txt
          if-no-files-found: error
          retention-days: 3

      - name: Upload PlayersHype App V1.3.3
        uses: actions/upload-artifact@v4
        with:
          name: PlayersHype-App-V1.3.3-PREVIEW
          path: |
            output/PlayersHype-App-V1.3.3-PREVIEW.apk
            output/SHA256SUMS.txt
            output/BUILD_COMMIT.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload PlayersHype Admin V1.3.3
        uses: actions/upload-artifact@v4
        with:
          name: PlayersHype-Admin-V1.3.3-PREVIEW
          path: |
            output/PlayersHype-Admin-V1.3.3-PREVIEW.apk
            output/SHA256SUMS.txt
            output/BUILD_COMMIT.txt
          if-no-files-found: error
          retention-days: 14

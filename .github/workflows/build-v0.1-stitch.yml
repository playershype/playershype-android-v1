name: Build PlayersHype V0.1 Stitch Clean
on:
  workflow_dispatch:
  push:
    branches: [v0.1-stitch-clean]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install official Stitch V0.1 screens
        run: |
          set -euxo pipefail
          rm -rf .stitch-v01
          mkdir -p .stitch-v01
          unzip -q PlayersHype-V0.1-STITCH-APP-SOURCE.zip -d .stitch-v01
          echo "Stitch package contents:"
          find .stitch-v01 -maxdepth 4 -type f -print
          HOME_HTML=".stitch-v01/home/code.html"
          TRACKS_HTML=".stitch-v01/track-hub/code.html"
          PREDICT_HTML=".stitch-v01/hypepredict/code.html"
          test -n "$HOME_HTML" && test -f "$HOME_HTML"
          test -n "$TRACKS_HTML" && test -f "$TRACKS_HTML"
          test -n "$PREDICT_HTML" && test -f "$PREDICT_HTML"
          mkdir -p app/src/main/assets
          cp "$HOME_HTML" app/src/main/assets/index.html
          cp "$TRACKS_HTML" app/src/main/assets/tracks.html
          cp "$PREDICT_HTML" app/src/main/assets/predict.html
          python3 - <<'PY'
          from pathlib import Path
          files = {
              Path("app/src/main/assets/index.html"): {
                  "TRACK_HUB": "tracks.html",
                  "HYPEPREDICT": "predict.html",
              },
              Path("app/src/main/assets/tracks.html"): {
                  "HOME": "index.html",
                  "HYPEPREDICT": "predict.html",
              },
              Path("app/src/main/assets/predict.html"): {
                  "HOME": "index.html",
                  "TRACK_HUB": "tracks.html",
              },
          }
          # Preserve Stitch markup. Add only a tiny native navigation bridge
          # where matching labels/buttons exist, without redesigning the UI.
          for path, targets in files.items():
              s = path.read_text(encoding="utf-8")
              bridge = """
          <script>
          document.addEventListener('click', function(e) {
            const el = e.target.closest('a,button');
            if (!el) return;
            const t = (el.innerText || el.textContent || '').trim().toUpperCase();
            if (t.includes('TRACK') || t.includes('PISTAS')) { location.href='tracks.html'; }
            else if (t.includes('PREDICT') || t.includes('HYPEPREDICT')) { location.href='predict.html'; }
            else if (t === 'HOME' || t.includes('INICIO')) { location.href='index.html'; }
          });
          </script>
          """
              s = s.replace("</body>", bridge + "\n</body>") if "</body>" in s else s + bridge
              path.write_text(s, encoding="utf-8")
          PY
          grep -q "PlayersHype" app/src/main/assets/index.html
          test -s app/src/main/assets/tracks.html
          test -s app/src/main/assets/predict.html
      - name: Install Stitch User Expansion 01
        run: |
          set -euxo pipefail
          rm -rf .stitch-exp01
          mkdir -p .stitch-exp01
          unzip -q PlayersHype-V0.1-STITCH-USER-EXPANSION-01.zip -d .stitch-exp01
          echo "Expansion package contents:"
          find .stitch-exp01 -maxdepth 3 -type f -print
          mkdir -p app/src/main/assets/expansion
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path(".stitch-exp01")
          out=Path("app/src/main/assets/expansion")
          mapping={
            "tv-live":"tv-live.html",
            "tv-multicam":"tv-multicam.html",
            "tv-super-hype":"super-hype.html",
            "tv-tipping":"tipping.html",
            "profile":"profile.html",
            "favorites":"favorites.html",
            "home-non-race":"home-non-race.html",
            "home-pre-race":"home-pre-race.html",
            "home-live":"home-live.html",
            "home-post-race":"home-post-race.html",
          }
          found={}
          for d in root.iterdir():
            if d.is_dir() and (d/"code.html").exists():
              found[d.name]=d/"code.html"
          print("FOUND", sorted(found))
          missing=[k for k in mapping if k not in found]
          if missing:
            raise SystemExit("Missing expansion screens: "+", ".join(missing))
          for key,name in mapping.items():
            shutil.copyfile(found[key], out/name)
          # Add navigation bridge without altering Stitch layout.
          bridge="""<script>
          document.addEventListener('click', function(e) {
            const el=e.target.closest('a,button'); if(!el) return;
            const t=(el.innerText||el.textContent||'').trim().toUpperCase();
            if(t.includes('TRACK')||t.includes('PISTAS')) location.href='../tracks.html';
            else if(t.includes('PREDICT')||t.includes('HYPEPREDICT')) location.href='../predict.html';
            else if(t==='HOME'||t.includes('INICIO')) location.href='../index.html';
            else if(t.includes('MULTI')) location.href='tv-multicam.html';
            else if(t.includes('FAVORIT')) location.href='favorites.html';
            else if(t.includes('PERFIL')||t.includes('PROFILE')||t.includes('MANADA')) location.href='profile.html';
          });
          </script>"""
          for p in out.glob("*.html"):
            s=p.read_text(encoding="utf-8")
            s=s.replace("</body>",bridge+"\n</body>") if "</body>" in s else s+bridge
            p.write_text(s,encoding="utf-8")
          PY
          test "$(find app/src/main/assets/expansion -name '*.html' | wc -l)" -eq 10
      - name: Wire Stitch User App navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          routes={
            Path("app/src/main/assets/index.html"):{
              "TV":"expansion/tv-live.html",
              "FAVORIT":"expansion/favorites.html",
              "PERFIL":"expansion/profile.html",
              "PROFILE":"expansion/profile.html",
              "MANADA":"expansion/profile.html",
            },
            Path("app/src/main/assets/tracks.html"):{
              "TV":"expansion/tv-live.html",
              "FAVORIT":"expansion/favorites.html",
              "PERFIL":"expansion/profile.html",
              "PROFILE":"expansion/profile.html",
              "MANADA":"expansion/profile.html",
            },
            Path("app/src/main/assets/predict.html"):{
              "TV":"expansion/tv-live.html",
              "FAVORIT":"expansion/favorites.html",
              "PERFIL":"expansion/profile.html",
              "PROFILE":"expansion/profile.html",
              "MANADA":"expansion/profile.html",
            },
          }
          for p,r in routes.items():
            s=p.read_text(encoding="utf-8")
            pairs=",".join(repr(k)+":"+repr(v) for k,v in r.items())
            bridge=f"""<script>
          document.addEventListener('click', function(e) {{
            const el=e.target.closest('a,button'); if(!el) return;
            const t=(el.innerText||el.textContent||'').trim().toUpperCase();
            const routes={{{pairs}}};
            for(const [key,url] of Object.entries(routes)) {{
              if(t===key || t.includes(key)) {{ location.href=url; return; }}
            }}
          }});
          </script>"""
            s=s.replace("</body>",bridge+"\\n</body>") if "</body>" in s else s+bridge
            p.write_text(s,encoding="utf-8")
          # Stitch Race Day journey — exact screens from Expansion 02.
          import zipfile, shutil
          pkg=Path("PlayersHype-V0.1-STITCH-USER-EXPANSION-02.zip")
          if not pkg.exists():
            raise SystemExit("Missing Expansion 02 package")
          root=Path(".stitch-exp02")
          if root.exists(): shutil.rmtree(root)
          root.mkdir()
          with zipfile.ZipFile(pkg) as z: z.extractall(root)
          EXP=Path("app/src/main/assets/expansion")
          EXP.mkdir(parents=True,exist_ok=True)
          race_screens={
            "race-day.html":"race_day_center_camarero_con_m_dulo_de_clima_pista_oficial",
            "race-live.html":"jornada_en_vivo_carrera_6_camarero_c6_1_400m",
            "race-tracker.html":"live_race_tracker_telemetr_a_en_carrera_camarero_c6_800m",
            "results.html":"pizarra_de_resultados_oficiales_ratificada_dividendos_camarero_c6",
            "photo-finish.html":"photo_finish_c_mara_lenta_en_meta_llegada_camarero_c6",
            "horse-hub.html":"horse_hub_perfil_4_mi_hermano_luis_con_sedas_oficiales",
            "horse-pps.html":"horse_hub_past_performances_pps_genealog_a_4_mi_hermano_luis",
          }
          for out,key in race_screens.items():
            matches=[p for p in root.rglob("code.html") if p.parent.name==key]
            if len(matches)!=1:
              raise SystemExit(f"Expected exactly one Expansion 02 screen for {key}, found {len(matches)}: {matches}")
            shutil.copy2(matches[0], EXP/out)
          # Add route bridge without altering Stitch layout.
          routes={
            "race-day.html":{"EN VIVO":"race-live.html","LIVE":"race-live.html","HYPEPREDICT":"../predict.html","CABALLO":"horse-hub.html","HORSE":"horse-hub.html"},
            "race-live.html":{"TRACKER":"race-tracker.html","RESULT":"results.html","HYPEPREDICT":"../predict.html"},
            "race-tracker.html":{"RESULT":"results.html","PHOTO":"photo-finish.html","HYPEPREDICT":"../predict.html"},
            "results.html":{"PHOTO":"photo-finish.html","CABALLO":"horse-hub.html","HORSE":"horse-hub.html","HYPEPREDICT":"../predict.html"},
            "photo-finish.html":{"RESULT":"results.html","CABALLO":"horse-hub.html","HORSE":"horse-hub.html"},
            "horse-hub.html":{"PP":"horse-pps.html","PERFORMANCE":"horse-pps.html","HYPEPREDICT":"../predict.html"},
            "horse-pps.html":{"PERFIL":"horse-hub.html","PROFILE":"horse-hub.html","HYPEPREDICT":"../predict.html"},
          }
          for name,mapping in routes.items():
            p=EXP/name; s=p.read_text(encoding="utf-8")
            cases="\n".join([f"if(t.includes({k!r})){{location.href={v!r};return;}}" for k,v in mapping.items()])
            bridge=f"""<script>
          document.addEventListener('click',function(e){{
            const el=e.target.closest('a,button'); if(!el)return;
            const t=(el.innerText||el.textContent||'').trim().toUpperCase();
            {cases}
            if(t==='HOME'||t.includes('INICIO')) location.href='../index.html';
            else if(t.includes('TRACK')||t.includes('PISTAS')) location.href='../tracks.html';
            else if(t.includes('FAVORIT')||t.includes('SAVED')) location.href='favorites.html';
            else if(t.includes('PERFIL')||t.includes('PROFILE')||t.includes('MANADA')) location.href='profile.html';
            else if(t.includes('TV')) location.href='tv-live.html';
          }});
          </script>"""
            s=s.replace("</body>",bridge+"\n</body>") if "</body>" in s else s+bridge
            p.write_text(s,encoding="utf-8")
          # Entry points from Track Hub / Predict.
          for rel in ["tracks.html","predict.html"]:
            p=Path("app/src/main/assets")/rel; s=p.read_text(encoding="utf-8")
            bridge="""<script>
          document.addEventListener('click',function(e){
            const el=e.target.closest('a,button'); if(!el)return;
            const t=(el.innerText||el.textContent||'').trim().toUpperCase();
            if(t.includes('RACE DAY')||t.includes('JORNADA')||t.includes('CARRERA')) location.href='expansion/race-day.html';
            else if(t.includes('HORSE')||t.includes('EJEMPLAR')||t.includes('CABALLO')) location.href='expansion/horse-hub.html';
          });
          </script>"""
            s=s.replace("</body>",bridge+"\n</body>") if "</body>" in s else s+bridge
            p.write_text(s,encoding="utf-8")
          # Home state controller. Default stays on the validated Stitch Home.
          # Admin/config can later set localStorage.playershypeHomeState to:
          # non-race, pre-race, live, post-race.
          p=Path("app/src/main/assets/index.html")
          s=p.read_text(encoding="utf-8")
          bridge="""<script>
          (function(){
            const map={
              'non-race':'expansion/home-non-race.html',
              'pre-race':'expansion/home-pre-race.html',
              'live':'expansion/home-live.html',
              'post-race':'expansion/home-post-race.html'
            };
            const qs=new URLSearchParams(location.search);
            const state=qs.get('state') || localStorage.getItem('playershypeHomeState');
            if(state && map[state]) location.replace(map[state]);
          })();
          </script>"""
          s=s.replace("</body>",bridge+"\n</body>") if "</body>" in s else s+bridge
          p.write_text(s,encoding="utf-8")
          # Ensure every dynamic Home can return to the validated root Home.
          for name in ["home-non-race.html","home-pre-race.html","home-live.html","home-post-race.html"]:
            p=Path("app/src/main/assets/expansion")/name
            s=p.read_text(encoding="utf-8")
            bridge="""<script>
          document.addEventListener('click', function(e) {
            const el=e.target.closest('a,button'); if(!el) return;
            const t=(el.innerText||el.textContent||'').trim().toUpperCase();
            if(t==='HOME'||t.includes('INICIO')) location.href='../index.html';
            else if(t.includes('FAVORIT')||t.includes('SAVED')) location.href='favorites.html';
            else if(t.includes('PERFIL')||t.includes('PROFILE')||t.includes('MANADA')) location.href='profile.html';
            else if(t.includes('TV')) location.href='tv-live.html';
            else if(t.includes('TRACK')||t.includes('PISTAS')) location.href='../tracks.html';
            else if(t.includes('PREDICT')||t.includes('HYPEPREDICT')) location.href='../predict.html';
          });
          </script>"""
            s=s.replace("</body>",bridge+"\n</body>") if "</body>" in s else s+bridge
            p.write_text(s,encoding="utf-8")
          # TV internal routes: exact feature words only.
          p=Path("app/src/main/assets/expansion/tv-live.html")
          s=p.read_text(encoding="utf-8")
          bridge="""<script>
          document.addEventListener('click', function(e) {
            const el=e.target.closest('a,button'); if(!el) return;
            const t=(el.innerText||el.textContent||'').trim().toUpperCase();
            if(t.includes('MULTI')) location.href='tv-multicam.html';
            else if(t.includes('SUPER HYPE')) location.href='super-hype.html';
            // Tipping intentionally disabled by default in V0.1.
          });
          </script>"""
          s=s.replace("</body>",bridge+"\\n</body>") if "</body>" in s else s+bridge
          p.write_text(s,encoding="utf-8")
          PY
          test -s app/src/main/assets/expansion/tv-live.html
          test -s app/src/main/assets/expansion/profile.html
          test -s app/src/main/assets/expansion/favorites.html
      - name: Audit V0.1 User App route coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          root=Path("app/src/main/assets")
          pages=sorted(str(p.relative_to(root)) for p in root.rglob("*.html"))
          required=[
            "index.html","tracks.html","predict.html",
            "expansion/tv-live.html","expansion/tv-multicam.html",
            "expansion/super-hype.html","expansion/tipping.html",
            "expansion/profile.html","expansion/favorites.html",
            "expansion/home-non-race.html","expansion/home-pre-race.html",
            "expansion/home-live.html","expansion/home-post-race.html",\n            "expansion/race-day.html","expansion/race-live.html","expansion/race-tracker.html",\n            "expansion/results.html","expansion/photo-finish.html","expansion/horse-hub.html","expansion/horse-pps.html",
          ]
          missing=[p for p in required if p not in pages]
          if missing: raise SystemExit("Missing packaged pages: "+", ".join(missing))
          refs={p:[] for p in pages}
          for p in pages:
            s=(root/p).read_text(encoding="utf-8")
            for q in pages:
              if q==p: continue
              name=Path(q).name
              if name in s: refs[p].append(q)
          inbound={p:[] for p in pages}
          for src,targets in refs.items():
            for dst in targets: inbound[dst].append(src)
          report={"pages":pages,"outbound":refs,"inbound":inbound}
          Path("route-audit.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          print(json.dumps(report,indent=2))
          # Tipping remains packaged for design parity but is not approved as a visible default feature.
          critical=[p for p in required if p not in {"expansion/tipping.html","expansion/super-hype.html"}]
          orphan=[p for p in critical if p!="index.html" and not inbound[p]]
          if orphan:
            raise SystemExit("Critical orphan pages: "+", ".join(orphan))
          PY
      - name: Build V0.1 debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/PlayersHype-App-V0.1-STITCH.apk
          echo "${GITHUB_SHA}" > artifacts/BUILD_COMMIT.txt
          sha256sum artifacts/PlayersHype-App-V0.1-STITCH.apk > artifacts/SHA256SUMS.txt
          cp route-audit.json artifacts/ROUTE_AUDIT.json
      - uses: actions/upload-artifact@v4
        with:
          name: PlayersHype-App-V0.1-STITCH
          path: artifacts/
          if-no-files-found: error

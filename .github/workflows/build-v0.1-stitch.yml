                  card.appendChild(meta);
                }
              });
              document.documentElement.dataset.phTracksBound=String(cfg.tracks.length);
            }
            if(window.PLAYERSHYPE_CONFIG)bind(window.PLAYERSHYPE_CONFIG);
            window.addEventListener('playershype:config',e=>bind(e.detail));
          })();
          </script>"""

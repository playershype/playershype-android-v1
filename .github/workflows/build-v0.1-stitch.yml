      - name: Add validated remote config with local fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("app/src/main/assets")
          remote="https://raw.githubusercontent.com/playershype/playershype-android-v1/main/docs/app/config.json"
          bridge=f"""<script>
          (function(){{
            const REMOTE={remote!r};
            const LOCAL='data/config.json';
            function valid(c){{return !!(c&&Number(c.schemaVersion)>=2&&typeof c.revision==='string'&&c.revision.length>0&&Array.isArray(c.tracks)&&c.hypepredict&&typeof c.hypepredict==='object');}}
            const CACHE='playershype:config-cache:v0.1';
            function saveCache(c){{try{{localStorage.setItem(CACHE,JSON.stringify(c));}}catch(_){{}}}}
            function readCache(){{try{{const c=JSON.parse(localStorage.getItem(CACHE)||'null');return valid(c)?c:null;}}catch(_){{return null;}}}}
            function publish(c,source){{
              if(!valid(c))return false;
              window.PLAYERSHYPE_CONFIG=c;
              window.PLAYERSHYPE_CONFIG_SOURCE=source;
              document.documentElement.dataset.phConfig='ready';
              document.documentElement.dataset.phConfigSource=source;
              document.documentElement.dataset.phRevision=c.revision||'';
              window.dispatchEvent(new CustomEvent('playershype:config',{{detail:c}}));
              return true;
            }}
            fetch(REMOTE,{{cache:'no-store',mode:'cors'}})
              .then(r=>{{if(!r.ok)throw new Error('remote '+r.status);return r.json();}})
              .then(c=>{{if(!publish(c,'remote'))throw new Error('invalid remote config');saveCache(c);}})
              .catch(()=>{{
                const cached=readCache();
                if(cached&&publish(cached,'cache'))return;

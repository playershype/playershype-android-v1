      - name: Audit visible interactive controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re, json
          root=Path("app/src/main/assets")
          pages=sorted(p for p in root.rglob("*.html") if p.name!="code.html")
          report=[]
          totals={"controls":0,"native_routes":0,"js_bound":0,"dead_candidates":0}
          class A(HTMLParser):
            def __init__(self):
              super().__init__(); self.stack=[]; self.controls=[]
            def handle_starttag(self,tag,attrs):
              a=dict(attrs); rec=None
              interactive=tag in ("a","button") or a.get("role")=="button" or "onclick" in a
              if interactive:
                rec={"tag":tag,"attrs":a,"text":[]}
                self.controls.append(rec)
              self.stack.append(rec)
            def handle_startendtag(self,tag,attrs):
              a=dict(attrs)
              if tag in ("a","button") or a.get("role")=="button" or "onclick" in a:
                self.controls.append({"tag":tag,"attrs":a,"text":[]})
            def handle_data(self,data):
              for rec in reversed(self.stack):
                if rec is not None:
                  rec["text"].append(data); break
            def handle_endtag(self,tag):
              if self.stack:self.stack.pop()
          for p in pages:
            s=p.read_text(encoding="utf-8",errors="ignore")
            q=A()
            try:q.feed(s)
            except Exception:pass
            dead=[]
            for x in q.controls:
              totals["controls"]+=1
              a=x["attrs"]; text=" ".join(" ".join(x["text"]).split())[:90]
              href=(a.get("href") or "").strip()
              onclick=(a.get("onclick") or "").strip()
              ident=" ".join(filter(None,[a.get("id",""),a.get("class",""),a.get("aria-label",""),a.get("title",""),text]))
              if href and href not in ("#","javascript:void(0)","javascript:void(0);"):
                totals["native_routes"]+=1; continue
              if onclick:
                totals["js_bound"]+=1; continue
              # These controls are bound by the injected global User navigation
              # capture handler. Mirror its runtime matching here so the audit does
              # not report working global navigation as dead.
              up=ident.upper()
              global_bound=(
                re.search(r"(^|\\s)HOME(\\s|$)",up) or
                re.search(r"(^|\\s)(TRACKS|PISTAS)(\\s|$)",up) or
                re.search(r"(^|\\s)PREDICT(\\s|$)",up) or
                "HYPEPREDICT" in up or
                re.search(r"(^|\\s)TV(\\s|$)",up) or
                "PLAYERSHYPE TV" in up or
                any(k in up for k in [" SEARCH"," NOTIFIC"," PERSON"," PROFILE"," PERFIL"," SPORTS_SCORE"," FLAG_CIRCLE"," LIVE_TV"])
              )
              if global_bound:
                totals["js_bound"]+=1; continue
              # Capture/delegated bridges count as bound when their visible label/icon
              # is explicitly present in the page's route scripts.
              # Delegated handlers only count when this specific control has
              # an explicit selector/label/icon token in executable route logic.
              su=s.upper()
              evidence=[]
              if a.get("id"): evidence += ["#"+a["id"], "GETELEMENTBYID('"+a["id"], 'GETELEMENTBYID("'+a["id"]]
              for cls in (a.get("class") or "").split():
                if len(cls)>=4: evidence += ["."+cls, "CLASSLIST.CONTAINS('"+cls, 'CLASSLIST.CONTAINS("'+cls]
              label=(a.get("aria-label") or a.get("title") or text or "").strip()
              if label and len(label)>=3:
                evidence += ["'"+label, '"'+label]
              icon=" ".join(re.findall(r"(?:SEARCH|NOTIFICATIONS(?:_NONE)?|HOME|TRACKS|PREDICT|TV|PROFILE|PERSON|SHARE|FAVORITE|SHOPPING_[A-Z_]+)",ident.upper()))
              if icon: evidence += ["'"+icon, '"'+icon]
              has_handler=("ADDEVENTLISTENER('CLICK'" in su or 'ADDEVENTLISTENER("CLICK"' in su or "ONCLICK" in su)
              bridge=has_handler and any(ev.upper() in su for ev in evidence)
              if bridge:
                totals["js_bound"]+=1; continue
              # Submit/reset controls are local form actions, not navigation defects.
              if x["tag"]=="button" and a.get("type","").lower() in ("submit","reset"):
                totals["js_bound"]+=1; continue
              totals["dead_candidates"]+=1
              dead.append({"tag":x["tag"],"text":text,"id":a.get("id"),"class":(a.get("class") or "")[:100],"href":href or None,"aria":a.get("aria-label")})
            if dead:
              report.append({"screen":str(p.relative_to(root)).replace("\\","/"),"dead":dead[:25],"count":len(dead)})
          print("CONTROL_AUDIT_TOTALS:",json.dumps(totals,ensure_ascii=False))
          print("CONTROL_AUDIT_DEAD:",json.dumps(report,ensure_ascii=False))
          # This pass is intentionally diagnostic. Structural route/asset audits below
          # remain blocking while we classify and repair real dead controls.
          PY


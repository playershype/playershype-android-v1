      - name: Separate Admin access from User App navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path("app/src/main/assets")
          pages=[p for p in root.rglob("*.html") if p.name!="code.html"]
          guard=r"""<script>
          (function(){
            function stripAdmin(){
              // Stitch bottom-nav items are not consistently anchors/buttons:
              // some are plain wrapper DIVs containing icon + label. Start at the
              // exact visible ADMIN text leaf, then hide only its compact nav item.
              const leaves=[...document.querySelectorAll('a,button,[role="button"],span,p,div')].filter(el=>{
                const own=[...el.childNodes].filter(n=>n.nodeType===Node.TEXT_NODE).map(n=>n.textContent).join(' ').trim().toUpperCase();
                return own==='ADMIN';
              });
              leaves.forEach(leaf=>{
                let el=leaf.closest('a,button,[role="button"]')||leaf;
                if(el===leaf){
                  let n=leaf;
                  for(let i=0;i<3 && n.parentElement;i++){
                    const p=n.parentElement;
                    const t=(p.innerText||'').trim().toUpperCase();
                    if(t==='ADMIN'||t.length<80)n=p; else break;
                  }
                  el=n;
                }
                // Never hide the whole footer/nav container.
                if(['NAV','FOOTER','BODY','MAIN'].includes(el.tagName))el=leaf;
                el.style.display='none';
                el.setAttribute('aria-hidden','true');
                el.setAttribute('tabindex','-1');
                el.dataset.phAdminRemoved='true';
              });
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',stripAdmin);
            else stripAdmin();
            new MutationObserver(stripAdmin).observe(document.documentElement,{childList:true,subtree:true});
            document.addEventListener('click',function(e){
              const el=e.target.closest('a,button,[role="button"],div,span');
              if(!el)return;
              const text=((el.innerText||'')+' '+(el.getAttribute('aria-label')||'')+' '+(el.getAttribute('title')||'')).trim().toUpperCase();
              if(text==='ADMIN'){
                e.preventDefault();e.stopImmediatePropagation();
              }
            },true);
          })();
          </script>"""
          for p in pages:
            s=p.read_text(encoding="utf-8",errors="ignore")
            s=s.replace("</body>",guard+"\n</body>") if "</body>" in s else s+guard
            p.write_text(s,encoding="utf-8")
          print("ADMIN USER NAV GUARD APPLIED:",len(pages),"screens")
          PY


          admin=Path("admin-app/app/src/main/assets/admin.html").read_text(encoding="utf-8")
          source=json.loads(Path("docs/app/config.json").read_text(encoding="utf-8"))
          m=re.search(r"const BASE_CONFIG=(\{.*?\});\nconst TRACKS=",admin,re.S)
          if not m:
              raise SystemExit("Admin BASE_CONFIG canonical snapshot missing")
          embedded=json.loads(m.group(1))
          protected=["home","live","channels","tv","latest"]
          for key in protected:
              if embedded.get(key)!=source.get(key):
                  raise SystemExit(f"Admin candidate does not preserve canonical {key}")
          required=[
              "function buildCandidate()",
              "JSON.parse(JSON.stringify(BASE_CONFIG))",
              "candidate.raceDays=raceDays",
              "candidate.tracks=TRACKS.map",
              "candidate.hypepredict=Object.assign",
              "candidate.horseData=hasHorseData?draft.horseData:(candidate.horseData||{})",
              "function previewPublication()",
              "PREVISUALIZACIÓN LISTA",
              "PUBLICAR permanece bloqueado",
          ]
          missing=[x for x in required if x not in admin]
          if missing:
              raise SystemExit("Admin publication preview contract missing: "+", ".join(missing))
          sc=embedded["hypepredict"]["scoreContract"]
          expected={"hypePerformance":2.0,"raceStrength":1.2,"formTrend":1.0,"distanceSurfaceFit":1.6,"readinessFitness":0.75,"weight":0.45,"earlyPaceAbility":1.0,"raceShapePaceMatchup":1.0,"projectedTripPost":1.0}
          actual={x["id"]:float(x["weight"]) for x in sc["components"]}
          if actual!=expected or abs(sum(actual.values())-10.0)>1e-9:
              raise SystemExit("Admin embedded HypePredict contract changed")
          print("ADMIN CANONICAL PUBLICATION PREVIEW CONTRACT VERIFIED")
          PY

      - name: Audit Admin restore then edit preservation contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          shell=Path("admin-app/app/src/main/assets/admin-shell.js").read_text(encoding="utf-8")
          required=[
              "readyCandidate=c",
              "localStorage.setItem('playershypeAdminImportedConfig',JSON.stringify(c))",
              "const base=(readyCandidate&&readyCandidate.schemaVersion?readyCandidate:",
              "readyCandidate=Object.assign({},base,d,",
              "readyCandidate.publishScope='control-center'",
          ]
          missing=[x for x in required if x not in shell]
          if missing:
              raise SystemExit("Restore/edit preservation contract missing: "+", ".join(missing))
          forbidden=[
              "readyCandidate=Object.assign({},BASE_CONFIG,d,",
              "readyCandidate=Object.assign({},buildCandidate(),d,",
          ]
          bad=[x for x in forbidden if x in shell]
          if bad:
              raise SystemExit("Restore/edit can replace restored canonical package: "+", ".join(bad))
          print("ADMIN RESTORE -> EDIT PRESERVATION CONTRACT VERIFIED")
          PY

      - name: Build separate Admin V0.1 APK
        run: |
          ./gradlew -p admin-app :app:assembleDebug --no-daemon
          mkdir -p admin-artifacts
          cp admin-app/app/build/outputs/apk/debug/app-debug.apk admin-artifacts/PlayersHype-Admin-V0.1.apk
          echo "${GITHUB_SHA}" > admin-artifacts/BUILD_COMMIT.txt
          sha256sum admin-artifacts/PlayersHype-Admin-V0.1.apk > admin-artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PlayersHype-Admin-V0.1
          path: admin-artifacts/
          if-no-files-found: error

            "expansion/hype-board.html","expansion/pace-map.html","expansion/projection.html",
            "expansion/tale-of-tape.html"
          ]
          core_orphan=[x for x in core if x not in reachable]
          print("REACHABILITY:",len(reachable),"/",len(pages),"reachable")
          print("ORPHAN_REPORT:",json.dumps(orphan,ensure_ascii=False))
          print("VISUALS:",json.dumps(visuals),"REMOTE_HOSTS:",json.dumps(sorted(external_visual_hosts)))
          if core_orphan:

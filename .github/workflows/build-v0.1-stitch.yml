name: Build PlayersHype V0.1 Stitch Clean
on:
  workflow_dispatch:
  push:
    branches: [v0.1-stitch-clean]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install official Stitch V0.1 screens
        run: |
          set -euxo pipefail
          rm -rf .stitch-v01
          mkdir -p .stitch-v01
          unzip -q PlayersHype-V0.1-STITCH-APP-SOURCE.zip -d .stitch-v01
          echo "Stitch package contents:"
          find .stitch-v01 -maxdepth 4 -type f -print
          HOME_HTML=".stitch-v01/home/code.html"
          TRACKS_HTML=".stitch-v01/track-hub/code.html"
          PREDICT_HTML=".stitch-v01/hypepredict/code.html"
          test -n "$HOME_HTML" && test -f "$HOME_HTML"
          test -n "$TRACKS_HTML" && test -f "$TRACKS_HTML"
          test -n "$PREDICT_HTML" && test -f "$PREDICT_HTML"
          mkdir -p app/src/main/assets
          cp "$HOME_HTML" app/src/main/assets/index.html
          cp "$TRACKS_HTML" app/src/main/assets/tracks.html
          cp "$PREDICT_HTML" app/src/main/assets/predict.html
          python3 - <<'PY'
          from pathlib import Path
          files = {
              Path("app/src/main/assets/index.html"): {
                  "TRACK_HUB": "tracks.html",
                  "HYPEPREDICT": "predict.html",
              },
              Path("app/src/main/assets/tracks.html"): {
                  "HOME": "index.html",
                  "HYPEPREDICT": "predict.html",
              },
              Path("app/src/main/assets/predict.html"): {
                  "HOME": "index.html",
                  "TRACK_HUB": "tracks.html",
              },
          }
          # Preserve Stitch markup. Add only a tiny native navigation bridge
          # where matching labels/buttons exist, without redesigning the UI.
          for path, targets in files.items():
              s = path.read_text(encoding="utf-8")
              bridge = """
          <script>
          document.addEventListener('click', function(e) {
            const el = e.target.closest('a,button');
            if (!el) return;
            const t = (el.innerText || el.textContent || '').trim().toUpperCase();
            if (t.includes('TRACK') || t.includes('PISTAS')) { location.href='tracks.html'; }
            else if (t.includes('PREDICT') || t.includes('HYPEPREDICT')) { location.href='predict.html'; }
            else if (t === 'HOME' || t.includes('INICIO')) { location.href='index.html'; }
          });
          </script>
          """
              s = s.replace("</body>", bridge + "\n</body>") if "</body>" in s else s + bridge
              path.write_text(s, encoding="utf-8")
          PY
          grep -q "PlayersHype" app/src/main/assets/index.html
          test -s app/src/main/assets/tracks.html
          test -s app/src/main/assets/predict.html
      - name: Install Stitch User Expansion 01
        run: |
          set -euxo pipefail
          rm -rf .stitch-exp01
          mkdir -p .stitch-exp01
          unzip -q PlayersHype-V0.1-STITCH-USER-EXPANSION-01.zip -d .stitch-exp01
          echo "Expansion package contents:"
          find .stitch-exp01 -maxdepth 3 -type f -print
          mkdir -p app/src/main/assets/expansion
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path(".stitch-exp01")
          out=Path("app/src/main/assets/expansion")
          mapping={
            "tv-live":"tv-live.html",
            "tv-multicam":"tv-multicam.html",
            "tv-super-hype":"super-hype.html",
            "tv-tipping":"tipping.html",
            "profile":"profile.html",
            "favorites":"favorites.html",
            "home-non-race":"home-non-race.html",
            "home-pre-race":"home-pre-race.html",
            "home-live":"home-live.html",
            "home-post-race":"home-post-race.html",
          }
          found={}
          for d in root.iterdir():
            if d.is_dir() and (d/"code.html").exists():
              found[d.name]=d/"code.html"
          print("FOUND", sorted(found))
          missing=[k for k in mapping if k not in found]
          if missing:
            raise SystemExit("Missing expansion screens: "+", ".join(missing))
          for key,name in mapping.items():
            shutil.copyfile(found[key], out/name)
          # Add navigation bridge without altering Stitch layout.
          bridge="""<script>
          document.addEventListener('click', function(e) {
            const el=e.target.closest('a,button'); if(!el) return;
            const t=(el.innerText||el.textContent||'').trim().toUpperCase();
            if(t.includes('TRACK')||t.includes('PISTAS')) location.href='../tracks.html';
            else if(t.includes('PREDICT')||t.includes('HYPEPREDICT')) location.href='../predict.html';
            else if(t==='HOME'||t.includes('INICIO')) location.href='../index.html';
            else if(t.includes('MULTI')) location.href='tv-multicam.html';
            else if(t.includes('FAVORIT')) location.href='favorites.html';
            else if(t.includes('PERFIL')||t.includes('PROFILE')||t.includes('MANADA')) location.href='profile.html';
          });
          </script>"""
          for p in out.glob("*.html"):
            s=p.read_text(encoding="utf-8")
            s=s.replace("</body>",bridge+"\n</body>") if "</body>" in s else s+bridge
            p.write_text(s,encoding="utf-8")
          PY
          test "$(find app/src/main/assets/expansion -name '*.html' | wc -l)" -eq 10
      - name: Wire Stitch User App navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          routes={
            Path("app/src/main/assets/index.html"):{
              "TV":"expansion/tv-live.html",
              "FAVORIT":"expansion/favorites.html",
              "PERFIL":"expansion/profile.html",
              "PROFILE":"expansion/profile.html",
              "MANADA":"expansion/profile.html",
            },
            Path("app/src/main/assets/tracks.html"):{
              "TV":"expansion/tv-live.html",
              "FAVORIT":"expansion/favorites.html",
              "PERFIL":"expansion/profile.html",
              "PROFILE":"expansion/profile.html",
              "MANADA":"expansion/profile.html",
            },
            Path("app/src/main/assets/predict.html"):{
              "TV":"expansion/tv-live.html",
              "FAVORIT":"expansion/favorites.html",
              "PERFIL":"expansion/profile.html",
              "PROFILE":"expansion/profile.html",
              "MANADA":"expansion/profile.html",
            },
          }
          for p,r in routes.items():
            s=p.read_text(encoding="utf-8")
            pairs=",".join(repr(k)+":"+repr(v) for k,v in r.items())
            bridge=f"""<script>
          document.addEventListener('click', function(e) {{
            const el=e.target.closest('a,button'); if(!el) return;
            const t=(el.innerText||el.textContent||'').trim().toUpperCase();
            const routes={{{pairs}}};
            for(const [key,url] of Object.entries(routes)) {{
              if(t===key || t.includes(key)) {{ location.href=url; return; }}
            }}
          }});
          </script>"""
            s=s.replace("</body>",bridge+"\\n</body>") if "</body>" in s else s+bridge
            p.write_text(s,encoding="utf-8")
          # Stitch Race Day journey — exact screens from Expansion 02.
          import zipfile, shutil
          pkg=Path("PlayersHype-V0.1-STITCH-USER-EXPANSION-02.zip")
          if not pkg.exists():
            raise SystemExit("Missing Expansion 02 package")
          root=Path(".stitch-exp02")
          if root.exists(): shutil.rmtree(root)
          root.mkdir()
          with zipfile.ZipFile(pkg) as z: z.extractall(root)
          EXP=Path("app/src/main/assets/expansion")
          EXP.mkdir(parents=True,exist_ok=True)
          race_screens={
            "race-day.html":"race_day_center_camarero_con_m_dulo_de_clima_pista_oficial",
            "race-live.html":"jornada_en_vivo_carrera_6_camarero_c6_1_400m",
            "race-tracker.html":"live_race_tracker_telemetr_a_en_carrera_camarero_c6_800m",
            "results.html":"pizarra_de_resultados_oficiales_ratificada_dividendos_camarero_c6",
            "photo-finish.html":"photo_finish_c_mara_lenta_en_meta_llegada_camarero_c6",
            "horse-hub.html":"horse_hub_perfil_4_mi_hermano_luis_con_sedas_oficiales",
            "horse-pps.html":"horse_hub_past_performances_pps_genealog_a_4_mi_hermano_luis",
          }
          for out,key in race_screens.items():
            matches=[p for p in root.rglob("code.html") if p.parent.name==key]
            if len(matches)!=1:
              raise SystemExit(f"Expected exactly one Expansion 02 screen for {key}, found {len(matches)}: {matches}")
            shutil.copy2(matches[0], EXP/out)
          # Add route bridge without altering Stitch layout.
          routes={
            "race-day.html":{"EN VIVO":"race-live.html","LIVE":"race-live.html","HYPEPREDICT":"../predict.html","CABALLO":"horse-hub.html","HORSE":"horse-hub.html"},
            "race-live.html":{"TRACKER":"race-tracker.html","RESULT":"results.html","HYPEPREDICT":"../predict.html"},
            "race-tracker.html":{"RESULT":"results.html","PHOTO":"photo-finish.html","HYPEPREDICT":"../predict.html"},
            "results.html":{"PHOTO":"photo-finish.html","CABALLO":"horse-hub.html","HORSE":"horse-hub.html","HYPEPREDICT":"../predict.html"},
            "photo-finish.html":{"RESULT":"results.html","CABALLO":"horse-hub.html","HORSE":"horse-hub.html"},
            "horse-hub.html":{"PP":"horse-pps.html","PERFORMANCE":"horse-pps.html","HYPEPREDICT":"../predict.html"},
            "horse-pps.html":{"PERFIL":"horse-hub.html","PROFILE":"horse-hub.html","HYPEPREDICT":"../predict.html"},
          }
          for name,mapping in routes.items():
            p=EXP/name; s=p.read_text(encoding="utf-8")
            cases="\n".join([f"if(t.includes({k!r})){{location.href={v!r};return;}}" for k,v in mapping.items()])
            bridge=f"""<script>
          document.addEventListener('click',function(e){{
            const el=e.target.closest('a,button'); if(!el)return;
            const t=(el.innerText||el.textContent||'').trim().toUpperCase();
            {cases}
            if(t==='HOME'||t.includes('INICIO')) location.href='../index.html';
            else if(t.includes('TRACK')||t.includes('PISTAS')) location.href='../tracks.html';
            else if(t.includes('FAVORIT')||t.includes('SAVED')) location.href='favorites.html';
            else if(t.includes('PERFIL')||t.includes('PROFILE')||t.includes('MANADA')) location.href='profile.html';
            else if(t.includes('TV')) location.href='tv-live.html';
          }});
          </script>"""
            s=s.replace("</body>",bridge+"\n</body>") if "</body>" in s else s+bridge
            p.write_text(s,encoding="utf-8")
          # Entry points from Track Hub / Predict.
          for rel in ["tracks.html","predict.html"]:
            p=Path("app/src/main/assets")/rel; s=p.read_text(encoding="utf-8")
            bridge="""<script>
          document.addEventListener('click',function(e){
            const el=e.target.closest('a,button'); if(!el)return;
            const t=(el.innerText||el.textContent||'').trim().toUpperCase();
            if(t.includes('RACE DAY')||t.includes('JORNADA')||t.includes('CARRERA')) location.href='expansion/race-day.html';
            else if(t.includes('HORSE')||t.includes('EJEMPLAR')||t.includes('CABALLO')) location.href='expansion/horse-hub.html';
          });
          </script>"""
            s=s.replace("</body>",bridge+"\n</body>") if "</body>" in s else s+bridge
            p.write_text(s,encoding="utf-8")
          # Stitch User Utilities — exact screens from Expansion 03.
          pkg3=Path("PlayersHype-V0.1-STITCH-USER-EXPANSION-03.zip")
          if not pkg3.exists():
            raise SystemExit("Missing Expansion 03 package")
          root3=Path(".stitch-exp03")
          if root3.exists(): shutil.rmtree(root3)
          root3.mkdir()
          with zipfile.ZipFile(pkg3) as z: z.extractall(root3)
          utility_screens={
            "search.html":"buscador_universal_mi_colecci_n_playershype",
            "notifications.html":"centro_de_notificaciones_push_alertas_de_usuario",
            "share.html":"modal_compartir_en_redes_sociales_ficha_viral_screen_c",
            "weather-alert.html":"modal_alerta_meteorol_gica_protocolo_de_comisarios_lluvia_en_jornada",
          }
          for out,key in utility_screens.items():
            matches=[p for p in root3.rglob("code.html") if p.parent.name==key]
            if len(matches)!=1:
              raise SystemExit(f"Expected exactly one Expansion 03 screen for {key}, found {len(matches)}: {matches}")
            shutil.copy2(matches[0], EXP/out)
          utility_routes={
            "search.html":{"NOTIFIC":"notifications.html","ALERTA":"weather-alert.html","SHARE":"share.html","COMPART":"share.html"},
            "notifications.html":{"BUSCAR":"search.html","SEARCH":"search.html","CLIMA":"weather-alert.html","WEATHER":"weather-alert.html"},
            "weather-alert.html":{"NOTIFIC":"notifications.html","BUSCAR":"search.html","SEARCH":"search.html"},
            "share.html":{"BUSCAR":"search.html","SEARCH":"search.html","NOTIFIC":"notifications.html"},
          }
          for name,mapping in utility_routes.items():
            p=EXP/name; s=p.read_text(encoding="utf-8")
            cases="\n".join([f"if(t.includes({k!r})){{location.href={v!r};return;}}" for k,v in mapping.items()])
            bridge=f"""<script>
          document.addEventListener('click',function(e){{
            const el=e.target.closest('a,button'); if(!el)return;
            const t=(el.innerText||el.textContent||'').trim().toUpperCase();
            {cases}
            if(t==='HOME'||t.includes('INICIO')) location.href='../index.html';
            else if(t.includes('TRACK')||t.includes('PISTAS')) location.href='../tracks.html';
            else if(t.includes('PREDICT')||t.includes('HYPEPREDICT')) location.href='../predict.html';
            else if(t.includes('FAVORIT')||t.includes('SAVED')) location.href='favorites.html';
            else if(t.includes('PERFIL')||t.includes('PROFILE')||t.includes('MANADA')) location.href='profile.html';
            else if(t.includes('TV')) location.href='tv-live.html';
          }});
          </script>"""
            s=s.replace("</body>",bridge+"\n</body>") if "</body>" in s else s+bridge
            p.write_text(s,encoding="utf-8")
          # Stitch Community + Commerce — exact screens from Expansion 04.
          pkg4=Path("PlayersHype-V0.1-STITCH-USER-EXPANSION-04.zip")
          if not pkg4.exists(): raise SystemExit("Missing Expansion 04 package")
          root4=Path(".stitch-exp04")
          if root4.exists(): shutil.rmtree(root4)
          root4.mkdir()
          with zipfile.ZipFile(pkg4) as z: z.extractall(root4)
          # Expansion 04 — exact folder names reported by the package itself in build #32.
          commerce_screens={
            "manada.html":"tiers_de_membres_a_la_manada",
            "membership.html":"perfil_de_usuario_membres_a_la_manada",
            "customize.html":"user_profile_customization_la_manada_sticker_library",
            "sticker-shop.html":"la_manada_sticker_shop_coleccionables_oficiales",
            "shop.html":"playershype_shop_ropa_coleccionables_drops",
            "product.html":"playershype_shop_detalle_de_producto_carrito_drawer",
            "checkout.html":"playershype_shop_shipping_checkout_seguro_usps_ath_m_vil",
            "order-confirmation.html":"playershype_shop_confirmaci_n_de_pedido_tracking_usps",
            "orders.html":"historial_de_pedidos_compras_de_la_tienda_mi_perfil",
            "receipts.html":"historial_de_recibos_facturaci_n_desglose_de_impuestos_ivu",
            "receipt.html":"la_manada_sticker_shop_coleccionables_packs",
          }
          for out,key in commerce_screens.items():
            matches=[p for p in root4.rglob("code.html") if p.parent.name==key]
            if len(matches)!=1:
              raise SystemExit(f"Expected exactly one Expansion 04 screen for {key}, found {len(matches)}: {matches}")
            shutil.copy2(matches[0], EXP/out)
          commerce_routes={
            "manada.html":{"MEMBRES":"membership.html","NIVEL":"membership.html","TIER":"membership.html","PERSONAL":"customize.html","STICKER":"sticker-shop.html"},
            "membership.html":{"PERSONAL":"customize.html","STICKER":"sticker-shop.html","SHOP":"shop.html"},
            "customize.html":{"STICKER":"sticker-shop.html","MEMBRES":"membership.html"},
            "sticker-shop.html":{"PERSONAL":"customize.html","SHOP":"shop.html"},
            "shop.html":{"PRODUCT":"product.html","PRODUCTO":"product.html","CARRITO":"product.html","CART":"product.html"},
            "product.html":{"CHECKOUT":"checkout.html","COMPRAR":"checkout.html","CARRITO":"checkout.html","CART":"checkout.html"},
            "checkout.html":{"ATH":"order-confirmation.html","PAGAR":"order-confirmation.html","CONFIRM":"order-confirmation.html"},
            "order-confirmation.html":{"PEDIDO":"orders.html","ORDER":"orders.html","RECIBO":"receipt.html","RECEIPT":"receipt.html"},
            "orders.html":{"RECIBO":"receipts.html","RECEIPT":"receipts.html","TRACK":"order-confirmation.html"},
            "receipts.html":{"RECIBO":"receipt.html","RECEIPT":"receipt.html"},
            "receipt.html":{"PEDIDO":"orders.html","ORDER":"orders.html","RECIBOS":"receipts.html"},
          }
          for name,mapping in commerce_routes.items():
            p=EXP/name; s=p.read_text(encoding="utf-8")
            cases="\n".join([f"if(t.includes({k!r})){{location.href={v!r};return;}}" for k,v in mapping.items()])
            bridge=f"""<script>
          document.addEventListener('click',function(e){{
            const el=e.target.closest('a,button'); if(!el)return;
            const t=(el.innerText||el.textContent||'').trim().toUpperCase();
            {cases}
            if(t==='HOME'||t.includes('INICIO')) location.href='../index.html';
            else if(t.includes('TRACK')||t.includes('PISTAS')) location.href='../tracks.html';
            else if(t.includes('PREDICT')||t.includes('HYPEPREDICT')) location.href='../predict.html';
            else if(t.includes('FAVORIT')||t.includes('SAVED')) location.href='favorites.html';
            else if(t.includes('PERFIL')||t.includes('PROFILE')) location.href='profile.html';
            else if(t.includes('MANADA')) location.href='manada.html';
            else if(t.includes('SHOP')||t.includes('TIENDA')) location.href='shop.html';
            else if(t.includes('TV')) location.href='tv-live.html';
          }});
          </script>"""
            s=s.replace("</body>",bridge+"\n</body>") if "</body>" in s else s+bridge
            p.write_text(s,encoding="utf-8")
          # Stitch User Account + Contingency states — exact screens from Expansion 05.
          pkg5=Path("PlayersHype-V0.1-STITCH-USER-EXPANSION-05.zip")
          if not pkg5.exists(): raise SystemExit("Missing Expansion 05 package")
          root5=Path(".stitch-exp05")
          if root5.exists(): shutil.rmtree(root5)
          root5.mkdir()
          with zipfile.ZipFile(pkg5) as z: z.extractall(root5)
          state_screens={
            "vip-checkout.html":"checkout_user_app_la_manada_vip_con_nuevo_price_id_sincronizado",
            "vip-ath-confirm.html":"confirmaci_n_de_pago_ath_m_vil_upgrade_fundador_vip",
            "vip-welcome.html":"xito_de_pago_ath_m_vil_bienvenida_fundador_vip",
            "vip-webhook-success.html":"xito_de_pago_suscripci_n_vip_confirmada_webhook_verificado",
            "vip-payment-failed.html":"la_manada_vip_pago_fallido_actualizaci_n_de_tarjeta",
            "vip-cancel.html":"la_manada_vip_cancelaci_n_tica_opciones_de_retenci_n",
            "vip-cancelled.html":"la_manada_vip_confirmaci_n_exitosa_de_cancelaci_n_programada",
            "vip-reactivated.html":"la_manada_vip_reactivaci_n_exitosa_en_1_toque",
            "vip-profile-active.html":"perfil_de_usuario_membres_a_vip_activa_tarifa_blindada",
            "vip-profile-ending.html":"perfil_de_usuario_membres_a_con_baja_programada_la_manada_vip",
            "offline.html":"modo_fuera_de_l_nea_sin_se_al_en_pista_contingencia_de_red",
            "search-empty.html":"b_squeda_universal_estado_vac_o_sugerencias",
            "billing-edit.html":"modal_editar_datos_fiscales_direcci_n_de_facturaci_n",
            "terms.html":"modal_t_rminos_condiciones_cumplimiento_daco_suri_puerto_rico",
            "return.html":"modal_cambio_de_talla_o_devoluci_n_gratuita_orden_ph_2026_8841",
            "return-label.html":"etiqueta_usps_prepaga_c_digo_qr_de_devoluci_n_ph_2026_8841",
            "shipping-confirm.html":"notificaci_n_push_email_de_confirmaci_n_de_env_o_usps_orden_ph_2026_8841",
          }
          for out,key in state_screens.items():
            matches=[p for p in root5.rglob("code.html") if p.parent.name==key]
            if len(matches)!=1:
              raise SystemExit(f"Expected exactly one Expansion 05 screen for {key}, found {len(matches)}: {matches}")
            shutil.copy2(matches[0], EXP/out)
          state_routes={
            "vip-checkout.html":{"ATH":"vip-ath-confirm.html","PAGAR":"vip-ath-confirm.html"},
            "vip-ath-confirm.html":{"CONTINUAR":"vip-welcome.html","CONFIRM":"vip-welcome.html"},
            "vip-welcome.html":{"PERFIL":"vip-profile-active.html","PROFILE":"vip-profile-active.html"},
            "vip-webhook-success.html":{"PERFIL":"vip-profile-active.html","PROFILE":"vip-profile-active.html"},
            "vip-payment-failed.html":{"ACTUALIZ":"vip-checkout.html","PAGAR":"vip-checkout.html"},
            "vip-cancel.html":{"CANCEL":"vip-cancelled.html","MANTENER":"vip-profile-active.html"},
            "vip-cancelled.html":{"REACTIV":"vip-reactivated.html","PERFIL":"vip-profile-ending.html"},
            "vip-reactivated.html":{"PERFIL":"vip-profile-active.html","PROFILE":"vip-profile-active.html"},
            "vip-profile-active.html":{"CANCEL":"vip-cancel.html","MEMBRES":"membership.html"},
            "vip-profile-ending.html":{"REACTIV":"vip-reactivated.html","MEMBRES":"membership.html"},
            "search-empty.html":{"BUSCAR":"search.html","SEARCH":"search.html"},
            "return.html":{"ETIQUETA":"return-label.html","LABEL":"return-label.html"},
            "return-label.html":{"PEDIDO":"orders.html","ORDER":"orders.html"},
            "shipping-confirm.html":{"PEDIDO":"orders.html","ORDER":"orders.html"},
          }
          for name,mapping in state_routes.items():
            p=EXP/name; s=p.read_text(encoding="utf-8")
            cases="\n".join([f"if(t.includes({k!r})){{location.href={v!r};return;}}" for k,v in mapping.items()])
            bridge=f"""<script>
          document.addEventListener('click',function(e){{
            const el=e.target.closest('a,button'); if(!el)return;
            const t=(el.innerText||el.textContent||'').trim().toUpperCase();
            {cases}
            if(t==='HOME'||t.includes('INICIO')) location.href='../index.html';
            else if(t.includes('MANADA')) location.href='manada.html';
            else if(t.includes('SHOP')||t.includes('TIENDA')) location.href='shop.html';
            else if(t.includes('PERFIL')||t.includes('PROFILE')) location.href='profile.html';
          }});
          </script>"""

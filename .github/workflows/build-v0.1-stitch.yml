            "projection.html":"hypepredict_simulaci_n_3d_projected_finish_saddlecloth_verificado",
            "tale-of-tape.html":"hypepredict_tale_of_the_tape_pro_head_to_head_completo",
            "daily-tapada.html":"sticker_pack_caballos_reacciones_picas",
            "daily-huevazo.html":"sticker_pack_cl_sico_camarero_2026_edici_n_limitada",
            "vulnerable-favorite.html":"pizarra_de_resultados_oficiales_dividendos_camarero_c5",
            "journey-board.html":"hypepredict_an_lisis_biomec_nico_postmortem_camarero_c6_1_400m",
          }
          for out,key in exp6_screens.items():
            matches=[p for p in root6.rglob("code.html") if p.parent.name==key]
            if len(matches)!=1:
              raise SystemExit(f"Expected exactly one Expansion 06 screen for {key}, found {len(matches)}: {matches}; available={[p.parent.name for p in root6.rglob('code.html')]}")
            shutil.copy2(matches[0], EXP/out)
          exp6_routes={
            "splash.html":{"ENTRAR":"../index.html","CONTINUAR":"../index.html"},
            "vip-secret-room.html":{"PERFIL":"vip-profile-active.html","MANADA":"manada.html"},
            "track-standby.html":{"TRACK":"../tracks.html","PISTA":"../tracks.html"},
            "track-geoclima.html":{"TRACK":"../tracks.html","PISTA":"../tracks.html"},
            "race-day-alt.html":{"GATERA":"gate-call.html","GATE":"gate-call.html","LIVE":"race-live.html"},
            "gate-call.html":{"LIVE":"race-live.html","CARRERA":"race-live.html"},
            "horse-hub-alt.html":{"PP":"horse-pps.html","PERFORMANCE":"horse-pps.html"},
            "hype-board.html":{"PACE":"pace-map.html","PROYE":"projection.html","TALE":"tale-of-tape.html"},
            "pace-map.html":{"HYPEBOARD":"hype-board.html","PROYE":"projection.html"},
            "projection.html":{"HYPEBOARD":"hype-board.html","TALE":"tale-of-tape.html"},
            "tale-of-tape.html":{"HYPEBOARD":"hype-board.html","SELECT":"hype-board.html"},
            "daily-tapada.html":{"HYPEBOARD":"hype-board.html"},
            "daily-huevazo.html":{"HYPEBOARD":"hype-board.html"},
            "vulnerable-favorite.html":{"HYPEBOARD":"hype-board.html"},
            "journey-board.html":{"HYPEBOARD":"hype-board.html","TAPADA":"daily-tapada.html","HUEVAZO":"daily-huevazo.html","VULNERABLE":"vulnerable-favorite.html"},
          }
          for name,mapping in exp6_routes.items():
            p=EXP/name; s=p.read_text(encoding="utf-8")
            cases="\n".join([f"if(t.includes({k!r})){{location.href={v!r};return;}}" for k,v in mapping.items()])
            bridge=f"""<script>
          document.addEventListener('click',function(e){{
            const el=e.target.closest('a,button'); if(!el)return;
            const t=(el.innerText||el.textContent||'').trim().toUpperCase();

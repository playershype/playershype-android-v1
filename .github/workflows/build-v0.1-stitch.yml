          window.addEventListener('offline',function(){ location.href='expansion/offline.html'; });
          </script>"""
          s=s.replace("</body>",offline_bridge+"\n</body>") if "</body>" in s else s+offline_bridge
          p.write_text(s,encoding="utf-8")
          # Stitch User Expansion 06 — final unique User flow screens.
          pkg6=Path("PlayersHype-V0.1-STITCH-USER-EXPANSION-06.zip")

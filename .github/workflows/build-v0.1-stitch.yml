      - name: Audit V0.1 User App route coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          root=Path("app/src/main/assets")
          pages=sorted(str(p.relative_to(root)) for p in root.rglob("*.html"))
          required=[
            "index.html","tracks.html","predict.html",
            "expansion/tv-live.html","expansion/tv-multicam.html",
            "expansion/super-hype.html","expansion/tipping.html",
            "expansion/profile.html","expansion/favorites.html",
            "expansion/home-non-race.html","expansion/home-pre-race.html",
            "expansion/home-live.html","expansion/home-post-race.html",
          "expansion/race-day.html","expansion/race-live.html","expansion/race-tracker.html",
          "expansion/results.html","expansion/photo-finish.html","expansion/horse-hub.html","expansion/horse-pps.html",
          "expansion/search.html","expansion/notifications.html","expansion/share.html","expansion/weather-alert.html",
          "expansion/manada.html","expansion/membership.html","expansion/customize.html","expansion/sticker-shop.html",
          "expansion/shop.html","expansion/product.html","expansion/checkout.html","expansion/order-confirmation.html",
          "expansion/orders.html","expansion/receipts.html","expansion/receipt.html",
          "expansion/vip-checkout.html","expansion/vip-ath-confirm.html","expansion/vip-welcome.html",
          "expansion/vip-webhook-success.html","expansion/vip-payment-failed.html","expansion/vip-cancel.html",
          "expansion/vip-cancelled.html","expansion/vip-reactivated.html","expansion/vip-profile-active.html",
          "expansion/vip-profile-ending.html","expansion/offline.html","expansion/search-empty.html",
          "expansion/billing-edit.html","expansion/terms.html","expansion/return.html",
          "expansion/return-label.html","expansion/shipping-confirm.html",
          "expansion/splash.html","expansion/vip-secret-room.html","expansion/track-standby.html",
          "expansion/track-geoclima.html","expansion/race-day-alt.html","expansion/gate-call.html",
          "expansion/horse-hub-alt.html","expansion/hype-board.html","expansion/pace-map.html",
          "expansion/projection.html","expansion/tale-of-tape.html","expansion/daily-tapada.html",
          "expansion/daily-huevazo.html","expansion/vulnerable-favorite.html","expansion/journey-board.html",
          ]
          missing=[p for p in required if p not in pages]
          if missing: raise SystemExit("Missing packaged pages: "+", ".join(missing))
          refs={p:[] for p in pages}
          for p in pages:
            s=(root/p).read_text(encoding="utf-8")
            for q in pages:
              if q==p: continue
              name=Path(q).name
              if name in s: refs[p].append(q)
          inbound={p:[] for p in pages}
          for src,targets in refs.items():
            for dst in targets: inbound[dst].append(src)
          report={"pages":pages,"outbound":refs,"inbound":inbound}
          Path("route-audit.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          print(json.dumps(report,indent=2))
          # Tipping remains packaged for design parity but is not approved as a visible default feature.
          critical=[p for p in required if p not in {"expansion/tipping.html","expansion/super-hype.html"}]
          orphan=[p for p in critical if p!="index.html" and not inbound[p]]
          if orphan:
            raise SystemExit("Critical orphan pages: "+", ".join(orphan))
          PY

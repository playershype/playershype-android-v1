          if root6.exists(): shutil.rmtree(root6)
          root6.mkdir()
          with zipfile.ZipFile(pkg6) as z: z.extractall(root6)
          exp6_screens={
            "splash.html":"splash_screen_oficial_playershype_mobile_app_build_142",
            "vip-secret-room.html":"sala_secreta_vip_discord_la_manada_fundadores",
            "track-standby.html":"track_hub_hip_dromo_fuera_de_temporada_standby",
            "track-geoclima.html":"track_hub_geolocalizaci_n_meteorol_gica_pistas_m_ltiples",
            "race-day-alt.html":"race_day_center_camarero_carrera_7_c7_1_700m_cl_sico",

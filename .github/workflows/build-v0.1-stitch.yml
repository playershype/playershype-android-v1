            s=s.replace("</body>",bridge+"\n</body>") if "</body>" in s else s+bridge
            p.write_text(s,encoding="utf-8")
          # Entry points from existing validated User screens.
          entry6={
            "membership.html":{"SECRET":"vip-secret-room.html"},
            "tracks.html":{"STANDBY":"expansion/track-standby.html","GEOCLIMA":"expansion/track-geoclima.html"},
            "race-day.html":{"GATERA":"gate-call.html","GATE":"gate-call.html"},
            "horse-hub.html":{"ESTAD":"horse-hub-alt.html"},
          }
          for name,mapping in entry6.items():
            p=Path("app/src/main/assets")/name if name=="tracks.html" else EXP/name
            s=p.read_text(encoding="utf-8")
            cases="\n".join([f"if(t.includes({k!r})){{location.href={v!r};return;}}" for k,v in mapping.items()])
            bridge=f"""<script>document.addEventListener('click',function(e){{const el=e.target.closest('a,button');if(!el)return;const t=(el.innerText||el.textContent||'').trim().toUpperCase();{cases}}});</script>"""
            s=s.replace("</body>",bridge+"\n</body>") if "</body>" in s else s+bridge
            p.write_text(s,encoding="utf-8")
          # Expansion 06 structural entry points.
          # Root Home references Splash as the official startup state; MainActivity may promote it to first load later.
          p=Path("app/src/main/assets/index.html"); s=p.read_text(encoding="utf-8")
          splash_ref="""<script>window.PLAYERSHYPE_SPLASH='expansion/splash.html';</script>"""
          s=s.replace("</body>",splash_ref+"\n</body>") if "</body>" in s else s+splash_ref
          p.write_text(s,encoding="utf-8")
          # Primary Race Day links to the additional C7/classic state.
          p=EXP/"race-day.html"; s=p.read_text(encoding="utf-8")
          race_alt="""<script>document.addEventListener('click',function(e){const el=e.target.closest('a,button');if(!el)return;const t=(el.innerText||el.textContent||'').trim().toUpperCase();if(t.includes('C7')||t.includes('CLÁSICO')||t.includes('CLASICO'))location.href='race-day-alt.html';});</script>"""
          s=s.replace("</body>",race_alt+"\n</body>") if "</body>" in s else s+race_alt
          p.write_text(s,encoding="utf-8")
          # HypePredict root is the entry point to the advanced Stitch analysis views.
          p=Path("app/src/main/assets/predict.html"); s=p.read_text(encoding="utf-8")
          bridge="""<script>document.addEventListener('click',function(e){const el=e.target.closest('a,button');if(!el)return;const t=(el.innerText||el.textContent||'').trim().toUpperCase();if(t.includes('HYPEBOARD')||t.includes('RANKING'))location.href='expansion/hype-board.html';else if(t.includes('PACE'))location.href='expansion/pace-map.html';else if(t.includes('PROYE'))location.href='expansion/projection.html';else if(t.includes('TALE'))location.href='expansion/tale-of-tape.html';else if(t.includes('JORNADA')||t.includes('TABLERO'))location.href='expansion/journey-board.html';});</script>"""
          s=s.replace("</body>",bridge+"\n</body>") if "</body>" in s else s+bridge
          p.write_text(s,encoding="utf-8")
          # Home state controller. Default stays on the validated Stitch Home.
          # Admin/config can later set localStorage.playershypeHomeState to:
          # non-race, pre-race, live, post-race.
          p=Path("app/src/main/assets/index.html")
          s=p.read_text(encoding="utf-8")
          bridge="""<script>
          (function(){
            const map={
              'non-race':'expansion/home-non-race.html',
              'pre-race':'expansion/home-pre-race.html',
              'live':'expansion/home-live.html',
              'post-race':'expansion/home-post-race.html'
            };
            const qs=new URLSearchParams(location.search);
            const state=qs.get('state') || localStorage.getItem('playershypeHomeState');
            if(state && map[state]) location.replace(map[state]);
          })();
          </script>"""
          s=s.replace("</body>",bridge+"\n</body>") if "</body>" in s else s+bridge
          p.write_text(s,encoding="utf-8")
          # Ensure every dynamic Home can return to the validated root Home.
          for name in ["home-non-race.html","home-pre-race.html","home-live.html","home-post-race.html"]:
            p=Path("app/src/main/assets/expansion")/name
            s=p.read_text(encoding="utf-8")
            bridge="""<script>
          document.addEventListener('click', function(e) {
            const el=e.target.closest('a,button'); if(!el) return;
            const t=(el.innerText||el.textContent||'').trim().toUpperCase();

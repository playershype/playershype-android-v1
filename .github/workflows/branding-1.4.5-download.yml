name: Publish verified PlayersHype 1.4.5 downloads
on:
  push:
    branches: [delivery/branding-1.4.5-download-ready]
    paths: [.github/workflows/branding-1.4.5-download.yml]
permissions: {}
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: playershype/playershype-android-v1
    steps:
      - name: Require successful tested source build
        shell: bash
        run: |
          gh api repos/$GH_REPO/actions/runs/42128160895 > tested-run.json
          python3 - <<'PY'
          import json
          r=json.load(open('tested-run.json'))
          assert r['head_sha']=='de6098dd75443d4d8452d7741bd379fecc96aaef'
          assert r['conclusion']=='success' and r['status']=='completed'
          PY
      - name: Download the tested APKs
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: playershype/playershype-android-v1
          run-id: 42128160895
          name: PlayersHype-Ecosystem-V1.3.1-RC-Android
          path: verified-build
      - name: Download actual emulator evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: playershype/playershype-android-v1
          run-id: 42128160895
          name: PlayersHype-V1.3.1-RC-emulator-evidence
          path: verified-emulator
      - name: Verify exact APKs and prepare downloads
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          root=Path('verified-build')
          assert (root/'BUILD_COMMIT.txt').read_text().strip()=='de6098dd75443d4d8452d7741bd379fecc96aaef'
          hashes={'App':'df2d948b90d99790eb9f97ec1a2ec45b1e4fe9d3c633d30b35943ed509514e66','Admin':'e9a03ffa5f9b29d42a2224d86aee1b5da9e876849b5e08dafb691c9cc566b64a'}
          for role,expected in hashes.items():
              data=(root/f'PlayersHype-{role}-V1.3.1-RC-PREVIEW.apk').read_bytes()
              assert hashlib.sha256(data).hexdigest()==expected
              meta=(root/f'{role}-metadata.txt').read_text()
              assert "versionCode='13'" in meta and "versionName='1.4.5-preview'" in meta
              assert 'application-debuggable' not in meta
              assert '622da637f469afd52692fb911c8ca5bfa478de52dcabfbd590e0b85aefb48934' in (root/f'{role}-signature.txt').read_text()
              Path(f'PlayersHype-{role}-1.4.5.apk').write_bytes(data)
          assert not json.loads((root/'secrets-apks.json').read_text())['findings']
          assert 'PASS' in Path('verified-emulator/RESULT.txt').read_text()
          assert 'PASS' in Path('verified-emulator/SYNC_RESULT.txt').read_text()
          shutil.copy('verified-emulator/App-predict.png','PlayersHype-1.4.5-Cabecera.png')
          Path('release-notes.md').write_text('Logo original de PlayersHype en Inicio y HypePredict, cabecera compacta con entrada y luz en movimiento, e icono nuevo para la app de usuarios. El icono del Admin se mantiene distinto.\n\nInstala los APK como actualizaciones sobre las versiones con firma permanente. No desinstales esas versiones. El Admin 1.4.5 conserva la nueva cabecera en futuras publicaciones.\n\nVersion 1.4.5-preview / codigo 13. Pruebas Android y emulador completas; descarga online y reinicio sin conexion verificados. Analisis y scores sin cambios.\n\nCompilacion de6098dd75443d4d8452d7741bd379fecc96aaef.\n\n'+''.join(role+' SHA-256: '+sha+'\n' for role,sha in hashes.items()),encoding='utf-8')
          Path('SHA256SUMS.txt').write_text(''.join(sha+'  PlayersHype-'+role+'-1.4.5.apk\n' for role,sha in hashes.items()))
          PY
      - name: Publish verified APKs as prerelease downloads
        shell: bash
        run: |
          set -euo pipefail
          release_tag=branding-v1.4.5-preview
          if ! gh release view "$release_tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$release_tag" --repo "$GH_REPO" \
              --target de6098dd75443d4d8452d7741bd379fecc96aaef \
              --title 'PlayersHype 1.4.5 · Identidad oficial (Preview)' \
              --prerelease --notes-file release-notes.md
          fi
          for file in PlayersHype-App-1.4.5.apk PlayersHype-Admin-1.4.5.apk PlayersHype-1.4.5-Cabecera.png SHA256SUMS.txt; do
            expected_digest="sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"
            existing_digest=$(gh api "repos/$GH_REPO/releases/tags/$release_tag" --jq ".assets[] | select(.name == \"$file\") | .digest")
            if [ -z "$existing_digest" ]; then
              gh release upload "$release_tag" "$file" --repo "$GH_REPO"
            elif [ "$existing_digest" != "$expected_digest" ]; then
              echo 'Existing asset differs; refusing to overwrite it.'
              exit 1
            fi
          done
          gh api "repos/$GH_REPO/releases/tags/$release_tag" --jq '.assets[].browser_download_url' >> "$GITHUB_STEP_SUMMARY"

name: Build PlayersHype Android Ecosystem
on:
  workflow_dispatch:
  push:
    branches: [main, feature/two-app-ecosystem]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Security audit
        run: |
          mkdir -p artifacts
          python3 scripts/security_audit.py | tee artifacts/security-audit.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Original module DOM and configuration tests
        run: |
          pnpm --dir scripts/ui-tests install --frozen-lockfile --ignore-scripts
          node scripts/ui-tests/test.cjs | tee artifacts/ui-tests.txt
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Unit tests
        run: ./gradlew :shared:testDebugUnitTest :app-user:testDebugUnitTest :app-user:testPreviewUnitTest :app-admin:testPreviewUnitTest --no-daemon
      - name: Android lint
        run: ./gradlew :app-user:lintPreview :app-admin:lintPreview --no-daemon
      - name: Prepare QA signing (stable secret or ephemeral fallback)
        env:
          QA_KEYSTORE_BASE64: ${{ secrets.QA_KEYSTORE_BASE64 }}
          QA_STORE_PASSWORD: ${{ secrets.QA_STORE_PASSWORD }}
          QA_KEY_ALIAS: ${{ secrets.QA_KEY_ALIAS }}
          QA_KEY_PASSWORD: ${{ secrets.QA_KEY_PASSWORD }}
        run: python3 scripts/prepare_ci_signing.py
      - name: Build both real Preview APKs
        run: ./gradlew :app-user:assemblePreview :app-admin:assemblePreview --no-daemon
      - name: Verify signatures and metadata
        shell: bash
        run: |
          mkdir -p artifacts
          cp app-user/build/outputs/apk/preview/app-user-preview.apk artifacts/PlayersHype-App-V1-PREVIEW.apk
          cp app-admin/build/outputs/apk/preview/app-admin-preview.apk artifacts/PlayersHype-Admin-V1-PREVIEW.apk
          for role in App Admin; do
            APK="artifacts/PlayersHype-$role-V1-PREVIEW.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > "artifacts/$role-signature.txt"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > "artifacts/$role-metadata.txt"
            if grep -q application-debuggable "artifacts/$role-metadata.txt"; then exit 1; fi
          done
          python3 scripts/package_artifacts.py
      - uses: actions/upload-artifact@v4
        with:
          name: PlayersHype-Ecosystem-V1-Android
          path: artifacts/
          if-no-files-found: error
      - name: Upload tests and lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PlayersHype-verification
          path: |
            app-user/build/reports/tests/
            app-user/build/test-results/
            app-user/build/reports/lint-results-preview.*
            app-admin/build/reports/lint-results-preview.*
            shared/build/test-results/
          if-no-files-found: warn
      - name: Remove runner QA key
        if: always()
        run: rm -f "$RUNNER_TEMP/playershype-qa.jks"

name: Build PlayersHype Android Ecosystem V1.3.1 RC

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v1.3-release-candidate
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: playershype-v1-3-1-rc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SRC_DIR: .v131/PlayersHype-Ecosystem-V1.3.1-RC
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Expand PlayersHype V1.3.1 RC source package
        shell: bash
        run: |
          rm -rf .v131
          mkdir -p .v131
          unzip -q PlayersHype-Ecosystem-V1.3.1-RC-SOURCE.zip -d .v131
          test -f "$SRC_DIR/settings.gradle"
          test -f "$SRC_DIR/app-user/build.gradle"
          test -f "$SRC_DIR/app-admin/build.gradle"
          test -f "$SRC_DIR/shared/src/main/java/com/playershype/shared/PublishController.java"
          chmod +x "$SRC_DIR/gradlew"

      - name: Security and V1.3.1 audits
        shell: bash
        run: |
          cd "$SRC_DIR"
          mkdir -p artifacts
          python3 scripts/security_audit.py | tee artifacts/security-audit.txt
          python3 scripts/v131_static_audit.py | tee artifacts/v131-static-audit.txt

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'

      - name: DOM and configuration tests
        shell: bash
        run: |
          cd "$SRC_DIR"
          pnpm --dir scripts/ui-tests install --frozen-lockfile --ignore-scripts
          node scripts/ui-tests/test.cjs | tee artifacts/ui-tests.txt

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android API 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests
        shell: bash
        run: |
          cd "$SRC_DIR"
          ./gradlew :shared:testDebugUnitTest :app-user:testDebugUnitTest :app-user:testPreviewUnitTest :app-admin:testPreviewUnitTest --no-daemon

      - name: Android lint
        shell: bash
        run: |
          cd "$SRC_DIR"
          ./gradlew :app-user:lintPreview :app-admin:lintPreview --no-daemon

      - name: Prepare QA signing
        shell: bash

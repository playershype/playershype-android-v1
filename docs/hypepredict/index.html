<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07182b">
<title>HypePredict — PlayersHype</title>
<style>
:root{--navy:#07182b;--navy2:#102c44;--lime:#caff00;--cyan:#25c5df;--bg:#eef3f6;--card:#fff;--text:#132d46;--muted:#6d8194;--line:#d9e4ec}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.top{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-bottom:4px solid var(--lime);padding:18px 18px 16px}
.wrap{max-width:1180px;margin:auto}.brand{font-size:12px;font-weight:900;letter-spacing:.16em;color:var(--lime);text-transform:uppercase}.title{font-size:clamp(27px,5vw,46px);font-weight:1000;letter-spacing:-.04em;margin:5px 0 2px}.sub{color:#bdd0df;font-size:13px;font-weight:700}
.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin:18px auto 12px;padding:0 16px;max-width:1180px}
select,button{min-height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);font:inherit;font-weight:850;padding:0 12px}button{cursor:pointer;background:var(--navy);color:#fff;border-color:var(--navy)}
.status{max-width:1180px;margin:0 auto;padding:0 16px 12px;font-size:12px;color:var(--muted);font-weight:750}
.grid{max-width:1180px;margin:auto;padding:0 16px 34px;display:grid;gap:12px}.hero,.race,.empty{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 22px rgba(8,24,43,.06)}
.hero{padding:18px}.kicker{font-size:10px;font-weight:1000;letter-spacing:.14em;text-transform:uppercase;color:#668095}.hero h2{margin:5px 0 3px;font-size:25px}.meta{color:var(--muted);font-size:13px;font-weight:750}
.races{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.race{padding:15px;overflow:hidden}.racehead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.rnum{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--navy);color:var(--lime);font-weight:1000}.rtitle{flex:1}.rtitle b{display:block;font-size:16px}.rtitle span{font-size:11px;color:var(--muted);font-weight:800}.picks{margin-top:12px;display:grid;gap:7px}.pick{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #edf1f4;padding-top:7px;font-size:12px}.pick strong{font-weight:950}.tag{font-size:9px;font-weight:1000;letter-spacing:.08em;text-transform:uppercase;color:#60758a}.empty{padding:28px;text-align:center}.empty b{display:block;font-size:18px}.empty span{display:block;margin-top:5px;color:var(--muted);font-size:13px;line-height:1.45}
.raw{white-space:pre-wrap;word-break:break-word;font-size:11px;line-height:1.45;color:#40566a;max-height:380px;overflow:auto;background:#f7fafc;border-radius:10px;padding:10px;margin-top:10px}
footer{text-align:center;color:#8091a2;font-size:11px;font-weight:800;padding:18px}
@media(max-width:650px){.controls{grid-template-columns:1fr 1fr}.controls button{grid-column:1/-1}.races{grid-template-columns:1fr}.top{padding-top:calc(18px + env(safe-area-inset-top))}}

/* HypePredict: authentic uniform colors, separate from saddlecloth */
.ph-silk{width:60px;height:60px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;flex:none}.ph-silk svg{width:100%;height:100%;overflow:visible}.ph-silk-unknown{color:#64748b;font-size:11px;font-weight:800}
.ph-horse{display:flex;align-items:center;gap:10px;margin-top:8px}.ph-horse-name{font-size:13px;font-weight:850}.ph-uniform-description{display:block;font-size:10px;color:#60758a;font-weight:650;margin-top:2px}

/* HypePredict — lectura editorial completa, responsive y sin datos inventados */
html{scroll-behavior:smooth}
body{background:#eaf0f5}
.grid{gap:16px}
.hero{border-radius:20px;background:#081626;color:#f4f7fc;border-color:#263c52;box-shadow:0 12px 30px rgba(8,24,43,.12)}
.hero .kicker{color:#caff00}.hero .meta{color:#bccbdd;line-height:1.6}
.hero h2{font-size:clamp(26px,5vw,38px)}
.daynotice{font-size:12px;color:#9fb6ca;margin-top:9px}
.race-index{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0 2px}
.race-index a{display:grid;place-items:center;min-width:40px;min-height:40px;border:1px solid #aac3d5;border-radius:12px;background:white;color:#102c44;font-weight:900;text-decoration:none}
.race-index a:hover,.race-index a:focus{background:#102c44;color:#caff00}
.race-index b{font-size:12px;color:#47627a;margin-right:6px}
.races{grid-template-columns:1fr;gap:18px}
.race{padding:0;border-radius:20px;box-shadow:0 8px 26px rgba(8,24,43,.08);scroll-margin-top:15px}
.race-banner{background:linear-gradient(115deg,#07182b,#143750);padding:18px 20px;color:#fff}
.race-head{display:flex;align-items:center;gap:12px}
.race-no{width:54px;height:54px;flex:none;display:grid;place-items:center;background:#caff00;color:#07182b;border-radius:14px;font-size:24px;font-weight:1000}
.race-title{min-width:0}.race-title h3{margin:0;font-size:clamp(18px,3.6vw,23px);line-height:1.25}.race-title small{display:block;color:#bad1e1;font-size:12px;font-weight:800;margin-bottom:4px}
.race-subtitle{color:#d1e2ec;font-size:13px;line-height:1.6;margin:12px 0 0}
.race-core{padding:18px 20px;display:grid;gap:18px}
.section-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:950;color:#506c82;margin:0 0 10px}
.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.quick-cell{background:#f0f5f8;border:1px solid #d6e2eb;border-radius:14px;padding:12px;min-width:0}
.quick-cell.select{background:#e9f4cb;border-color:#bad579}
.quick-cell .slot{font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:900;color:#47627a}
.quick-cell .horse{font-size:14px;line-height:1.3;font-weight:1000;overflow-wrap:anywhere;margin-top:6px}
.quick-cell .score{font-size:22px;font-weight:950;margin-top:5px;letter-spacing:-.02em}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stat{display:inline-flex;align-items:center;gap:5px;background:#eef3f7;color:#233f54;padding:8px 10px;border-radius:100px;font-size:11px;font-weight:850;line-height:1.3}
.stat.warn{background:#fff1d7;color:#7d4b06}.stat.good{background:#e5f8ee;color:#12633a}
.decision{border-left:4px solid #b7e600;background:#f6f9ee;padding:13px 15px;color:#223a49;border-radius:0 12px 12px 0;font-size:13px;line-height:1.65}
.decision b{font-size:15px}
.read{background:#f0f6fa;border:1px solid #d9e7ee;border-radius:16px;padding:15px 17px}
.read p,.pace-scenario,.risk-text,.strategy{margin:0;font-size:14px;line-height:1.75;color:#223e54}
.block-title{margin:0 0 10px;color:#0b2940;font-size:17px;letter-spacing:-.02em}
.pace-lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:11px}
.pace-lane{border:1px solid #dce7ee;border-radius:12px;background:#f6f9fb;padding:10px;font-size:12px;line-height:1.6}
.pace-lane b{display:block;color:#506b80;font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.board-wrap{overflow-x:auto;border-radius:13px;border:1px solid #d9e4ed}
.board-table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}
.board-table th{background:#102c44;color:#f4f7fc;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:11px}
.board-table td{border-bottom:1px solid #e4ebef;padding:11px;vertical-align:top}
.board-table tr:last-child td{border-bottom:0}
.board-table tbody tr:first-child{background:#f1f8e5}
.board-table .name{font-weight:900;color:#0d2d44}
.board-table .role{display:block;font-size:10px;color:#667e90;margin-top:4px}
.score-num{font-weight:1000;font-size:17px;color:#122f45}
.pool-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pool-item{background:#f4f7fa;border:1px solid #dce6ed;border-radius:10px;padding:11px}
.pool-item small{display:block;text-transform:uppercase;font-size:10px;letter-spacing:.06em;color:#657e91;font-weight:900;margin-bottom:5px}
.pool-item strong{font-size:14px;color:#173a51;overflow-wrap:anywhere}
.risk{border:1px solid #eadab6;background:#fff9ed;border-radius:14px;padding:14px}
.risk .block-title{color:#7a510d}.risk .risk-text{color:#6a4b1b}
.wager{border:1px solid #c4e5ea;background:#eefbfe;border-radius:14px;padding:14px}
.wager pre{color:#193c4c;font-family:inherit;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;line-height:1.7}
.more{border-top:1px solid #dce6ee;padding:0 20px}
.more summary{cursor:pointer;list-style:none;padding:17px 0;font-weight:950;color:#112f48;font-size:14px}
.more summary::-webkit-details-marker{display:none}
.more summary:before{content:'+';display:inline-grid;place-items:center;margin-right:10px;width:24px;height:24px;color:#102c44;background:#caff00;border-radius:7px}
.more[open] summary:before{content:'−'}
.more .inside{padding:0 0 18px}
.horse-detail{border:1px solid #dce6ed;background:#f8fbfd;border-radius:12px;margin:10px 0;padding:14px}
.horse-detail h5{margin:0 0 10px;font-size:15px;color:#0c2e48}
.source{font-family:inherit;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;font-size:13px;line-height:1.75;color:#2b485e;margin:0}
.empty-race{padding:22px;color:#7d3e11;background:#fff5e9;border:1px solid #edd5b7;border-radius:12px}
.missing-field{font-size:12px;color:#637f91}
.footer-action{padding:0 20px 16px;font-size:11px;color:#698095}
@media(max-width:760px){.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pace-lanes{grid-template-columns:repeat(2,minmax(0,1fr))}.pool-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.race-core{padding:15px;gap:16px}.race-banner{padding:15px}.race-no{width:45px;height:45px;font-size:20px}.race-title h3{font-size:18px}.quick-cell{padding:10px}.quick-cell .horse{font-size:13px}.quick-cell .score{font-size:20px}.read p,.pace-scenario,.risk-text,.strategy{font-size:13px}.board-table td,.board-table th{padding:9px 7px}.more{padding:0 15px}.race-index a{min-width:37px;min-height:37px}}


/* Public Dashboard: recupera la arquitectura visual de HUB.html (solo lectura) */
:root{--navy:#08182b;--navy2:#102946;--lime:#caff00;--cyan:#25c5df;--line:#dce3ea;--muted:#627084;--bg:#eef2f6}
html,body{background:#eef2f6;color:#111827;scroll-behavior:auto}
.top{padding:0;background:linear-gradient(135deg,#08182b,#0d2540);border-bottom:0;box-shadow:0 8px 24px rgba(8,24,43,.16)}
.top .wrap{max-width:1600px;display:flex;align-items:center;gap:12px;padding:13px 20px}
.brand-mark{width:42px;height:42px;border-radius:10px;flex:none;background:#202833;display:grid;place-items:center;color:#caff00;font-size:20px;font-weight:1000;letter-spacing:-.05em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.brand-copy{min-width:0}.top .brand{font-size:11px;color:#caff00;letter-spacing:.15em}.top .title{margin:3px 0 0;font-size:21px;letter-spacing:-.03em;line-height:1.1}.top .sub{font-size:11px;margin-top:3px;color:#c7d6e7}
.public-chip{margin-left:auto;border:1px solid rgba(202,255,0,.44);background:rgba(202,255,0,.11);border-radius:30px;padding:7px 9px;color:#e8ff99;font-weight:900;font-size:10px;white-space:nowrap}
.controls{margin:0 auto;padding:13px 18px;max-width:1600px;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:9px}
.controls select{color:#102946;border:1px solid #d8e0e8;border-radius:10px;font-size:14px;min-height:46px;background:#fff}
.controls button{border-radius:10px;min-height:46px;font-size:13px}
#status{max-width:1600px;margin:0 auto;padding:0 18px 10px;color:#758399;font-weight:800;font-size:11px}
.grid{max-width:1600px;padding:0 18px 32px;gap:13px}
.screen-nav{display:flex;gap:7px;overflow-x:auto;background:#fff;border-bottom:1px solid #dce3ea;padding:9px max(18px,calc((100vw - 1560px)/2));scrollbar-width:none}
.screen-nav::-webkit-scrollbar{display:none}
.screen-nav a{display:flex;align-items:center;justify-content:center;flex:none;min-width:42px;min-height:42px;padding:9px 12px;border:1px solid #dce3ea;border-radius:10px;background:white;color:#344054;font-weight:1000;font-size:13px;text-decoration:none}
.screen-nav a.active{background:#08182b;color:#fff;border-color:#08182b;box-shadow:inset 0 -3px 0 #caff00}
.screen-nav .nav-home{min-width:104px}
.dashboard-shell{display:grid;gap:13px}
.page-header{display:flex;gap:12px;justify-content:space-between;align-items:flex-end;padding:9px 1px 4px}
.page-kicker{font-size:11px;font-weight:1000;color:#597085;text-transform:uppercase;letter-spacing:.17em}
.page-heading{font-size:clamp(24px,4vw,34px);font-weight:1000;color:#0d2034;letter-spacing:-.04em;line-height:1.05;margin:4px 0}
.page-desc{font-size:13px;color:#627084;line-height:1.5}
.section-card{background:#fff;border:1px solid #dce3ea;border-radius:16px;box-shadow:0 8px 24px rgba(8,24,43,.05);padding:15px}
.section-heading{font-size:13px;font-weight:1000;letter-spacing:.11em;text-transform:uppercase;color:#32465a;margin:0 0 12px}
.jornada-command{display:flex;align-items:center;gap:12px;justify-content:space-between;background:#08182b;color:#fff;padding:16px 19px;border-radius:17px;border:1px solid #173951}
.jornada-command-mark{display:grid;place-items:center;border-radius:12px;background:#caff00;color:#08182b;width:48px;height:48px;font-size:19px;font-weight:1000}
.jornada-brand{display:flex;align-items:center;gap:12px;min-width:0}
.jornada-command-kicker{font-size:10px;font-weight:950;color:#caff00;letter-spacing:.15em}
.jornada-command-title{font-size:21px;font-weight:1000;letter-spacing:-.03em}
.jornada-command-sub{color:#bdd0df;font-size:12px;margin-top:3px}
.jornada-count{border:1px solid rgba(202,255,0,.35);background:rgba(202,255,0,.09);color:#e8ff99;border-radius:50px;padding:8px 10px;font-size:11px;font-weight:950;white-space:nowrap}
.radiography{background:linear-gradient(135deg,#071827 0%,#0b2942 55%,#0a1d30 100%);border:1px solid #183b55;color:#fff;padding:18px;border-radius:20px;box-shadow:0 18px 40px rgba(8,24,43,.12)}
.radiography h2{font-size:25px;font-weight:1000;margin:4px 0 4px;line-height:1.1;letter-spacing:-.04em}
.radiography-kicker{font-weight:1000;letter-spacing:.17em;color:#caff00;font-size:11px}
.radiography-sub{color:#a9bfd0;font-size:12px;line-height:1.6;margin-bottom:15px}
.xray-grid{display:grid;grid-template-columns:minmax(220px,.85fr) minmax(0,1.65fr);gap:12px}
.xray-core{border:1px solid rgba(255,255,255,.12);border-radius:17px;background:rgba(255,255,255,.055);padding:23px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:230px}
.xray-core .cap{font-size:11px;color:#a9bfd0;letter-spacing:.11em;font-weight:1000}
.xray-core .mark{width:49px;height:49px;margin:12px auto;background:#caff00;color:#08182b;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:1000}
.xray-core .val{font-size:25px;color:white;font-weight:1000;line-height:1.1}
.xray-core .note{font-size:11px;line-height:1.5;color:#a4b8c8;margin-top:10px}
.xray-signals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xray-signal{position:relative;display:block;text-decoration:none;color:#fff;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);border-radius:15px;padding:14px;min-height:108px}
.xray-signal:after{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;background:#25c5df}
.xray-signal.base:after{background:#caff00}.xray-signal.risk:after{background:#ff8a34}.xray-signal.tight:after{background:#8b5cf6}
.xray-signal .cap{font-size:10px;letter-spacing:.1em;font-weight:950;color:#a3bacb}
.xray-signal .main{font-size:18px;font-weight:1000;margin-top:8px}
.xray-signal .sub{font-size:11px;line-height:1.5;color:#a8bccb;margin-top:5px}
.day-pulse{background:#08182b;border-radius:17px;padding:16px;color:#fff;border:1px solid #163951}
.day-pulse-title{color:#caff00;font-size:12px;font-weight:1000;letter-spacing:.1em}
.pulse-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:9px;margin-top:13px}
.pulse-tile{background:#102b41;color:#fff;border:1px solid #33536a;border-radius:11px;padding:13px 10px;text-decoration:none}
.pulse-tile .pulse-id{font-size:18px;font-weight:1000}
.pulse-tile .pulse-risk{font-size:10px;color:#c9d9e4;line-height:1.5;margin-top:5px}
.pulse-meter{height:52px;border-bottom:1px solid #3d5b72;display:flex;align-items:flex-end;margin:9px 0}
.pulse-meter i{display:block;width:23px;height:var(--meter);max-height:100%;background:linear-gradient(0deg,#25c5df,#caff00);border-radius:5px 5px 0 0}
.pulse-pick{font-size:11px;color:#e8f2f8;font-weight:900;line-height:1.3}
.match-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.match-card{display:block;text-decoration:none;color:#11283f;background:#fff;border:1px solid #dce5ec;border-radius:14px;overflow:hidden}
.match-head{background:#f6f9fb;border-bottom:1px solid #e5ecf1;padding:11px;display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:12px;font-weight:950}
.match-head span{color:#a15b17}
.match-body{display:grid;grid-template-columns:minmax(0,1fr) 55px minmax(0,1fr);gap:4px;align-items:center;padding:17px 11px}
.match-fighter{min-width:0}.match-fighter.right{text-align:right}
.match-tag{font-size:10px;color:#768698;font-weight:1000;letter-spacing:.08em}
.match-name{font-size:13px;font-weight:1000;color:#173049;overflow-wrap:anywhere;margin-top:5px}
.match-score{font-size:26px;font-weight:1000;line-height:1;margin-top:7px}
.match-vs{text-align:center;font-size:12px;background:#102d46;color:#caff00;border-radius:50%;width:43px;height:43px;display:grid;place-items:center;font-weight:1000;margin:auto}
.match-footer{padding:9px 11px;border-top:1px solid #eef2f4;color:#64788a;font-size:11px;font-weight:850;display:flex;justify-content:space-between;gap:7px}
.match-footer strong{color:#1d7f95}
.race-screen{display:grid;gap:12px}
.race-controls{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.race-controls a{border:1px solid #d2dde5;padding:10px 13px;border-radius:10px;text-decoration:none;color:#173049;background:#fff;font-size:12px;font-weight:1000}
.race-controls a.primary{background:#08182b;color:#caff00;border-color:#08182b}
.race-page .race{box-shadow:none;border:none;border-radius:0;padding:0;background:transparent}
.race-page .race-banner{border-radius:15px;background:linear-gradient(125deg,#08182b,#102946)}
.race-page .race-core{padding:15px 0;gap:12px}
.race-page .race-core>section{background:#fff;border:1px solid #dce3ea;border-radius:15px;padding:15px;box-shadow:0 5px 18px rgba(8,24,43,.045)}
.race-page .race-core>section.decision{border-left:4px solid #caff00;background:#f6ffeb}
.race-page .race-core>section.read{background:#fff}
.race-page .race-core>section.risk{background:#fff9ed;border:1px solid #eadab6}
.race-page .race-core>section.wager{background:#effbfe;border-color:#c4e5ea}
.race-page .quick-cell{min-height:96px;background:#fff;border:1px solid #dce3ea}
.race-page .quick-cell.select{background:#efffbe;border-color:#c9ef4b}
.race-page .quick-cell .horse{font-size:14px}
.race-page .section-label{color:#32465a;font-size:13px}
.race-page .block-title{font-size:14px;text-transform:uppercase;letter-spacing:.08em}
.race-page .board-table th{background:#f7f9fb;color:#546579;border-bottom:1px solid #dce3ea}
.race-page .board-table tbody tr:first-child{background:#f5ffe8}
.race-page .pace-lane{background:#f8fafc;border-radius:9px;border-top:3px solid #25c5df}
.race-page .pace-lane:nth-child(1){border-top-color:#ff8a34}
.race-page .pace-lane:nth-child(2){border-top-color:#ffd44d}
.race-page .pace-lane:nth-child(4){border-top-color:#8b5cf6}

function tracks(){
 const declared=(DATA?.tracks||[]).filter(t=>t&&t.enabled!==false);

 return `<div class="board-wrap"><table class="board-table"><thead><tr><th>Pos.</th><th>Ejemplar</th><th>HypeScore</th><th>Confiabilidad</th></tr></thead><tbody>${rows}</tbody></table></div>`;

 '<div class="xray-signals">'+
 signal("MAYOR HYPESCORE",best?'R'+best.race.number+' · #'+hpQ(best.analysis).select.programNumber:'—',best?hpQ(best.analysis).select.name+' · HS '+hpScore(hpQ(best.analysis).select):'No disponible',"base",best&&best.race.number)+
 signal("CARRERAS CON RIESGO ALTO",String(risks.length),risks.length?risks.map(function(x){return 'R'+x.race.number}).join(" · "):"Ninguna identificada en los reportes","risk",risks[0]&&risks[0].race.number)+
 signal("MAYOR COMPRESIÓN",tight?'R'+tight.race.number+' · '+hpQ(tight.analysis).gap:'—',tight?'Select vs Rival · '+hpEsc(hpQ(tight.analysis).decision||""):'Sin gap registrado',"tight",tight&&tight.race.number)+
 signal("ANÁLISIS DE LA JORNADA",list.length+' / '+races.length,"Cada carrera conserva su propia lectura, HypeBoard y checklist","",null)+
 '</div></div></section>'+
 '<section class="day-pulse"><div class="day-pulse-title">PULSO DE LA JORNADA · RACE DAY PULSE</div><p class="radiography-sub" style="margin:5px 0 0">HypeScore del Select publicado por carrera. La escala no representa probabilidad de victoria.</p><div class="pulse-row">'+pulse+'</div></section>'+
 '<section class="section-card"><h3 class="section-heading">HYPEMATCH · SELECT VS RIVAL</h3><div class="match-grid">'+list.map(function(x){return hpMatchCard(x.race,x.analysis)}).join("")+'</div></section>'+
 '<p class="mobile-race-tip">Selecciona cualquier carrera para abrir exclusivamente su análisis.</p></div>';
}
function hpHorseReading(h){
 var txt=String(h.sourceText||"");
 var m=txt.match(/LECTURA:\s*([\s\S]*?)(?=\nUSO:|$)/i);
 return m?m[1].trim():"Lectura individual no disponible.";
}
function hpHorseProfileCards(a){
 return '<section class="section-card"><h3 class="section-heading">FULL FIELD · TODO EL CAMPO</h3><div class="original-field">'+(a.horses||[]).map(function(h,i){
  return '<button type="button" class="original-horse" data-horse-index="'+i+'"><div class="original-horse-head"><span>'+hpSaddle(h.programNumber)+'</span><span class="original-horse-score">'+hpScore(h)+'</span></div><div class="original-horse-name" style="margin-top:8px">#'+hpEsc(h.programNumber)+' '+hpEsc(h.name)+'</div><div class="original-horse-role">'+hpEsc(h.role||"")+" · "+hpEsc(h.reliability||"")+'</div><div class="original-horse-read">'+hpEsc(hpHorseReading(h))+'</div><div class="original-horse-cta">ABRIR PERFIL COMPLETO ›</div></button>';
 }).join("")+'</div></section>';
}
function hpOpenHorse(i){
 var n=hpScreen(),id=document.querySelector("#track").value,d=day(id,document.querySelector("#date").value),r=(d&&d.races||[]).find(function(x){return Number(x.number)===n}),a=r&&analysisFor(r),h=a&&a.horses&&a.horses[i];
 if(!h)return;
 var modal=document.getElementById("horseModal");if(!modal)return;
 modal.innerHTML='<div class="horse-panel" role="dialog" aria-modal="true" aria-label="Perfil completo del ejemplar"><div class="horse-panel-header"><b>PERFIL COMPLETO DEL EJEMPLAR</b><button id="closeHorse" aria-label="Cerrar">×</button></div><div class="horse-title" style="margin-top:16px">'+hpSaddle(h.programNumber)+'<span>'+hpEsc(h.name)+'</span></div><div class="horse-note">R'+n+' · '+hpEsc(h.role||"")+" · HypeScore "+hpScore(h)+" · "+hpEsc(h.reliability||"")+'</div><pre class="source">'+hpEsc(h.sourceText||"Perfil detallado no publicado.")+'</pre></div>';
 modal.classList.add("open");document.body.style.overflow="hidden";
 var closer=document.getElementById("closeHorse");if(closer)closer.onclick=hpCloseHorse;
}
function hpCloseHorse(){var el=document.getElementById("horseModal");if(el)el.classList.remove("open");document.body.style.overflow=""}
function hpRaceView(track,dayData,race){
 var a=analysisFor(race),races=dayData.races||[],idx=races.findIndex(function(x){return x.id===race.id}),prev=races[idx-1],next=races[idx+1];
 var buttons='<a class="primary" href="#jornada">← VOLVER A JORNADA</a>'+(prev?'<a href="#race-'+hpEsc(prev.number)+'">← R'+hpEsc(prev.number)+'</a>':'')+(next?'<a href="#race-'+hpEsc(next.number)+'">R'+hpEsc(next.number)+' →</a>':'');
 return '<div class="race-screen"><div class="race-controls">'+buttons+'</div>'+
 '<div class="page-header"><div><div class="page-kicker">PLAYERSHYPE · HYPEPREDICT V1</div><h2 class="page-heading">Carrera '+hpEsc(race.number)+' · Análisis completo</h2><div class="page-desc">'+hpEsc(track.name)+' · '+hpEsc(dayData.date)+' · pantalla individual</div></div></div>'+
 '<div class="race-page">'+raceCard(race,track.id,dayData.date)+'</div>'+
 (a&&a.status==="published"?hpHorseProfileCards(a):"")+
 '<div class="race-controls">'+buttons+'</div></div>';
}
function render(){
 var id=document.querySelector("#track").value;
 var track=tracks().find(function(x){return x.id===id});
 var selected=document.querySelector("#date").value||SELECTED_DATE;
 var d=day(id,selected),n=hpScreen();
 if(!track||!d||!d.date){
  document.querySelector("#app").innerHTML='<div class="empty"><b>No hay jornada publicada</b><span>No existen datos para el hipódromo y la fecha seleccionados.</span></div>';
  document.querySelector("#status").textContent="Sin jornada publicada";
  var nav=document.getElementById("raceNav");if(nav)nav.innerHTML="";
  return;
 }
 var races=Array.isArray(d.races)?d.races:[],r=races.find(function(x){return Number(x.number)===n});
 var nav=document.getElementById("raceNav");if(nav)nav.innerHTML=hpRaceNav(races,r?n:0);
 document.querySelector("#app").innerHTML=r?hpRaceView(track,d,r):hpDayView(track,d);
 var published=races.filter(function(x){var a=analysisFor(x);return a&&a.status==="published"&&a.trackId===id&&a.raceId===x.id}).length;
 document.querySelector("#status").textContent="Config "+(DATA.revision||"")+" · "+track.name+" · "+published+"/"+races.length+" análisis · "+(r?"R"+r.number:"Jornada");
 document.querySelectorAll("[data-horse-index]").forEach(function(el){el.addEventListener("click",function(){hpOpenHorse(Number(el.dataset.horseIndex))})});
}
function hpNavigate(){
 hpCloseHorse();
 if(document.querySelector("#app"))render();
 window.scrollTo(0,0);
}


async function load(){
 const oldTrack=$("#track").value, oldDate=$("#date").value||SELECTED_DATE;
 try{
  $("#status").textContent="Actualizando información pública…";
  const url=new URL(CONFIG_URL,location.href);url.searchParams.set("v",Date.now());
  const res=await fetch(url.href,{cache:"no-store",headers:{"Cache-Control":"no-cache","Pragma":"no-cache"}});
  if(!res.ok)throw new Error("HTTP "+res.status);
  const next=await res.json();
  if(!next||!next.raceDays||!next.hypepredict)throw new Error("Configuración incompleta");
  DATA=next;
  const ts=tracks();
  $("#track").innerHTML=ts.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("");
  const keep=ts.find(t=>t.id===oldTrack);const requested=ts.find(t=>t.id===REQUESTED_TRACK);
  $("#track").value=keep?.id||requested?.id||latestPublishedTrack(ts);
  syncDates(keep?.id?oldDate:(requested?.id?REQUESTED_DATE:""));
 }catch(e){
  $("#status").textContent="No se pudo cargar la información pública";
  $("#app").innerHTML=`<div class="empty"><b>No se pudo conectar con HypePredict</b><span>${esc(e.message)}</span></div>`;
 }
}
$('#track').addEventListener('change',()=>{if(location.hash!=='#jornada')location.hash='jornada';syncDates()});$('#date').addEventListener('change',()=>{SELECTED_DATE=$('#date').value;if(location.hash!=='#jornada')location.hash='jornada';render()});$('#refresh').addEventListener('click',load);window.addEventListener('hashchange',hpNavigate);document.addEventListener('keydown',e=>{if(e.key==='Escape')hpCloseHorse()});document.getElementById('horseModal').addEventListener('click',e=>{if(e.target.id==='horseModal')hpCloseHorse()});load();
</script>
</body></html>

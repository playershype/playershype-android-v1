<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07182b">
<title>HypePredict — PlayersHype</title>
<style>
:root{--navy:#07182b;--navy2:#102c44;--lime:#caff00;--cyan:#25c5df;--bg:#eef3f6;--card:#fff;--text:#132d46;--muted:#6d8194;--line:#d9e4ec}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.top{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-bottom:4px solid var(--lime);padding:18px 18px 16px}
.wrap{max-width:1180px;margin:auto}.brand{font-size:12px;font-weight:900;letter-spacing:.16em;color:var(--lime);text-transform:uppercase}.title{font-size:clamp(27px,5vw,46px);font-weight:1000;letter-spacing:-.04em;margin:5px 0 2px}.sub{color:#bdd0df;font-size:13px;font-weight:700}
.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin:18px auto 12px;padding:0 16px;max-width:1180px}
select,button{min-height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);font:inherit;font-weight:850;padding:0 12px}button{cursor:pointer;background:var(--navy);color:#fff;border-color:var(--navy)}
.status{max-width:1180px;margin:0 auto;padding:0 16px 12px;font-size:12px;color:var(--muted);font-weight:750}
.grid{max-width:1180px;margin:auto;padding:0 16px 34px;display:grid;gap:12px}.hero,.race,.empty{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 22px rgba(8,24,43,.06)}
.hero{padding:18px}.kicker{font-size:10px;font-weight:1000;letter-spacing:.14em;text-transform:uppercase;color:#668095}.hero h2{margin:5px 0 3px;font-size:25px}.meta{color:var(--muted);font-size:13px;font-weight:750}
.races{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.race{padding:15px;overflow:hidden}.racehead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.rnum{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--navy);color:var(--lime);font-weight:1000}.rtitle{flex:1}.rtitle b{display:block;font-size:16px}.rtitle span{font-size:11px;color:var(--muted);font-weight:800}.picks{margin-top:12px;display:grid;gap:7px}.pick{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #edf1f4;padding-top:7px;font-size:12px}.pick strong{font-weight:950}.tag{font-size:9px;font-weight:1000;letter-spacing:.08em;text-transform:uppercase;color:#60758a}.empty{padding:28px;text-align:center}.empty b{display:block;font-size:18px}.empty span{display:block;margin-top:5px;color:var(--muted);font-size:13px;line-height:1.45}
.raw{white-space:pre-wrap;word-break:break-word;font-size:11px;line-height:1.45;color:#40566a;max-height:380px;overflow:auto;background:#f7fafc;border-radius:10px;padding:10px;margin-top:10px}
footer{text-align:center;color:#8091a2;font-size:11px;font-weight:800;padding:18px}
@media(max-width:650px){.controls{grid-template-columns:1fr 1fr}.controls button{grid-column:1/-1}.races{grid-template-columns:1fr}.top{padding-top:calc(18px + env(safe-area-inset-top))}}

.detail-grid{display:grid;gap:12px}.horse-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 8px 22px rgba(8,24,43,.06)}
.horse-top{display:grid;grid-template-columns:54px 72px 1fr;gap:12px;align-items:center}.cloth{width:54px;height:54px;border-radius:14px;background:var(--navy);color:var(--lime);display:grid;place-items:center;font-size:22px;font-weight:1000}
.silks{width:70px;height:62px;position:relative;display:grid;place-items:center}.silks-body{width:46px;height:46px;border-radius:14px 14px 9px 9px;border:2px solid #17324a;background:linear-gradient(90deg,#fff 0 33%,#2f80ed 33% 66%,#fff 66%);position:relative}.silks-body:before,.silks-body:after{content:"";position:absolute;top:6px;width:19px;height:17px;border:2px solid #17324a;background:inherit}.silks-body:before{left:-17px;transform:rotate(25deg);border-radius:8px 2px}.silks-body:after{right:-17px;transform:rotate(-25deg);border-radius:2px 8px}.silks-label{position:absolute;bottom:-2px;font-size:7px;font-weight:1000;text-transform:uppercase;color:#667d91}
.horse-name{font-size:18px;font-weight:1000}.role{font-size:10px;font-weight:1000;letter-spacing:.12em;color:#647b90}.score{font-size:20px;font-weight:1000;color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}.stat{background:#f5f8fa;border-radius:11px;padding:9px}.stat small{display:block;font-size:8px;font-weight:1000;letter-spacing:.09em;color:#6b8093;text-transform:uppercase}.stat b{display:block;margin-top:2px;font-size:12px}
.read{margin-top:12px;padding:12px;border-left:4px solid var(--lime);background:#f8fafb;border-radius:8px;font-size:12px;line-height:1.55}.workouts{font-size:11px;line-height:1.55;margin-top:10px}
.pace-map{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.pace-lane{background:#f5f8fa;border-radius:12px;padding:10px;text-align:center}.pace-lane b{display:block;font-size:9px;letter-spacing:.08em}.pace-lane span{display:block;font-size:10px;margin-top:6px;font-weight:850}
@media(max-width:650px){.horse-top{grid-template-columns:48px 64px 1fr}.cloth{width:48px;height:48px}.silks{width:62px}.stats{grid-template-columns:1fr 1fr}.pace-map{grid-template-columns:1fr 1fr}}

.saddle{display:inline-grid;place-items:center;min-width:34px;height:30px;border-radius:7px;border:1px solid rgba(0,0,0,.25);font-weight:1000;font-size:15px}
.trackviz,.finishviz{background:#0c503c;border:10px solid #d8b47a;border-radius:999px;padding:18px;position:relative;margin-top:12px;min-height:190px;overflow:hidden}
.trackviz:after{content:"";position:absolute;inset:38px;background:#eef3f6;border-radius:999px}
.lane-title{position:absolute;z-index:2;font-size:8px;font-weight:1000;letter-spacing:.08em;background:#fff;padding:3px 6px;border-radius:6px}
.runner{position:absolute;z-index:3;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:1000;border:3px solid #fff;box-shadow:0 2px 7px #0005;cursor:pointer}
.finishviz{border-radius:16px;background:linear-gradient(90deg,#d8b47a 0 82%,#fff 82% 86%,#111 86% 90%,#fff 90%);border-width:0;min-height:220px}
.finish-line{position:absolute;right:11%;top:0;bottom:0;width:18px;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0/12px 12px}
.finish-runner{position:absolute;left:var(--x);top:var(--y);z-index:3;display:flex;align-items:center;gap:7px}.finish-runner .saddle{box-shadow:0 2px 6px #0005}
.vizinfo{margin-top:8px;font-size:11px;font-weight:850;color:var(--muted)}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="brand">PlayersHype · Definiendo el estándar</div><div class="title">HypePredict</div><div class="sub">Track Hub · análisis público de jornada</div></div></header>
<section class="controls"><select id="track" aria-label="Hipódromo"><option>Cargando hipódromos…</option></select><select id="date" aria-label="Fecha"><option>Cargando fechas…</option></select><button id="refresh">Actualizar</button></section>
<div class="status" id="status">Conectando con la data publicada…</div>
<main class="grid" id="app"></main>
<footer>PLAYERSHYPE · No seguimos el hype. Lo creamos.</footer>
<script>
const CONFIG_URL='../app/config.json';let DATA=null,OPEN=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const tracks=()=> (DATA?.tracks||[]).filter(t=>t.enabled!==false),day=id=>DATA?.raceDays?.[id],analyses=()=>DATA?.hypepredict?.analyses||{},analysisFor=r=>analyses()[r.id];
const cloths={1:['#d71920','#fff'],2:['#fff','#111'],3:['#f2cf00','#111'],4:['#1f4eaa','#fff'],5:['#18864b','#fff'],6:['#111','#f2cf00'],7:['#f28c28','#111'],8:['#ef6fa8','#111'],9:['#39a9db','#111'],10:['#7a3db8','#fff'],11:['#9aa4ad','#111'],12:['#8b5a2b','#fff'],13:['#8b5a2b','#fff'],14:['#8b5a2b','#fff']};function cloth(n){const c=cloths[n]||['#8b5a2b','#fff'];return '<span class="saddle" style="background:'+c[0]+';color:'+c[1]+'">'+esc(n)+'</span>'}function horse(h){return h?('#'+esc(h.programNumber)+' '+esc(h.name)+(h.hypeScore!=null?' · '+esc(h.hypeScore):'')):'No aplica'}
function listPace(a){return (a||[]).map(x=>'#'+esc(x.programNumber)+' '+esc(x.name)).join(', ')||'—'}function paceVisual(p){const groups=[['SPEED',p.speed||[],18,18],['PRESSER',p.presser||[],68,20],['STALKER',p.stalker||[],70,68],['CLOSER',p.closer||[],18,70]],parts=[];groups.forEach(([label,arr,x,y],gi)=>{arr.forEach((r,i)=>{const c=cloths[r.programNumber]||['#8b5a2b','#fff'];parts.push('<button class="runner" title="'+esc(r.name)+'" aria-label="'+esc(label+' '+r.name)+'" style="left:calc('+x+'% + '+(i*14)+'px);top:calc('+y+'% + '+(i*10)+'px);background:'+c[0]+';color:'+c[1]+'">'+esc(r.programNumber)+'</button>')})});return '<div class="trackviz"><span class="lane-title" style="left:12%;top:7%">SPEED</span><span class="lane-title" style="right:10%;top:7%">PRESSER</span><span class="lane-title" style="right:10%;bottom:7%">STALKER</span><span class="lane-title" style="left:12%;bottom:7%">CLOSER</span>'+parts.join('')+'</div>'}function finishVisual(a){const b=a.hypeBoard||[],max=b.length;return '<div class="finishviz"><div class="finish-line"></div>'+b.map((r,i)=>{const x=Math.max(7,76-i*8),y=8+(i*(78/Math.max(1,max-1)));return '<div class="finish-runner" style="--x:'+x+'%;--y:'+y+'%">'+cloth(r.programNumber)+'<b>#'+(i+1)+' '+esc(r.name)+'</b></div>'}).join('')+'</div><div class="vizinfo">Proyección visual basada en el orden del HypeBoard; no representa márgenes físicos calculados.</div>'}
function card(title,body,cls=''){return '<section class="race '+cls+'"><div class="racehead"><div class="rtitle"><b>'+esc(title)+'</b></div></div>'+body+'</section>'}
function kv(label,val){return '<div class="pick"><span class="tag">'+esc(label)+'</span><strong>'+esc(val??'—')+'</strong></div>'}
function grab(s,a,b){const i=s.indexOf(a);if(i<0)return '';const x=i+a.length,j=b?s.indexOf(b,x):-1;return s.slice(x,j>x?j:s.length).trim()}
function silkStyle(desc){const x=(desc||'').toLowerCase();let c1='#f7f7f7',c2='#2f80ed';if(x.includes('roja')||x.includes('rojo'))c1='#d92d20';if(x.includes('verde'))c1='#35b85a';if(x.includes('azul'))c2='#2463d4';if(x.includes('rosa'))c2='#ef6fa8';if(x.includes('amarill'))c2='#f2c94c';if(x.includes('gris'))c1='#9aa4ad';if(x.includes('negra')||x.includes('negro'))c1='#20252b';if(x.includes('blanca')||x.includes('blanco'))c1='#f7f7f7';return 'background:linear-gradient(90deg,'+c1+' 0 33%,'+c2+' 33% 66%,'+c1+' 66%)'}
function parseHorse(h){const s=h.sourceText||'',peso=grab(s,'Peso:','Jinete:'),jinete=grab(s,'Jinete:','Entrenador:'),trainer=grab(s,'Entrenador:','Establo/propietario:'),stable=grab(s,'Establo/propietario:','Uniforme:'),uniform=grab(s,'Uniforme:','Últimas cinco:'),last=grab(s,'Últimas cinco:','Días sin correr:'),days=grab(s,'Días sin correr:','Briseos disponibles:'),works=grab(s,'Briseos disponibles:','Perfil:'),profile=grab(s,'Perfil:','Power/Rating:'),power=grab(s,'Power/Rating:','Distancia:'),distance=grab(s,'Distancia:','Value:'),value=grab(s,'Value:','LECTURA:'),read=grab(s,'LECTURA:','USO:'),use=grab(s,'USO:');return {peso,jinete,trainer,stable,uniform,last,days,works,profile,power,distance,value,read,use}}
function horseCard(h){const x=parseHorse(h);return '<article class="horse-card"><div class="horse-top"><div class="cloth">'+esc(h.programNumber)+'</div><div class="silks"><div class="silks-body" style="'+silkStyle(x.uniform)+'"></div><span class="silks-label">representación</span></div><div><div class="role">'+esc(h.role)+'</div><div class="horse-name">'+esc(h.name)+'</div><div><span class="score">'+esc(h.hypeScore)+'</span> · '+esc(h.reliability)+'</div></div></div><div class="stats">'+
[['Jinete',x.jinete],['Entrenador',x.trainer],['Peso',x.peso],['Perfil',x.profile],['Establo',x.stable],['Forma reciente',x.last],['Días sin correr',x.days],['Distancia',x.distance],['Power / Rating',x.power],['Value',x.value],['Uso',x.use],['Uniforme',x.uniform]].map(v=>'<div class="stat"><small>'+esc(v[0])+'</small><b>'+esc(v[1]||'—')+'</b></div>').join('')+'</div><div class="workouts"><b>BRISEOS</b><br>'+esc(x.works||'No disponible')+'</div><div class="read"><b>LECTURA</b><br>'+esc(x.read||'—')+'</div></article>'}
function checklistFromSource(a){return '<section class="detail-grid">'+(a?.horses||[]).slice().sort((x,y)=>x.programNumber-y.programNumber).map(horseCard).join('')+'</section>'}
function detail(r){const a=analysisFor(r);if(!a)return '<div class="empty"><b>Sin análisis publicado</b></div>';const q=a.quickHits||{},m=a.raceMeta||{},p=a.paceProjection||{},risk=a.riskControl||{},pool=a.poolIntelligence||{};
return '<button id="backRace" class="btn" style="margin-bottom:12px">← Volver a la jornada</button>'+
'<section class="hero"><div class="kicker">HypePredict · Carrera '+esc(r.number)+'</div><h2>'+esc(m.distance||'')+' · '+esc(m.surface||'')+'</h2><div class="meta">'+esc(m.condition||m.title||'')+'</div></section>'+
card('QUICK HITS','<div class="picks">'+kv('Select',horse(q.select))+kv('Rival',horse(q.rival))+kv('Tapada',horse(q.sleeper))+kv('Value',q.value)+kv('Riesgo',q.risk)+kv('Confianza',q.selectConfidence)+kv('Confiabilidad',q.selectReliability)+kv('Gap',q.gap)+kv('Decisión',q.decision)+'</div><p>'+esc(q.decisionReason||'')+'</p>')+
card('PACE PROJECTION',paceVisual(p)+'<p>'+esc(p.scenario||'')+'</p>')+card('PROYECCIÓN DE LLEGADA',finishVisual(a))+
card('LECTURA GENERAL','<p>'+esc(a.raceRead||'—')+'</p>')+
card('HYPEBOARD','<div class="picks">'+(a.hypeBoard||[]).map(x=>kv('#'+x.rank,'#'+x.programNumber+' '+x.name+' · '+x.hypeScore+' · '+x.reliability)).join('')+'</div>')+
checklistFromSource(a)+
card('CONTROL DE RIESGO','<div class="picks">'+kv('Gap',risk.gap)+kv('Decisión',risk.decision)+kv('Confiabilidad',risk.selectReliability)+kv('Riesgo',risk.risk)+kv('Factores',risk.factors)+'</div>')+
card('POOL INTELLIGENCE','<div class="picks">'+kv('Fijo',pool.fixed)+kv('Base',pool.base)+kv('Defensa',pool.defense)+kv('Cobertura',pool.coverage)+kv('Primer corte',pool.firstCut)+kv('Outsider',pool.outsider)+kv('Estrategia',pool.strategy)+'</div>')+
card('HYPEBET','<p>'+esc(a.hypeBet||'No aplica')+'</p>')}
function raceCard(r){const a=analysisFor(r),track=$('#track').value,url=location.pathname+'?v=3&track='+encodeURIComponent(track)+'&race='+encodeURIComponent(r.id),field=(a?.horses||[]).slice().sort((x,y)=>(x.programNumber||0)-(y.programNumber||0));return '<article class="race"><div class="racehead"><div class="rnum">'+esc(r.number)+'</div><div class="rtitle"><b>Carrera '+esc(r.number)+'</b><span>'+esc(a?.status||'programada')+' · '+field.length+' ejemplares</span></div></div><div class="picks">'+field.map(x=>kv(x.role||'CAMPO','#'+x.programNumber+' '+x.name+' · '+x.hypeScore)).join('')+'</div><a href="'+url+'" style="display:block;margin-top:12px;padding:12px;border-radius:10px;background:#061d32;color:#fff;text-align:center;text-decoration:none;font-weight:900">ABRIR ANÁLISIS COMPLETO →</a></article>'}
function render(){const id=$('#track').value,t=tracks().find(x=>x.id===id),d=day(id);if(!t||!d?.date){$('#app').innerHTML='<div class="empty"><b>No hay jornada publicada</b></div>';return}const races=d.races||[],pub=races.filter(r=>analysisFor(r)?.status==='published').length;if(OPEN){const r=races.find(x=>x.id===OPEN);if(r){$('#app').innerHTML=detail(r);$('#backRace').onclick=()=>{OPEN=null;history.pushState({},'',location.pathname+'?track='+encodeURIComponent(id));render()};window.scrollTo(0,0);return}OPEN=null}
$('#app').innerHTML='<section class="hero"><div class="kicker">Jornada publicada</div><h2>'+esc(t.name)+'</h2><div class="meta">'+esc(d.date)+' · '+races.length+' carreras · '+pub+' análisis HypePredict publicados</div></section><section class="races">'+races.map(raceCard).join('')+'</section>';$('#status').textContent='Config '+esc(DATA.revision||'')+' · '+t.name+' · '+pub+'/'+races.length+' análisis'}
function syncDates(){OPEN=null;const d=day($('#track').value);$('#date').innerHTML=d?.date?'<option>'+esc(d.date)+'</option>':'<option>Sin jornada publicada</option>';render()}
async function load(){try{$('#status').textContent='Actualizando data pública…';const res=await fetch(CONFIG_URL+'?v='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);DATA=await res.json();$('#track').innerHTML=tracks().map(t=>'<option value="'+esc(t.id)+'">'+esc(t.name)+'</option>').join('');const params=new URLSearchParams(location.search),requestedTrack=params.get('track'),requestedRace=params.get('race');if(requestedTrack&&tracks().some(t=>t.id===requestedTrack))$('#track').value=requestedTrack;OPEN=requestedRace||null;const d=day($('#track').value);$('#date').innerHTML=d?.date?'<option>'+esc(d.date)+'</option>':'<option>Sin jornada publicada</option>';render()}catch(e){$('#status').textContent='No se pudo cargar la data publicada';$('#app').innerHTML='<div class="empty"><b>HypePredict no pudo conectar</b><span>'+esc(e.message)+'</span></div>'}}
$('#track').addEventListener('change',()=>{OPEN=null;history.pushState({},'',location.pathname+'?track='+encodeURIComponent($('#track').value));syncDates()});$('#date').addEventListener('change',render);window.addEventListener('popstate',()=>location.reload());$('#refresh').addEventListener('click',load);load();
</script>
</body></html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07182b">
<title>HypePredict — PlayersHype</title>
<style>
:root{--navy:#07182b;--navy2:#102c44;--lime:#caff00;--cyan:#25c5df;--bg:#eef3f6;--card:#fff;--text:#132d46;--muted:#6d8194;--line:#d9e4ec}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.top{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-bottom:4px solid var(--lime);padding:18px 18px 16px}
.wrap{max-width:1180px;margin:auto}.brand{font-size:12px;font-weight:900;letter-spacing:.16em;color:var(--lime);text-transform:uppercase}.title{font-size:clamp(27px,5vw,46px);font-weight:1000;letter-spacing:-.04em;margin:5px 0 2px}.sub{color:#bdd0df;font-size:13px;font-weight:700}
.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin:18px auto 12px;padding:0 16px;max-width:1180px}
select,button{min-height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);font:inherit;font-weight:850;padding:0 12px}button{cursor:pointer;background:var(--navy);color:#fff;border-color:var(--navy)}
.status{max-width:1180px;margin:0 auto;padding:0 16px 12px;font-size:12px;color:var(--muted);font-weight:750}
.grid{max-width:1180px;margin:auto;padding:0 16px 34px;display:grid;gap:12px}.hero,.race,.empty{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 22px rgba(8,24,43,.06)}
.hero{padding:18px}.kicker{font-size:10px;font-weight:1000;letter-spacing:.14em;text-transform:uppercase;color:#668095}.hero h2{margin:5px 0 3px;font-size:25px}.meta{color:var(--muted);font-size:13px;font-weight:750}
.races{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.race{padding:15px;overflow:hidden}.racehead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.rnum{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--navy);color:var(--lime);font-weight:1000}.rtitle{flex:1}.rtitle b{display:block;font-size:16px}.rtitle span{font-size:11px;color:var(--muted);font-weight:800}.picks{margin-top:12px;display:grid;gap:7px}.pick{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #edf1f4;padding-top:7px;font-size:12px}.pick strong{font-weight:950}.tag{font-size:9px;font-weight:1000;letter-spacing:.08em;text-transform:uppercase;color:#60758a}.empty{padding:28px;text-align:center}.empty b{display:block;font-size:18px}.empty span{display:block;margin-top:5px;color:var(--muted);font-size:13px;line-height:1.45}
.raw{white-space:pre-wrap;word-break:break-word;font-size:11px;line-height:1.45;color:#40566a;max-height:380px;overflow:auto;background:#f7fafc;border-radius:10px;padding:10px;margin-top:10px}
footer{text-align:center;color:#8091a2;font-size:11px;font-weight:800;padding:18px}
@media(max-width:650px){.controls{grid-template-columns:1fr 1fr}.controls button{grid-column:1/-1}.races{grid-template-columns:1fr}.top{padding-top:calc(18px + env(safe-area-inset-top))}}

.detail-grid{display:grid;gap:12px}.horse-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 8px 22px rgba(8,24,43,.06)}
.horse-top{display:grid;grid-template-columns:54px 72px 1fr;gap:12px;align-items:center}.cloth{width:54px;height:54px;border-radius:14px;background:var(--navy);color:var(--lime);display:grid;place-items:center;font-size:22px;font-weight:1000}
.silks{width:70px;height:62px;position:relative;display:grid;place-items:center}.silks-body{width:46px;height:46px;border-radius:14px 14px 9px 9px;border:2px solid #17324a;background:linear-gradient(90deg,#fff 0 33%,#2f80ed 33% 66%,#fff 66%);position:relative}.silks-body:before,.silks-body:after{content:"";position:absolute;top:6px;width:19px;height:17px;border:2px solid #17324a;background:inherit}.silks-body:before{left:-17px;transform:rotate(25deg);border-radius:8px 2px}.silks-body:after{right:-17px;transform:rotate(-25deg);border-radius:2px 8px}.silks-label{position:absolute;bottom:-2px;font-size:7px;font-weight:1000;text-transform:uppercase;color:#667d91}
.horse-name{font-size:18px;font-weight:1000}.role{font-size:10px;font-weight:1000;letter-spacing:.12em;color:#647b90}.score{font-size:20px;font-weight:1000;color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}.stat{background:#f5f8fa;border-radius:11px;padding:9px}.stat small{display:block;font-size:8px;font-weight:1000;letter-spacing:.09em;color:#6b8093;text-transform:uppercase}.stat b{display:block;margin-top:2px;font-size:12px}
.read{margin-top:12px;padding:12px;border-left:4px solid var(--lime);background:#f8fafb;border-radius:8px;font-size:12px;line-height:1.55}.workouts{font-size:11px;line-height:1.55;margin-top:10px}
.pace-map{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.pace-lane{background:#f5f8fa;border-radius:12px;padding:10px;text-align:center}.pace-lane b{display:block;font-size:9px;letter-spacing:.08em}.pace-lane span{display:block;font-size:10px;margin-top:6px;font-weight:850}
@media(max-width:650px){.horse-top{grid-template-columns:48px 64px 1fr}.cloth{width:48px;height:48px}.silks{width:62px}.stats{grid-template-columns:1fr 1fr}.pace-map{grid-template-columns:1fr 1fr}}

.saddle{display:inline-grid;place-items:center;min-width:34px;height:30px;border-radius:7px;border:1px solid rgba(0,0,0,.25);font-weight:1000;font-size:15px}
.trackviz,.finishviz{background:#0c503c;border:10px solid #d8b47a;border-radius:999px;padding:18px;position:relative;margin-top:12px;min-height:190px;overflow:hidden}
.trackviz:after{content:"";position:absolute;inset:38px;background:#eef3f6;border-radius:999px}
.lane-title{position:absolute;z-index:2;font-size:8px;font-weight:1000;letter-spacing:.08em;background:#fff;padding:3px 6px;border-radius:6px}
.runner{position:absolute;z-index:3;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:1000;border:3px solid #fff;box-shadow:0 2px 7px #0005;cursor:pointer}
.finishviz{border-radius:16px;background:linear-gradient(90deg,#d8b47a 0 82%,#fff 82% 86%,#111 86% 90%,#fff 90%);border-width:0;min-height:220px}
.finish-line{position:absolute;right:11%;top:0;bottom:0;width:18px;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0/12px 12px}
.finish-runner{position:absolute;left:var(--x);top:var(--y);z-index:3;display:flex;align-items:center;gap:7px}.finish-runner .saddle{box-shadow:0 2px 6px #0005}
.vizinfo{margin-top:8px;font-size:11px;font-weight:850;color:var(--muted)}

/* BUILD 6 — race-program visual system */
.race{border-radius:24px;padding:18px}.rnum{border-radius:14px}
.fieldrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #e8eef2}.fieldrow:first-child{border-top:0}.fieldrole{font-size:9px;font-weight:1000;letter-spacing:.09em;color:#708498}.fieldname{font-size:13px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fieldscore{font-size:13px;font-weight:1000}
.hypeboard-visual{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 4px;scroll-snap-type:x mandatory}.hbitem{min-width:104px;text-align:center;scroll-snap-align:start;background:#f5f8fa;border-radius:14px;padding:10px 7px}.hbitem b{display:block;font-size:10px;margin-top:5px}.hbitem strong{display:block;font-size:14px;margin-top:3px}
.trackviz{min-height:260px;border-width:16px;background:#5d8f52;box-shadow:inset 0 0 0 4px rgba(255,255,255,.3)}.trackviz:after{inset:50px;background:#d9c08a;box-shadow:inset 0 0 0 18px #3d7c45}.runner{width:44px;height:44px;font-size:17px;transition:.18s transform,.18s box-shadow}.runner:focus,.runner.active{outline:none;transform:scale(1.18);box-shadow:0 0 0 5px #caff00,0 4px 12px #0007}.runner-name{display:none}.track-note{background:#07182be8;color:#fff;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:11px;font-weight:850}
.finishviz{min-height:280px;background:linear-gradient(#c79d61,#e1bd82);overflow:hidden}.finishviz:before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#fff8;box-shadow:0 -52px #fff5,0 52px #fff5}.finish-runner{font-size:10px}.finish-runner b{background:#07182be8;color:#fff;padding:4px 6px;border-radius:7px;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.horse-card{border-radius:22px}.horse-top{grid-template-columns:44px 74px minmax(0,1fr)}.silks-body{height:52px;width:48px}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.read{font-size:13px}.section-label{font-size:9px;font-weight:1000;letter-spacing:.12em;color:#698095}
@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.trackviz{min-height:230px;border-width:12px}.trackviz:after{inset:44px}.finishviz{min-height:300px}.finish-runner b{max-width:86px}.race{padding:14px}}

.perspective-track{height:330px;position:relative;overflow:hidden;border-radius:20px;margin-top:12px;perspective:700px;background:#c89557}
.perspective-track:before{content:"";position:absolute;inset:-10% 7% -12%;transform:perspective(420px) rotateX(56deg);transform-origin:center bottom;border-left:7px solid #fff;border-right:7px solid #fff;background:repeating-linear-gradient(90deg,transparent 0 16%,rgba(255,255,255,.16) 16.3% 16.7%,transparent 17% 33%)}
.perspective-track.turf{background:#3c8a49}.perspective-track.turf:before{background:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 16%,rgba(255,255,255,.20) 16.3% 16.7%,rgba(0,0,0,.03) 17% 33%)}
.perspective-track.dirt{background:linear-gradient(#b8844e,#d1a66e)}
.rail{position:absolute;top:3%;bottom:0;width:5px;background:#fff;box-shadow:0 0 0 2px #cfd6dc;z-index:2}.rail-l{left:7%;transform:skewX(8deg)}.rail-r{right:7%;transform:skewX(-8deg)}
.finishmark{position:absolute;top:5px;left:50%;transform:translateX(-50%);z-index:4;background:#07182b;color:#fff;padding:5px 9px;border-radius:7px;font-size:9px;font-weight:1000;letter-spacing:.1em}
.pace-depth{position:absolute;left:9%;z-index:2;font-size:8px;font-weight:1000;letter-spacing:.08em;color:#fff;background:#07182bbd;padding:3px 6px;border-radius:5px}.pace-depth.front{top:14%}.pace-depth.p2{top:34%}.pace-depth.p3{top:55%}.pace-depth.back{top:76%}
.racehorse{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);z-index:5;border:0;background:transparent;padding:0;width:54px;height:46px;cursor:pointer}.horse-shape{font-size:39px;line-height:40px;color:#281b14;text-shadow:0 3px 3px #0004;display:block;transform:scaleX(-1)}.mini-cloth{position:absolute;left:18px;top:12px;display:grid;place-items:center;width:23px;height:20px;border-radius:4px;background:var(--cloth);color:var(--num);border:1px solid #fff;font-size:11px;font-weight:1000}.racehorse.active{filter:drop-shadow(0 0 5px #caff00);transform:translate(-50%,-50%) scale(1.22)}.racehorse:focus{outline:2px solid #caff00;outline-offset:3px}
@media(max-width:650px){.perspective-track{height:300px}.racehorse{width:48px}.horse-shape{font-size:34px}}

/* BUILD 8 cinematic race visuals */
.race-scene,.finish-scene{height:330px;position:relative;overflow:hidden;border-radius:18px;margin-top:12px;background:#8ec7e8;isolation:isolate}
.sky{position:absolute;inset:0 0 52%;background:linear-gradient(#7ebbe0,#d9eef6)}
.trees{position:absolute;left:0;right:0;top:30%;height:25%;background:radial-gradient(ellipse at 10% 100%,#285b31 0 18%,transparent 19%),radial-gradient(ellipse at 30% 100%,#38763d 0 22%,transparent 23%),radial-gradient(ellipse at 55% 100%,#24592f 0 20%,transparent 21%),radial-gradient(ellipse at 78% 100%,#397b41 0 24%,transparent 25%),radial-gradient(ellipse at 95% 100%,#275f34 0 18%,transparent 19%)}
.track-ground{position:absolute;left:-8%;right:-8%;top:48%;bottom:-12%;transform:perspective(420px) rotateX(56deg);transform-origin:bottom;background:#bf8b50}
.race-scene.turf .track-ground,.finish-scene.turf .finish-bg{background:#43874a}.race-scene.dirt .track-ground,.finish-scene.dirt .finish-bg{background:#bf8b50}
.track-ground:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 23%,rgba(255,255,255,.12) 23.5% 24%,transparent 24.5% 48%)}
.far-rail,.near-rail{position:absolute;left:0;right:0;height:5px;background:#fff;box-shadow:0 2px 0 #9aa8b1;z-index:3}.far-rail{top:51%}.near-rail{bottom:8%}
.finish-pole{position:absolute;right:6%;top:43%;bottom:8%;width:10px;z-index:8;background:repeating-linear-gradient(#fff 0 14px,#d71920 14px 28px);border:2px solid #fff}.finish-pole b{position:absolute;right:-8px;top:-29px;background:#07182b;color:#fff;border-radius:6px;padding:4px 6px;font-size:8px}
.scene-horse{position:absolute;left:var(--x);top:calc(96% - var(--y));width:108px;height:68px;transform:translate(-50%,-50%) scale(var(--z));transform-origin:center bottom;border:0;background:transparent;padding:0;z-index:6;cursor:pointer}.scene-horse.active{filter:drop-shadow(0 0 5px #caff00);transform:translate(-50%,-50%) scale(calc(var(--z) * 1.14))}
.horse-unit{display:block;width:100%;height:100%;transform:scale(var(--hs));transform-origin:center bottom}.horse-unit svg{width:100%;height:100%;overflow:visible}.horse-caption{display:none}
.role-legend{position:absolute;left:10px;top:10px;z-index:9;display:flex;gap:5px;flex-wrap:wrap}.role-legend span{font-size:7px;font-weight:1000;background:#07182bd9;color:#fff;border-radius:999px;padding:4px 6px}
.finish-scene{height:300px;background:#b7d7e7}.finish-bg{position:absolute;inset:38% 0 0;background:#bf8b50}.finish-bg:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 29%,rgba(255,255,255,.22) 30% 31%,transparent 32% 59%)}
.finish-pole-2{top:31%;bottom:0;right:7%}.finish-horse{position:absolute;left:var(--fx);top:var(--fy);width:105px;height:66px;z-index:5;transform:translate(-50%,-50%) scale(var(--fz))}.finish-horse strong{position:absolute;left:0;bottom:-4px;background:#07182b;color:#fff;border-radius:999px;padding:2px 6px;font-size:9px}
@media(max-width:650px){.race-scene{height:300px}.scene-horse{width:90px;height:58px}.finish-scene{height:310px}.finish-horse{width:82px;height:54px}}

/* BUILD 9 — horizontal race flow */
.horizontal-race{height:285px}.horizontal-race .track-ground{left:-3%;right:-3%;top:43%;bottom:-5%;transform:none;background:#bf8b50}.horizontal-race.turf .track-ground{background:#43874a}.horizontal-race .far-rail{top:43%}.horizontal-race .near-rail{bottom:7%}
.scene-horse.horizontal{left:var(--x);top:var(--y);width:96px;height:62px;transform:translate(-50%,-50%) scale(var(--z));z-index:7}.scene-horse.horizontal.active{transform:translate(-50%,-50%) scale(calc(var(--z) * 1.14))}
.horizontal-zones{position:absolute;left:7%;right:9%;bottom:10px;z-index:9;display:grid;grid-template-columns:repeat(4,1fr);text-align:center;pointer-events:none}.horizontal-zones span{justify-self:center;background:#07182bd9;color:#fff;border-radius:999px;padding:4px 7px;font-size:7px;font-weight:1000;letter-spacing:.05em}
.direction-arrow{position:absolute;right:11%;top:12px;z-index:9;background:#07182b;color:#fff;padding:5px 9px;border-radius:7px;font-size:9px;font-weight:1000;letter-spacing:.08em}
.right-finish{right:5%;top:38%;bottom:7%}
@media(max-width:650px){.horizontal-race{height:270px}.scene-horse.horizontal{width:78px;height:52px}.horizontal-zones{left:4%;right:7%}.horizontal-zones span{font-size:6px;padding:3px 5px}}

/* BUILD 10 — saddlecloth-only race visualization */
.pace-strip{height:230px;position:relative;overflow:hidden;border-radius:18px;margin-top:12px;background:#bf8b50;box-shadow:inset 0 0 35px #6f431e55}
.pace-strip.turf{background:#43874a}.pace-strip:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 32%,rgba(255,255,255,.10) 32.5% 33%,transparent 33.5% 66%)}
.pace-rail{position:absolute;left:0;right:0;height:5px;background:#fff;box-shadow:0 2px 0 #9ba9b3;z-index:2}.pace-rail.top{top:12%}.pace-rail.bottom{bottom:15%}
.pace-finish{position:absolute;right:5%;top:12%;bottom:15%;width:15px;z-index:4;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0/12px 12px}.pace-finish b{position:absolute;right:-6px;top:-27px;background:#07182b;color:#fff;border-radius:6px;padding:4px 6px;font-size:8px}
.pace-arrow{position:absolute;right:12%;top:7px;z-index:4;background:#07182b;color:#fff;border-radius:7px;padding:5px 8px;font-size:8px;font-weight:1000}
.pace-runner{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);z-index:5;border:0;background:transparent;padding:5px;cursor:pointer}.pace-cloth{width:48px;height:42px;border-radius:8px 8px 6px 6px;display:grid;place-items:center;background:var(--pc);color:var(--pn);border:3px solid #fff;box-shadow:0 5px 10px #0005;font-size:20px;font-weight:1000;transform:skewX(-4deg)}
.pace-runner.active .pace-cloth{outline:5px solid #caff00;transform:skewX(-4deg) scale(1.16)}.pace-runner:focus{outline:none}
.pace-zones{position:absolute;left:4%;right:9%;bottom:3px;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);text-align:center}.pace-zones span{justify-self:center;background:#07182bd9;color:#fff;border-radius:999px;padding:4px 7px;font-size:7px;font-weight:1000}
.finish-strip{height:235px;position:relative;overflow:hidden;border-radius:18px;background:#bf8b50;margin-top:12px}.finish-strip.turf{background:#43874a}.finish-strip:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 24%,rgba(255,255,255,.15) 24.5% 25%,transparent 25.5% 49%)}
.finish-checker{position:absolute;right:8%;top:0;bottom:0;width:20px;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0/14px 14px}.finish-meta{position:absolute;right:5%;top:8px;background:#07182b;color:#fff;padding:5px 7px;border-radius:6px;font-size:8px;font-weight:1000}.finish-cloth{position:absolute;left:var(--fx);top:var(--fy);transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px}.finish-cloth b{background:#07182b;color:#fff;border-radius:999px;padding:3px 6px;font-size:9px}
@media(max-width:650px){.pace-strip{height:220px}.pace-cloth{width:42px;height:37px;font-size:18px}.pace-zones span{font-size:6px;padding:3px 5px}.finish-strip{height:245px}}

/* BUILD 11 — PlayersHype horse identity */
.ph-horse{padding:0!important;overflow:hidden;border:1px solid #173a59!important;background:#fff!important;box-shadow:0 12px 28px #061d3218!important}
.ph-horse-head{display:grid;grid-template-columns:64px 76px minmax(0,1fr);gap:12px;align-items:center;padding:16px;background:linear-gradient(135deg,#04192d 0%,#082b49 70%,#0d3b61 100%);color:#fff;position:relative}
.ph-horse-head:after{content:"HYPEPREDICT";position:absolute;right:12px;top:8px;font-size:7px;letter-spacing:.18em;font-weight:1000;color:#72a1c2}
.ph-cloth{height:64px;border-radius:12px;display:grid;place-items:center;background:var(--pc);color:var(--pn);font-size:30px;font-weight:1000;border:2px solid #ffffffbb;box-shadow:0 5px 12px #0006}
.ph-silks{height:76px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(180deg,#ffffff18,#00000018);border:1px solid #ffffff24}.ph-silks .silks-body{height:58px;width:54px;filter:drop-shadow(0 5px 4px #0007)}
.ph-identity{min-width:0}.ph-identity .role{color:#caff00;font-size:9px;letter-spacing:.14em}.ph-identity .horse-name{font-size:20px;color:#fff;line-height:1.05;margin:3px 0 6px}.ph-score{display:flex;align-items:center;gap:8px}.ph-score strong{font-size:24px;color:#fff}.ph-score span{font-size:12px;color:#ffd45a}
.ph-primary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#071e33;color:#fff;border-top:1px solid #ffffff16}.ph-primary>div{padding:11px;border-right:1px solid #ffffff16}.ph-primary small,.ph-metrics small,.ph-uniform small{display:block;font-size:8px;font-weight:1000;letter-spacing:.11em;color:#7f99ae;margin-bottom:3px}.ph-primary b{font-size:11px;line-height:1.2}
.ph-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:#dce5eb;padding:1px}.ph-metrics>div{background:#f5f8fa;padding:11px;min-height:58px}.ph-metrics b{font-size:11px;line-height:1.25;color:#0b2942}

function weatherKey(t){const s=(String(t.id||'')+' '+String(t.name||'')+' '+String(t.nameEn||'')+' '+String(t.location||'')+' '+String(t.locationEn||'')).toLowerCase();if(s.includes('camar'))return'camarero';if(s.includes('gulf'))return'gulfstream';if(s.includes('belmont'))return'belmont';if(s.includes('churchill'))return'churchill';if(s.includes('keeneland')||s.includes('versailles'))return'keeneland';if(s.includes('parx')||s.includes('bensalem')||s.includes('3001 street'))return'parx';if(s.includes('horseshoe')||s.includes('shelbyville'))return'horseshoe';return null}
function weatherLabel(c){if(c===0)return'Despejado';if(c===1||c===2)return'Parcialmente nublado';if(c===3)return'Nublado';if(c===45||c===48)return'Niebla';if(c>=51&&c<=57)return'Llovizna';if(c>=61&&c<=67)return'Lluvia';if(c>=80&&c<=82)return'Aguaceros';if(c>=95)return'Tormentas';return'Condición actual'}
async function loadWeather(t){const box=document.getElementById('weatherBox');if(!box)return;const p=WEATHER_TRACKS[weatherKey(t)];if(!p){box.innerHTML='<div class="weather-unavailable">Weather no disponible para este hipódromo</div>';return}const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),8000);try{const u='https://api.open-meteo.com/v1/forecast?latitude='+p.lat+'&longitude='+p.lon+'&current=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=auto';const z=await fetch(u,{cache:'no-store',signal:ctrl.signal});if(!z.ok)throw Error('HTTP '+z.status);const data=await z.json(),w=data&&data.current;if(!w||!Number.isFinite(Number(w.temperature_2m)))throw Error('Sin current');if(!box.isConnected)return;box.innerHTML='<div class="weather-head"><div><small>WEATHER · '+esc(p.label)+'</small><b>'+esc(weatherLabel(Number(w.weather_code)))+'</b></div><strong>'+Math.round(Number(w.temperature_2m))+'°F</strong></div><div class="weather-grid"><div><span>SENSACIÓN</span><b>'+Math.round(Number(w.apparent_temperature))+'°F</b></div><div><span>VIENTO</span><b>'+Math.round(Number(w.wind_speed_10m))+' mph</b></div><div><span>PRECIP.</span><b>'+Number(w.precipitation||0).toFixed(2)+' in</b></div></div><div class="weather-note">Actualizado '+esc(String(w.time||'').replace('T',' '))+'</div>'}catch(e){if(box.isConnected)box.innerHTML='<div class="weather-unavailable">Weather no disponible en este momento · intenta Actualizar</div>'}finally{clearTimeout(timer)}}
function scratchEntries(a){if(!a)return[];const text=[a.sourceText,a.quickHits?.decisionReason,a.raceRead,a.paceProjection?.scenario,a.riskControl?.factors].filter(Boolean).join(' | '),out=[],seen=new Set();const add=(n,name='')=>{n=String(n||'').trim();if(!n||seen.has(n))return;seen.add(n);const h=(a.horses||[]).find(x=>String(x.programNumber)===n);out.push({programNumber:n,name:String(name||h?.name||'').replace(/\s*[—–-]?\s*RETIRAD[OA].*$/i,'').trim()})};let m;
// Highest confidence: explicit "#N NAME — RETIRADO".
const marked=/#\s*(\d{1,2})(?:\s+([^#;|.]+?))?\s*(?:—|–|-)\s*RETIRAD[OA]/gi;while((m=marked.exec(text)))add(m[1],m[2]||'');
// Narrative: capture ONLY the list immediately attached to "retiro(s) de" and stop at tactical prose.
const lead=/(?:los\s+)?retiros?\s+de\s+([^.|]+)/gi;while((m=lead.exec(text))){let seg=m[1].split(/\b(?:elimina|eliminan|reduce|reducen|modifica|modifican|obliga|obligan|cambia|cambian|mejora|mejoran|deja|dejan|altera|alteran|favorece|favorecen|introduce|introducen)\b/i)[0];const parts=seg.split(/\s+(?:y|and)\s+(?=#)|\s*;\s*(?=#)|\s*,\s*(?=#)/i);for(const part of parts){const x=part.match(/^\s*#\s*(\d{1,2})(?:\s+([A-Za-zÀ-ÿ0-9'’.\- ]+?))?\s*$/);if(x)add(x[1],x[2]||'')}}
// Structured "Retiros de carrera:" lines can contain multiple marked entries; if names are absent, keep exact numbers only.
const structured=/retiros?\s+de\s+carrera\s*:\s*([^|\n]+)/gi;while((m=structured.exec(text))){let x;const nums=/#\s*(\d{1,2})/g;while((x=nums.exec(m[1])))add(x[1])}return out}
function scratchesBlock(a,title='RETIROS'){const xs=scratchEntries(a);if(!xs.length)return'';return '<section class="scratches"><div class="scratches-head"><b>'+esc(title)+'</b><span>'+xs.length+' CONFIRMADO'+(xs.length===1?'':'S')+'</span></div><div class="scratches-list">'+xs.map(x=>'<div class="scratch-chip"><em>#'+esc(x.programNumber)+'</em>'+(x.name?' '+esc(x.name):'')+' · RETIRADO</div>').join('')+'</div></section>'}
function dayScratches(races){const rows=[];for(const r of races){const a=analysisFor(r);for(const x of scratchEntries(a))rows.push({race:r.number,...x})}if(!rows.length)return'';return '<section class="scratches day-scratches"><div class="scratches-head"><b>RETIROS DE LA JORNADA</b><span>'+rows.length+' TOTAL</span></div><div class="scratches-list">'+rows.map(x=>'<div class="scratch-chip"><strong>R'+esc(x.race)+'</strong> · <em>#'+esc(x.programNumber)+'</em>'+(x.name?' '+esc(x.name):'')+'</div>').join('')+'</div></section>'}
function jornadaHome(t,d,races,pub){const pct=races.length?Math.round(pub/races.length*100):0;return '<section class="day-home"><div class="day-brand"><div><div class="day-kicker">PLAYERSHYPE · HYPEPREDICT</div><h2>'+esc(t.name)+'</h2><div class="day-date">'+esc(d.date||'Sin fecha publicada')+'</div></div><div class="day-status">'+esc(d.status||'JORNADA')+'</div></div><div id="weatherBox" class="weather-box"><div class="weather-loading">Cargando weather del hipódromo…</div></div><div class="day-kpis"><div><strong>'+races.length+'</strong><span>CARRERAS</span></div><div><strong>'+pub+'</strong><span>ANÁLISIS</span></div><div><strong>'+pct+'%</strong><span>PUBLICADO</span></div></div><div class="day-racebar"><small>NAVEGAR JORNADA</small><div class="day-pills">'+races.map(r=>'<a href="'+location.pathname+'?v=22&date='+encodeURIComponent(d.date||'')+'&track='+encodeURIComponent(t.id)+'&race='+encodeURIComponent(r.id)+'">R'+esc(r.number)+'</a>').join('')+'</div></div></section>'}function render(){const id=$('#track').value,t=tracks().find(x=>x.id===id),d=day(id);if(!t||!d?.date){$('#app').innerHTML='<div class="empty"><b>No hay jornada publicada</b></div>';return}const races=d.races||[],pub=races.filter(r=>analysisFor(r)?.status==='published').length;if(OPEN){const r=races.find(x=>x.id===OPEN);if(r){$('#app').innerHTML=detail(r);$('#backRace').onclick=()=>{OPEN=null;history.pushState({},'',location.pathname+'?date='+encodeURIComponent(d.date||'')+'&track='+encodeURIComponent(id));render()};document.querySelectorAll('[data-trackviz] .pace-runner').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-trackviz] .pace-runner').forEach(x=>x.classList.remove('active'));b.classList.add('active');const note=document.querySelector('[data-tracknote]');if(note)note.textContent=b.getAttribute('aria-label')}));bindTale(analysisFor(r));bindHorseDetails(analysisFor(r));window.scrollTo(0,0);return}OPEN=null}
$('#app').innerHTML=jornadaHome(t,d,races,pub)+dayScratches(races)+dayBoard(races)+'<section class="day-section-head"><div><small>PROGRAMA</small><h3>Carreras de la jornada</h3></div><span>'+pub+'/'+races.length+' listas</span></section><section class="races">'+races.map(raceCard).join('')+'</section>';loadWeather(t);$('#status').textContent='Config '+esc(DATA.revision||'')+' · '+t.name+' · '+pub+'/'+races.length+' análisis'}
function fillTracksForDate(date,preferred){const available=tracksForDate(date);$('#track').innerHTML=available.map(t=>'<option value="'+esc(t.id)+'">'+esc(t.name)+'</option>').join('');if(preferred&&available.some(t=>t.id===preferred))$('#track').value=preferred;return available}
function syncDates(){OPEN=null;const current=$('#track').value,d=day(current);if(d?.date&&$('#date').value!==d.date)$('#date').value=d.date;render()}
async function activateDate(date){if(!HISTORY[date]){DATA=LIVE_DATA;return}const merged={schemaVersion:2,revision:'history-'+date,tracks:[],raceDays:{},hypepredict:{analyses:{}},horseData:{}};for(const u of HISTORY[date]){const res=await fetch(u+'?v='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('Histórico '+date+' HTTP '+res.status);const j=await res.json();for(const t of (j.tracks||[]))if(!merged.tracks.some(x=>x.id===t.id))merged.tracks.push(t);Object.assign(merged.raceDays,j.raceDays||{});Object.assign(merged.hypepredict.analyses,j.hypepredict?.analyses||{});Object.assign(merged.horseData,j.horseData||{})}DATA=merged}async function syncTracksFromDate(){OPEN=null;const date=$('#date').value;try{await activateDate(date);const available=fillTracksForDate(date);if(!available.length){$('#app').innerHTML='<div class="empty"><b>No hay análisis publicados para esta fecha</b></div>';return}history.pushState({},'',location.pathname+'?date='+encodeURIComponent(date)+'&track='+encodeURIComponent($('#track').value));render()}catch(e){$('#app').innerHTML='<div class="empty"><b>No se pudo cargar el histórico</b><span>'+esc(e.message)+'</span></div>'}}
async function load(){try{$('#status').textContent='Actualizando data pública…';const res=await fetch(CONFIG_URL+'?v='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);LIVE_DATA=await res.json();DATA=LIVE_DATA;const params=new URLSearchParams(location.search),requestedTrack=params.get('track'),requestedRace=params.get('race'),requestedDate=params.get('date'),liveRequestedDay=requestedTrack?LIVE_DATA?.raceDays?.[requestedTrack]:null,allDates=dates(),initialDate=requestedDate||liveRequestedDay?.date||allDates[0];$('#date').innerHTML=allDates.map(d=>'<option value="'+esc(d)+'">'+esc(d)+'</option>').join('');if(initialDate)$('#date').value=initialDate;await activateDate(initialDate);const available=fillTracksForDate(initialDate,requestedTrack);if(!available.length)throw Error('No hay análisis publicados');OPEN=(requestedTrack&&available.some(t=>t.id===requestedTrack))?requestedRace:null;render()}catch(e){$('#status').textContent='No se pudo cargar la data publicada';$('#app').innerHTML='<div class="empty"><b>HypePredict no pudo conectar</b><span>'+esc(e.message)+'</span></div>'}}
$('#track').addEventListener('change',()=>{OPEN=null;history.pushState({},'',location.pathname+'?date='+encodeURIComponent($('#date').value)+'&track='+encodeURIComponent($('#track').value));syncDates()});$('#date').addEventListener('change',syncTracksFromDate);window.addEventListener('popstate',()=>location.reload());$('#refresh').addEventListener('click',load);load();
</script>

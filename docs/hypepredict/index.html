<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A192F">
<title>HypePredict — PlayersHype</title>
<style>
:root{--navy:#0A192F;--navy2:#20366B;--lime:#64FFDA;--cyan:#00B4D8;--bg:#E0FBFC;--card:#E0FBFC;--text:#20366B;--muted:#20366B;--line:#BCEBF2}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.top{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#E0FBFC;border-bottom:4px solid var(--lime);padding:18px 18px 16px}
.wrap{max-width:1180px;margin:auto}.brand{font-size:12px;font-weight:900;letter-spacing:.16em;color:var(--lime);text-transform:uppercase}.title{font-size:clamp(27px,5vw,46px);font-weight:1000;letter-spacing:-.04em;margin:5px 0 2px}.sub{color:#BCEBF2;font-size:13px;font-weight:700}
.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin:18px auto 12px;padding:0 16px;max-width:1180px}
select,button{min-height:46px;border:1px solid var(--line);border-radius:12px;background:#E0FBFC;color:var(--text);font:inherit;font-weight:850;padding:0 12px}button{cursor:pointer;background:var(--navy);color:#E0FBFC;border-color:var(--navy)}
.status{max-width:1180px;margin:0 auto;padding:0 16px 12px;font-size:12px;color:var(--muted);font-weight:750}
.grid{max-width:1180px;margin:auto;padding:0 16px 34px;display:grid;gap:12px}.hero,.race,.empty{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 22px rgba(8,24,43,.06)}
.hero{padding:18px}.kicker{font-size:10px;font-weight:1000;letter-spacing:.14em;text-transform:uppercase;color:#20366B}.hero h2{margin:5px 0 3px;font-size:25px}.meta{color:var(--muted);font-size:13px;font-weight:750}
.races{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.race{padding:15px;overflow:hidden}.racehead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.rnum{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--navy);color:var(--lime);font-weight:1000}.rtitle{flex:1}.rtitle b{display:block;font-size:16px}.rtitle span{font-size:11px;color:var(--muted);font-weight:800}.picks{margin-top:12px;display:grid;gap:7px}.pick{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #E0FBFC;padding-top:7px;font-size:12px}.pick strong{font-weight:950}.tag{font-size:9px;font-weight:1000;letter-spacing:.08em;text-transform:uppercase;color:#20366B}.empty{padding:28px;text-align:center}.empty b{display:block;font-size:18px}.empty span{display:block;margin-top:5px;color:var(--muted);font-size:13px;line-height:1.45}
.raw{white-space:pre-wrap;word-break:break-word;font-size:11px;line-height:1.45;color:#37577A;max-height:380px;overflow:auto;background:#E0FBFC;border-radius:10px;padding:10px;margin-top:10px}
footer{text-align:center;color:#20366B;font-size:11px;font-weight:800;padding:18px}
@media(max-width:650px){.controls{grid-template-columns:1fr 1fr}.controls button{grid-column:1/-1}.races{grid-template-columns:1fr}.top{padding-top:calc(18px + env(safe-area-inset-top))}}

/* HypePredict: authentic uniform colors, separate from saddlecloth */
.ph-silk{width:60px;height:60px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;flex:none}.ph-silk svg{width:100%;height:100%;overflow:visible}.ph-silk-unknown{color:#20366B;font-size:11px;font-weight:800}
.ph-horse{display:flex;align-items:center;gap:10px;margin-top:8px}.ph-horse-name{font-size:13px;font-weight:850}.ph-uniform-description{display:block;font-size:10px;color:#20366B;font-weight:650;margin-top:2px}

/* HypePredict — lectura editorial completa, responsive y sin datos inventados */
html{scroll-behavior:smooth}
body{background:#E0FBFC}
.grid{gap:16px}
.hero{border-radius:20px;background:#0A192F;color:#E0FBFC;border-color:#20366B;box-shadow:0 12px 30px rgba(8,24,43,.12)}
.hero .kicker{color:#64FFDA}.hero .meta{color:#BCEBF2;line-height:1.6}
.hero h2{font-size:clamp(26px,5vw,38px)}
.daynotice{font-size:12px;color:#BCEBF2;margin-top:9px}
.race-index{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0 2px}
.race-index a{display:grid;place-items:center;min-width:40px;min-height:40px;border:1px solid #BCEBF2;border-radius:12px;background:#E0FBFC;color:#20366B;font-weight:900;text-decoration:none}
.race-index a:hover,.race-index a:focus{background:#20366B;color:#64FFDA}
.race-index b{font-size:12px;color:#20366B;margin-right:6px}
.races{grid-template-columns:1fr;gap:18px}
.race{padding:0;border-radius:20px;box-shadow:0 8px 26px rgba(8,24,43,.08);scroll-margin-top:15px}
.race-banner{background:linear-gradient(115deg,#0A192F,#20366B);padding:18px 20px;color:#E0FBFC}
.race-head{display:flex;align-items:center;gap:12px}
.race-no{width:54px;height:54px;flex:none;display:grid;place-items:center;background:#64FFDA;color:#0A192F;border-radius:14px;font-size:24px;font-weight:1000}
.race-title{min-width:0}.race-title h3{margin:0;font-size:clamp(18px,3.6vw,23px);line-height:1.25}.race-title small{display:block;color:#BCEBF2;font-size:12px;font-weight:800;margin-bottom:4px}
.race-subtitle{color:#BCEBF2;font-size:13px;line-height:1.6;margin:12px 0 0}
.race-core{padding:18px 20px;display:grid;gap:18px}
.section-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:950;color:#20366B;margin:0 0 10px}
.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.quick-cell{background:#E0FBFC;border:1px solid #BCEBF2;border-radius:14px;padding:12px;min-width:0}
.quick-cell.select{background:#64FFDA;border-color:#64FFDA}
.quick-cell .slot{font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:900;color:#20366B}
.quick-cell .horse{font-size:14px;line-height:1.3;font-weight:1000;overflow-wrap:anywhere;margin-top:6px}
.quick-cell .score{font-size:22px;font-weight:950;margin-top:5px;letter-spacing:-.02em}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stat{display:inline-flex;align-items:center;gap:5px;background:#E0FBFC;color:#20366B;padding:8px 10px;border-radius:100px;font-size:11px;font-weight:850;line-height:1.3}
.stat.warn{background:#fff1d7;color:#7d4b06}.stat.good{background:#e5f8ee;color:#12633a}
.decision{border-left:4px solid #64FFDA;background:#f6f9ee;padding:13px 15px;color:#20366B;border-radius:0 12px 12px 0;font-size:13px;line-height:1.65}
.decision b{font-size:15px}
.read{background:#E0FBFC;border:1px solid #BCEBF2;border-radius:16px;padding:15px 17px}
.read p,.pace-scenario,.risk-text,.strategy{margin:0;font-size:14px;line-height:1.75;color:#20366B}
.block-title{margin:0 0 10px;color:#20366B;font-size:17px;letter-spacing:-.02em}
.pace-lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:11px}
.pace-lane{border:1px solid #BCEBF2;border-radius:12px;background:#E0FBFC;padding:10px;font-size:12px;line-height:1.6}
.pace-lane b{display:block;color:#20366B;font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.board-wrap{overflow-x:auto;border-radius:13px;border:1px solid #BCEBF2}
.board-table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}
.board-table th{background:#20366B;color:#E0FBFC;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:11px}
.board-table td{border-bottom:1px solid #BCEBF2;padding:11px;vertical-align:top}
.board-table tr:last-child td{border-bottom:0}
.board-table tbody tr:first-child{background:#64FFDA}
.board-table .name{font-weight:900;color:#20366B}
.board-table .role{display:block;font-size:10px;color:#20366B;margin-top:4px}
.score-num{font-weight:1000;font-size:17px;color:#20366B}
.pool-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pool-item{background:#E0FBFC;border:1px solid #BCEBF2;border-radius:10px;padding:11px}
.pool-item small{display:block;text-transform:uppercase;font-size:10px;letter-spacing:.06em;color:#20366B;font-weight:900;margin-bottom:5px}
.pool-item strong{font-size:14px;color:#20366B;overflow-wrap:anywhere}
.risk{border:1px solid #eadab6;background:#fff9ed;border-radius:14px;padding:14px}
.risk .block-title{color:#7a510d}.risk .risk-text{color:#6a4b1b}
.wager{border:1px solid #BCEBF2;background:#E0FBFC;border-radius:14px;padding:14px}
.wager pre{color:#20366B;font-family:inherit;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;line-height:1.7}
.more{border-top:1px solid #BCEBF2;padding:0 20px}
.more summary{cursor:pointer;list-style:none;padding:17px 0;font-weight:950;color:#20366B;font-size:14px}
.more summary::-webkit-details-marker{display:none}
.more summary:before{content:'+';display:inline-grid;place-items:center;margin-right:10px;width:24px;height:24px;color:#20366B;background:#64FFDA;border-radius:7px}
.more[open] summary:before{content:'−'}
.more .inside{padding:0 0 18px}
.horse-detail{border:1px solid #BCEBF2;background:#E0FBFC;border-radius:12px;margin:10px 0;padding:14px}
.horse-detail h5{margin:0 0 10px;font-size:15px;color:#20366B}
.source{font-family:inherit;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;font-size:13px;line-height:1.75;color:#37577A;margin:0}
.empty-race{padding:22px;color:#7d3e11;background:#fff5e9;border:1px solid #edd5b7;border-radius:12px}
.missing-field{font-size:12px;color:#20366B}
.footer-action{padding:0 20px 16px;font-size:11px;color:#20366B}
@media(max-width:760px){.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pace-lanes{grid-template-columns:repeat(2,minmax(0,1fr))}.pool-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.race-core{padding:15px;gap:16px}.race-banner{padding:15px}.race-no{width:45px;height:45px;font-size:20px}.race-title h3{font-size:18px}.quick-cell{padding:10px}.quick-cell .horse{font-size:13px}.quick-cell .score{font-size:20px}.read p,.pace-scenario,.risk-text,.strategy{font-size:13px}.board-table td,.board-table th{padding:9px 7px}.more{padding:0 15px}.race-index a{min-width:37px;min-height:37px}}


/* Public Dashboard: recupera la arquitectura visual de HUB.html (solo lectura) */
:root{--navy:#0A192F;--navy2:#20366B;--lime:#64FFDA;--cyan:#00B4D8;--line:#BCEBF2;--muted:#20366B;--bg:#E0FBFC}
html,body{background:#E0FBFC;color:#0A192F;scroll-behavior:auto}
.top{padding:0;background:linear-gradient(135deg,#0A192F,#20366B);border-bottom:0;box-shadow:0 8px 24px rgba(8,24,43,.16)}
.top .wrap{max-width:1600px;display:flex;align-items:center;gap:12px;padding:13px 20px}
.brand-mark{width:42px;height:42px;border-radius:10px;flex:none;background:#20366B;display:grid;place-items:center;color:#64FFDA;font-size:20px;font-weight:1000;letter-spacing:-.05em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.brand-copy{min-width:0}.top .brand{font-size:11px;color:#64FFDA;letter-spacing:.15em}.top .title{margin:3px 0 0;font-size:21px;letter-spacing:-.03em;line-height:1.1}.top .sub{font-size:11px;margin-top:3px;color:#BCEBF2}
.public-chip{margin-left:auto;border:1px solid rgba(100,255,218,.44);background:rgba(100,255,218,.11);border-radius:30px;padding:7px 9px;color:#64FFDA;font-weight:900;font-size:10px;white-space:nowrap}
.controls{margin:0 auto;padding:13px 18px;max-width:1600px;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:9px}
.controls select{color:#20366B;border:1px solid #BCEBF2;border-radius:10px;font-size:14px;min-height:46px;background:#E0FBFC}
.controls button{border-radius:10px;min-height:46px;font-size:13px}
#status{max-width:1600px;margin:0 auto;padding:0 18px 10px;color:#20366B;font-weight:800;font-size:11px}
.grid{max-width:1600px;padding:0 18px 32px;gap:13px}
.screen-nav{display:flex;gap:7px;overflow-x:auto;background:#E0FBFC;border-bottom:1px solid #BCEBF2;padding:9px max(18px,calc((100vw - 1560px)/2));scrollbar-width:none}
.screen-nav::-webkit-scrollbar{display:none}
.screen-nav a{display:flex;align-items:center;justify-content:center;flex:none;min-width:42px;min-height:42px;padding:9px 12px;border:1px solid #BCEBF2;border-radius:10px;background:#E0FBFC;color:#37577A;font-weight:1000;font-size:13px;text-decoration:none}
.screen-nav a.active{background:#0A192F;color:#E0FBFC;border-color:#0A192F;box-shadow:inset 0 -3px 0 #64FFDA}
.screen-nav .nav-home{min-width:104px}
.dashboard-shell{display:grid;gap:13px}
.page-header{display:flex;gap:12px;justify-content:space-between;align-items:flex-end;padding:9px 1px 4px}
.page-kicker{font-size:11px;font-weight:1000;color:#20366B;text-transform:uppercase;letter-spacing:.17em}
.page-heading{font-size:clamp(24px,4vw,34px);font-weight:1000;color:#0A192F;letter-spacing:-.04em;line-height:1.05;margin:4px 0}
.page-desc{font-size:13px;color:#20366B;line-height:1.5}
.section-card{background:#E0FBFC;border:1px solid #BCEBF2;border-radius:16px;box-shadow:0 8px 24px rgba(8,24,43,.05);padding:15px}
.section-heading{font-size:13px;font-weight:1000;letter-spacing:.11em;text-transform:uppercase;color:#37577A;margin:0 0 12px}
.jornada-command{display:flex;align-items:center;gap:12px;justify-content:space-between;background:#0A192F;color:#E0FBFC;padding:16px 19px;border-radius:17px;border:1px solid #20366B}
.jornada-command-mark{display:grid;place-items:center;border-radius:12px;background:#64FFDA;color:#0A192F;width:48px;height:48px;font-size:19px;font-weight:1000}
.jornada-brand{display:flex;align-items:center;gap:12px;min-width:0}
.jornada-command-kicker{font-size:10px;font-weight:950;color:#64FFDA;letter-spacing:.15em}
.jornada-command-title{font-size:21px;font-weight:1000;letter-spacing:-.03em}
.jornada-command-sub{color:#BCEBF2;font-size:12px;margin-top:3px}
.jornada-count{border:1px solid rgba(100,255,218,.35);background:rgba(100,255,218,.09);color:#64FFDA;border-radius:50px;padding:8px 10px;font-size:11px;font-weight:950;white-space:nowrap}
.radiography{background:linear-gradient(135deg,#0A192F 0%,#20366B 55%,#0A192F 100%);border:1px solid #20366B;color:#E0FBFC;padding:18px;border-radius:20px;box-shadow:0 18px 40px rgba(8,24,43,.12)}
.radiography h2{font-size:25px;font-weight:1000;margin:4px 0 4px;line-height:1.1;letter-spacing:-.04em}
.radiography-kicker{font-weight:1000;letter-spacing:.17em;color:#64FFDA;font-size:11px}
.radiography-sub{color:#BCEBF2;font-size:12px;line-height:1.6;margin-bottom:15px}
.xray-grid{display:grid;grid-template-columns:minmax(220px,.85fr) minmax(0,1.65fr);gap:12px}
.xray-core{border:1px solid rgba(255,255,255,.12);border-radius:17px;background:rgba(255,255,255,.055);padding:23px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:230px}
.xray-core .cap{font-size:11px;color:#BCEBF2;letter-spacing:.11em;font-weight:1000}
.xray-core .mark{width:49px;height:49px;margin:12px auto;background:#64FFDA;color:#0A192F;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:1000}
.xray-core .val{font-size:25px;color:#E0FBFC;font-weight:1000;line-height:1.1}
.xray-core .note{font-size:11px;line-height:1.5;color:#BCEBF2;margin-top:10px}
.xray-signals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xray-signal{position:relative;display:block;text-decoration:none;color:#E0FBFC;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);border-radius:15px;padding:14px;min-height:108px}
.xray-signal:after{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;background:#00B4D8}
.xray-signal.base:after{background:#64FFDA}.xray-signal.risk:after{background:#FF491C}.xray-signal.tight:after{background:#8b5cf6}
.xray-signal .cap{font-size:10px;letter-spacing:.1em;font-weight:950;color:#BCEBF2}
.xray-signal .main{font-size:18px;font-weight:1000;margin-top:8px}
.xray-signal .sub{font-size:11px;line-height:1.5;color:#BCEBF2;margin-top:5px}
.day-pulse{background:#0A192F;border-radius:17px;padding:16px;color:#E0FBFC;border:1px solid #20366B}
.day-pulse-title{color:#64FFDA;font-size:12px;font-weight:1000;letter-spacing:.1em}
.pulse-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:9px;margin-top:13px}
.pulse-tile{background:#20366B;color:#E0FBFC;border:1px solid #37577A;border-radius:11px;padding:13px 10px;text-decoration:none}
.pulse-tile .pulse-id{font-size:18px;font-weight:1000}
.pulse-tile .pulse-risk{font-size:10px;color:#BCEBF2;line-height:1.5;margin-top:5px}
.pulse-meter{height:52px;border-bottom:1px solid #37577A;display:flex;align-items:flex-end;margin:9px 0}
.pulse-meter i{display:block;width:23px;height:var(--meter);max-height:100%;background:linear-gradient(0deg,#00B4D8,#64FFDA);border-radius:5px 5px 0 0}
.pulse-pick{font-size:11px;color:#E0FBFC;font-weight:900;line-height:1.3}
.match-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.match-card{display:block;text-decoration:none;color:#20366B;background:#E0FBFC;border:1px solid #BCEBF2;border-radius:14px;overflow:hidden}
.match-head{background:#E0FBFC;border-bottom:1px solid #BCEBF2;padding:11px;display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:12px;font-weight:950}
.match-head span{color:#a15b17}
.match-body{display:grid;grid-template-columns:minmax(0,1fr) 55px minmax(0,1fr);gap:4px;align-items:center;padding:17px 11px}
.match-fighter{min-width:0}.match-fighter.right{text-align:right}
.match-tag{font-size:10px;color:#20366B;font-weight:1000;letter-spacing:.08em}
.match-name{font-size:13px;font-weight:1000;color:#20366B;overflow-wrap:anywhere;margin-top:5px}
.match-score{font-size:26px;font-weight:1000;line-height:1;margin-top:7px}
.match-vs{text-align:center;font-size:12px;background:#20366B;color:#64FFDA;border-radius:50%;width:43px;height:43px;display:grid;place-items:center;font-weight:1000;margin:auto}
.match-footer{padding:9px 11px;border-top:1px solid #E0FBFC;color:#20366B;font-size:11px;font-weight:850;display:flex;justify-content:space-between;gap:7px}
.match-footer strong{color:#37577A}
.race-screen{display:grid;gap:12px}
.race-controls{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.race-controls a{border:1px solid #BCEBF2;padding:10px 13px;border-radius:10px;text-decoration:none;color:#20366B;background:#E0FBFC;font-size:12px;font-weight:1000}
.race-controls a.primary{background:#0A192F;color:#64FFDA;border-color:#0A192F}
.race-page .race{box-shadow:none;border:none;border-radius:0;padding:0;background:transparent}
.race-page .race-banner{border-radius:15px;background:linear-gradient(125deg,#0A192F,#20366B)}
.race-page .race-core{padding:15px 0;gap:12px}
.race-page .race-core>section{background:#E0FBFC;border:1px solid #BCEBF2;border-radius:15px;padding:15px;box-shadow:0 5px 18px rgba(8,24,43,.045)}
.race-page .race-core>section.decision{border-left:4px solid #64FFDA;background:#f6ffeb}
.race-page .race-core>section.read{background:#E0FBFC}
.race-page .race-core>section.risk{background:#fff9ed;border:1px solid #eadab6}
.race-page .race-core>section.wager{background:#E0FBFC;border-color:#BCEBF2}
.race-page .quick-cell{min-height:96px;background:#E0FBFC;border:1px solid #BCEBF2}
.race-page .quick-cell.select{background:#64FFDA;border-color:#64FFDA}
.race-page .quick-cell .horse{font-size:14px}
.race-page .section-label{color:#37577A;font-size:13px}
.race-page .block-title{font-size:14px;text-transform:uppercase;letter-spacing:.08em}
.race-page .board-table th{background:#E0FBFC;color:#20366B;border-bottom:1px solid #BCEBF2}
.race-page .board-table tbody tr:first-child{background:#f5ffe8}
.race-page .pace-lane{background:#E0FBFC;border-radius:9px;border-top:3px solid #00B4D8}
.race-page .pace-lane:nth-child(1){border-top-color:#FF491C}
.race-page .pace-lane:nth-child(2){border-top-color:#ffd44d}

<body>
<header class="top"><div class="wrap"><div class="brand-mark">PH</div><div class="brand-copy"><div class="brand">PLAYERSHYPE · DEFINIENDO EL ESTÁNDAR</div><div class="title">HypePredict</div><div class="sub">Race Intelligence · Track Hub</div></div><div class="public-chip">● PUBLICADO</div></div></header>
<section class="controls"><select id="date" aria-label="Fecha de análisis"><option>Cargando fechas…</option></select><select id="track" aria-label="Hipódromo con análisis publicado"><option>Cargando hipódromos…</option></select><button id="refresh">Actualizar</button></section>
<nav id="raceNav"></nav><div class="status" id="status">Conectando con la data publicada…</div>
<main class="grid" id="app"></main><aside id="horseModal" class="horse-modal" aria-live="polite"></aside><aside id="matchModal" class="hm-modal" aria-live="polite"></aside>
<footer>PLAYERSHYPE · No seguimos el hype. Lo creamos.</footer>
<script>
const CONFIG_URL='../app/config.json'; let DATA=null, SELECTED_DATE='';
const URL_PARAMS=new URLSearchParams(location.search);
const REQUESTED_TRACK=URL_PARAMS.get('track')||'';
const REQUESTED_DATE=URL_PARAMS.get('date')||'';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

// A silk is never inferred from the saddlecloth/program number.
function phSilkColor(w){const k=String(w||'').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');return ({dorado:'#d4af37',dorada:'#d4af37',amarillo:'#f5c518',amarilla:'#f5c518',azul:'#1565c0',azules:'#1565c0',rojo:'#c62828',roja:'#c62828',verde:'#218c4c',blanco:'#f4f4f4',blanca:'#f4f4f4',negro:'#171717',negra:'#171717',naranja:'#ef6c00',rosado:'#ec407a',rosada:'#ec407a',gris:'#757575',morado:'#6a1b9a',morada:'#6a1b9a',violeta:'#6a1b9a',turquesa:'#00a6a6',marron:'#6d4c41',celeste:'#69bfe8',crema:'#eadfbd'})[k]||null}
function phSilk(description){const raw=String(description||'').trim();if(!raw||/^(no disponible|uniform not available)$/i.test(raw))return '<span class="ph-silk ph-silk-unknown" title="Uniforme no disponible">UNIFORME NO DISPONIBLE</span>';const t=raw.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');const colors=(t.match(/[a-z]+/g)||[]).map(phSilkColor).filter(Boolean);const base=colors[0];if(!base)return '<span class="ph-silk ph-silk-unknown" title="'+esc(raw)+'">UNIFORME NO DISPONIBLE</span>';const secondary=colors.find(c=>c!==base)||base;const ring=t.match(/(?:aros?|anillos?|bandas?)\\s+([a-z]+)/);const ringColor=ring?phSilkColor(ring[1]):null;const sleeve=t.match(/mangas?\\s+(?:de\\s+)?(?:color\\s+)?([a-z]+)/);const sleeveColor=sleeve&&phSilkColor(sleeve[1])||base;const hasRings=/(?:aros?|anillos?|bandas?).{0,35}mangas|mangas.{0,35}(?:aros?|anillos?|bandas?)/.test(t);const hasStar=/estrell/.test(t);const starColor=secondary;let details='';if(hasRings&&ringColor&&ringColor!==sleeveColor)details='<path d="M8 16L17 19M7 20L16 23M43 19L52 16M44 23L53 20" stroke="'+ringColor+'" stroke-width="3"/>';if(hasStar)details+='<path d="M30 19l2.5 6 6.5.4-5 4.3 1.5 6.5-5.5-3.4-5.5 3.4 1.5-6.5-5-4.3 6.5-.4z" fill="'+starColor+'"/>';return '<span class="ph-silk" title="'+esc(raw)+'"><svg viewBox="0 0 60 54" role="img" aria-label="'+esc(raw)+'"><path d="M20 12L12 10 5 20 14 25 20 20Z M40 12L48 10 55 20 46 25 40 20Z" fill="'+sleeveColor+'" stroke="#07182b" stroke-width="1.5"/><path d="M20 12Q24 7 30 7Q36 7 40 12L43 45Q30 50 17 45Z" fill="'+base+'" stroke="#07182b" stroke-width="1.5"/>'+details+'</svg></span>'}
function tracks(){
 const declared=(DATA?.tracks||[]).filter(t=>t&&t.enabled!==false);
 const byId=new Map(declared.map(t=>[t.id,t]));
 for(const id of Object.keys(DATA?.raceDays||{})){
  if(!id||byId.has(id))continue;
  const d=DATA.raceDays[id],hasDay=Array.isArray(d)?d.some(x=>x?.date||x?.races?.length):(Array.isArray(d?.days)?d.days.some(x=>x?.date||x?.races?.length):!!(d?.date||d?.races?.length));
  if(hasDay)byId.set(id,{id,name:String(id).replace(/[-_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase()),enabled:true,recovered:true});
 }
 return [...byId.values()]
}
function day(id,date){
 const raw=DATA?.raceDays?.[id]||null;
 if(!raw)return null;
 const days=Array.isArray(raw)?raw:(Array.isArray(raw.days)?raw.days:[raw]);
 return date?days.find(d=>d?.date===date)||null:days[days.length-1]||null;

function analyses(){return DATA?.hypepredict?.analyses||{}}
function analysisFor(race){return analyses()[race.id]||null}
function detailField(label,val) {
 if(val===undefined||val===null||String(val).trim()==="")return "";

}


function quickPick(label,h,variant="") {
 if(!h||!h.name)return "";
 return '<div class="quick-cell '+hpEsc(variant)+'"><div class="slot">'+hpEsc(label)+'</div><div class="horse">'+hpSaddle(h.programNumber)+'<span>'+hpEsc(h.name)+'</span></div><div class="score">'+(h.hypeScore==null?"—":hpEsc(h.hypeScore))+' <span style="font-size:10px;font-weight:800;color:#536f7f">/ 10</span></div></div>';
}


function lineNames(items) {
 return (Array.isArray(items)?items:[]).map(e=>`#${esc(e.programNumber)} ${esc(e.name||"")}`).join(" · ")||"Sin datos";
}

function paceLane(label,items) {
 return `<div class="pace-lane"><b>${esc(label)}</b>${lineNames(items)}</div>`;
}

function poolCell(label,value) {
 if(value===undefined||value===null||String(value).trim()==="")return "";
 return `<div class="pool-item"><small>${esc(label)}</small><strong>${esc(value)}</strong></div>`;
}

function sourceHypeBet(a){
 if(typeof a?.hypeBet==="string"&&a.hypeBet.trim())return a.hypeBet.trim();
 const txt=String(a?.sourceText||"");
 const at=txt.lastIndexOf("🎯 HYPEBET");
 if(at<0)return "";
 return txt.slice(at+"🎯 HYPEBET".length).replace(/\n[─—-]{3,}[\s\S]*$/,"").trim();
}

function hpTodayInPuertoRico(){

 return values.year+"-"+values.month+"-"+values.day;
}
function hpIsPublished(id,d,r){
 const a=DATA?.hypepredict?.analyses?.[r?.id];
 return !!(a&&a.status==="published"&&a.trackId===id&&a.raceId===r.id&&d?.date);
}
function hpPublishedCount(id,date){
 const d=day(id,date);
 return Array.isArray(d?.races)?d.races.filter(r=>hpIsPublished(id,d,r)).length:0;
}
function hpAllPublishedDates(){
 // Show current Puerto Rico date by default; also allow dates with published analyses.
 // Never delete or rewrite raceDayHistory; previous reports remain archived.
 const available=new Set([hpTodayInPuertoRico()]);
  for(const t of tracks()){
    const days=DATA?.raceDays?.[t.id];
    const entries=Array.isArray(days)?days:Array.isArray(days?.days)?days.days:days?[days]:[];
    for(const x of entries)if(x?.date&&hpPublishedCount(t.id,x.date)>0)available.add(x.date);
  }
  return [...available].sort((a,b)=>b.localeCompare(a));
}
function hpTracksForDate(date){
 return tracks().filter(t=>hpPublishedCount(t.id,date)>0);
}
function datesFor(id){

 return hpAllPublishedDates().filter(d=>hpPublishedCount(id,d)>0);

function latestPublishedTrack(ts,date){

function day(id,date){

 if(!raw)return null;
 const days=Array.isArray(raw)?raw:(Array.isArray(raw.days)?raw.days:[raw]);

function hpWxCode(value){

function hpWxDraw(id,data,stale=false){

async function hpWxLoad(id,force=false){
 const root=document.getElementById("hpWeather");if(!root||root.dataset.trackId!==id)return;

 const refresh=root.querySelector("#hpWxRefresh");if(refresh)refresh.onclick=()=>hpWxLoad(id,true);
 if(!pos){hpWxDraw(id,null);return}
 if(cached&&!force&&now-cached.fetched<300000){hpWxDraw(id,cached.data);return}
 if(cached)hpWxDraw(id,cached.data,true);

  url.searchParams.set("forecast_days","2");

}

 m.innerHTML='<div class="hm-dialog" role="dialog" aria-modal="true" aria-label="HypeMatch Head to Head"><header class="hm-top"><div><div class="hm-kicker">PLAYERSHYPE · HYPEMATCH</div><div class="hm-title">R'+esc(ctx.race.number)+' · HEAD TO HEAD</div><div class="hm-sub">Tale of the Tape · dos ejemplares del mismo lote</div></div><button id="hmClose" class="hm-close" aria-label="Cerrar">×</button></header><div class="hm-body"><div class="hm-selectors"><div class="hm-choice"><label for="hmLeft">ESQUINA A</label><select id="hmLeft">'+opts+'</select></div><div class="hm-vs">VS</div><div class="hm-choice"><label for="hmRight">ESQUINA B</label><select id="hmRight">'+opts+'</select></div></div><div id="hmContent"></div><div class="hm-actions"><button id="hmReset">SELECT VS RIVAL</button><button id="hmGo" class="primary">ABRIR CARRERA COMPLETA</button></div></div></div>';
 const defaults=hpMatchDefaults(ctx.a);
 m.querySelector("#hmLeft").value=String(defaults[0]);m.querySelector("#hmRight").value=String(defaults[1]);
 m.classList.add("open");document.body.style.overflow="hidden";
 m.querySelector("#hmLeft").onchange=()=>{const a=m.querySelector("#hmLeft"),b=m.querySelector("#hmRight");if(a.value===b.value)b.value=String(ctx.a.horses.findIndex((_,i)=>i!==Number(a.value)));hpMatchRender()};
 m.querySelector("#hmRight").onchange=()=>{const a=m.querySelector("#hmLeft"),b=m.querySelector("#hmRight");if(a.value===b.value)a.value=String(ctx.a.horses.findIndex((_,i)=>i!==Number(b.value)));hpMatchRender()};
 m.querySelector("#hmClose").onclick=hpMatchClose;
 m.querySelector("#hmReset").onclick=()=>{const x=hpMatchDefaults(ctx.a);m.querySelector("#hmLeft").value=String(x[0]);m.querySelector("#hmRight").value=String(x[1]);hpMatchRender()};
 m.querySelector("#hmGo").onclick=()=>{const n=ctx.race.number;hpMatchClose();if(hpScreen()!==n)location.hash="#race-"+n};
 hpMatchRender();
}
function hpMatchClose(){document.getElementById("matchModal")?.classList.remove("open");hpMatchContext=null;document.body.style.overflow=""}

function hpScreen(){var h=String(location.hash||"");var m=h.match(/^#race-([1-9][0-9]*)$/);return m?Number(m[1]):0}
function hpEsc(v){return esc(v===null||v===undefined?"":v)}
function hpSaddle(n){
 var colors={1:["#ed1c24","#fff"],2:["#fff","#111"],3:["#0057b7","#fff"],4:["#ffd200","#111"],5:["#00843d","#fff"],6:["#111","#ffd200"],7:["#ff791d","#111"],8:["#ef80af","#111"],9:["#00a6a6","#111"],10:["#7b2a90","#fff"],11:["#adb5bd","#111"],12:["#a6dc27","#111"],13:["#6b2c22","#fff"],14:["#741a1a","#fff"]};
 var c=colors[Number(n)]||["#102946","#fff"];
 return '<span class="saddle" style="--saddle-bg:'+c[0]+';--saddle-color:'+c[1]+'">'+hpEsc(n)+'</span>';
}
function hpMeta(r){return r&&r.raceMeta||{}}
function hpQ(r){return r&&r.quickHits||{}}
function hpScore(h){return h&&h.hypeScore!==null&&h.hypeScore!==undefined?hpEsc(h.hypeScore):"—"}
function hpRaceNav(races,n){
 var items='<a class="nav-home '+(!n?'active':'')+'" href="#jornada">JORNADA</a>';
 items+=races.map(function(r){return '<a class="'+(Number(r.number)===n?'active':'')+'" href="#race-'+hpEsc(r.number)+'">R'+hpEsc(r.number)+'</a>'}).join("");
 return '<nav class="screen-nav" aria-label="Pantallas HypePredict">'+items+'</nav>';
}
function hpMatchCard(r,a){
 var q=hpQ(a),s=q.select||{},rv=q.rival||{},risk=q.risk||"No disponible";
 return '<button type="button" class="match-card hm-from-day" data-match-race="'+hpEsc(r.number)+'"><div class="match-head">R'+hpEsc(r.number)+' · '+hpEsc(hpMeta(a).distance||"")+'<span>'+hpEsc(risk)+'</span></div>'+
 '<div class="match-body"><div class="match-fighter"><div class="match-tag">SELECT</div><div class="match-name">#'+hpEsc(s.programNumber)+' '+hpEsc(s.name||"Sin dato")+'</div><div class="match-score">'+hpScore(s)+'</div></div>'+
 '<div class="match-vs">VS</div><div class="match-fighter right"><div class="match-tag">RIVAL</div><div class="match-name">#'+hpEsc(rv.programNumber)+' '+hpEsc(rv.name||"Sin dato")+'</div><div class="match-score">'+hpScore(rv)+'</div></div></div>'+
 '<div class="match-footer"><span>Gap '+hpEsc(q.gap||"—")+' · '+hpEsc(q.decision||"")+'</span><strong>ABRIR HEAD TO HEAD ›</strong></div></button>';
}
function hpDayView(track,dayData){
 var races=dayData.races||[],list=races.map(function(r){return {race:r,analysis:analysisFor(r)}}).filter(function(x){return x.analysis&&x.analysis.status==="published"&&x.analysis.trackId===track.id&&x.analysis.raceId===x.race.id});
 var sorted=list.slice().filter(function(x){return Number.isFinite(parseFloat(hpQ(x.analysis).gap))}).sort(function(x,y){return parseFloat(hpQ(x.analysis).gap)-parseFloat(hpQ(y.analysis).gap)});
 var tight=sorted[0],risks=list.filter(function(x){return /alto/i.test(String(hpQ(x.analysis).risk||""))});
 var fixed=list.filter(function(x){return /^(fijo|fijo estratégico)$/i.test(String(hpQ(x.analysis).decision||"").trim())});
 var chosen=fixed[0],best=list.filter(function(x){return hpQ(x.analysis).select}).sort(function(x,y){return Number(hpQ(y.analysis).select.hypeScore||0)-Number(hpQ(x.analysis).select.hypeScore||0)})[0];
 var signal=function(label,val,note,kind,num){
  return '<'+(num?'a href="#race-'+hpEsc(num)+'"':'div')+' class="xray-signal '+kind+'"><div class="cap">'+hpEsc(label)+'</div><div class="main">'+hpEsc(val)+'</div><div class="sub">'+hpEsc(note)+'</div></'+(num?'a':'div')+'>';
 };
 var core=chosen?'<div class="val">R'+hpEsc(chosen.race.number)+' · #'+hpEsc(hpQ(chosen.analysis).select.programNumber)+'</div><div class="note">'+hpEsc(hpQ(chosen.analysis).select.name)+' · HypeScore '+hpScore(hpQ(chosen.analysis).select)+'</div>':
 '<div class="val">SIN FIJO</div><div class="note">No hay una decisión explícita de fijo en los análisis publicados. No se asigna ninguno por inferencia.</div>';
 var pulse=list.map(function(x){var q=hpQ(x.analysis),s=q.select||{},sc=Number(s.hypeScore);var meter=Number.isFinite(sc)?Math.max(8,Math.min(100,sc*10)):0;return '<a class="pulse-tile" href="#race-'+hpEsc(x.race.number)+'"><div class="pulse-id">R'+hpEsc(x.race.number)+'</div><div class="pulse-risk">'+hpEsc(q.risk||"Riesgo no disponible")+'</div><div class="pulse-meter"><i style="--meter:'+meter+'%"></i></div><div class="pulse-pick">#'+hpEsc(s.programNumber||"—")+' '+hpEsc(s.name||"Sin Select")+'</div><div class="pulse-risk">HS '+hpScore(s)+' · '+hpEsc(q.decision||"—")+'</div></a>'}).join("");
 return '<div class="dashboard-shell"><section class="jornada-command"><div class="jornada-brand"><div class="jornada-command-mark">HP</div><div><div class="jornada-command-kicker">PLAYERSHYPE · CARD COMMAND</div><div class="jornada-command-title">JORNADA HYPEPREDICT</div><div class="jornada-command-sub">'+hpEsc(track.name)+' · '+hpEsc(dayData.date)+'</div></div></div><div class="jornada-count">'+list.length+'/'+races.length+' ANÁLISIS</div></section>'+
 hpWxCard(track,dayData.date)+'<section class="radiography"><div class="radiography-kicker">PLAYERSHYPE · RACE INTELLIGENCE</div><h2>Radiografía de la Jornada</h2><div class="radiography-sub">Lectura general de la cartelera. Cada carrera tiene su propia pantalla con el análisis completo.</div><div class="xray-grid">'+
 '<div class="xray-core"><div class="cap">FIJO ESTRATÉGICO</div><div class="mark">'+(chosen?'★':'Ø')+'</div>'+core+'</div>'+
 '<div class="xray-signals">'+
 signal("SELECT CON MAYOR HYPESCORE",best?'R'+best.race.number+' · #'+hpQ(best.analysis).select.programNumber:'—',best?hpQ(best.analysis).select.name+' · HS '+hpScore(hpQ(best.analysis).select):'No disponible',"base",best&&best.race.number)+
 signal("RIESGO ALTO / MEDIO-ALTO",String(risks.length),risks.length?risks.map(function(x){return 'R'+x.race.number}).join(" · "):"Ninguna identificada en los reportes","risk",risks[0]&&risks[0].race.number)+
 signal("MAYOR COMPRESIÓN",tight?'R'+tight.race.number+' · '+hpQ(tight.analysis).gap:'—',tight?'Select vs Rival · '+hpEsc(hpQ(tight.analysis).decision||""):'Sin gap registrado',"tight",tight&&tight.race.number)+
 signal("ANÁLISIS DE LA JORNADA",list.length+' / '+races.length,"Cada carrera conserva su propia lectura, HypeBoard y checklist","",null)+
 '</div></div></section>'+
 '<section class="day-pulse"><div class="day-pulse-title">PULSO DE LA JORNADA · RACE DAY PULSE</div><p class="radiography-sub" style="margin:5px 0 0">HypeScore del Select publicado por carrera. La escala no representa probabilidad de victoria.</p><div class="pulse-row">'+pulse+'</div></section>'+
 '<section class="section-card"><h3 class="section-heading">HYPEMATCH · SELECT VS RIVAL</h3><div class="match-grid">'+list.map(function(x){return hpMatchCard(x.race,x.analysis)}).join("")+'</div></section>'+
 '<p class="mobile-race-tip">Selecciona cualquier carrera para abrir exclusivamente su análisis.</p></div>';
}
function hpHorseReading(h){
 var txt=String(h.sourceText||"");
 var m=txt.match(/LECTURA:\s*([\s\S]*?)(?=\nUSO:|$)/i);
 return m?m[1].trim():"Lectura individual no disponible.";
}
function hpHorseProfileCards(a){
 return '<section class="section-card"><h3 class="section-heading">FULL FIELD · TODO EL CAMPO</h3><div class="original-field">'+(a.horses||[]).map(function(h,i){
  return '<button type="button" class="original-horse" data-horse-index="'+i+'"><div class="original-horse-head"><span>'+hpSaddle(h.programNumber)+'</span><span class="original-horse-score">'+hpScore(h)+'</span></div><div class="original-horse-name" style="margin-top:8px">#'+hpEsc(h.programNumber)+' '+hpEsc(h.name)+'</div><div class="original-horse-role">'+hpEsc(h.role||"")+" · "+hpEsc(h.reliability||"")+'</div><div class="original-horse-read">'+hpEsc(hpHorseReading(h))+'</div><div class="original-horse-cta">ABRIR PERFIL COMPLETO ›</div></button>';
 }).join("")+'</div></section>';
}
function hpOpenHorse(i){
 var n=hpScreen(),id=document.querySelector("#track").value,d=day(id,document.querySelector("#date").value),r=(d&&d.races||[]).find(function(x){return Number(x.number)===n}),a=r&&analysisFor(r),h=a&&a.horses&&a.horses[i];
 if(!h)return;
 var modal=document.getElementById("horseModal");if(!modal)return;
 modal.innerHTML='<div class="horse-panel" role="dialog" aria-modal="true" aria-label="Perfil completo del ejemplar"><div class="horse-panel-header"><b>PERFIL COMPLETO DEL EJEMPLAR</b><button id="closeHorse" aria-label="Cerrar">×</button></div><div class="horse-title" style="margin-top:16px">'+hpSaddle(h.programNumber)+'<span>'+hpEsc(h.name)+'</span></div><div class="horse-note">R'+n+' · '+hpEsc(h.role||"")+" · HypeScore "+hpScore(h)+" · "+hpEsc(h.reliability||"")+'</div><pre class="source">'+hpEsc(h.sourceText||"Perfil detallado no publicado.")+'</pre></div>';
 modal.classList.add("open");document.body.style.overflow="hidden";
 var closer=document.getElementById("closeHorse");if(closer)closer.onclick=hpCloseHorse;
}
function hpCloseHorse(){var el=document.getElementById("horseModal");if(el)el.classList.remove("open");document.body.style.overflow=""}

function hpDecisionStrip(a){
 var q=a&&a.quickHits||{},risk=a&&a.riskControl||{};
 var fields=[
  ["DECISIÓN",q.decision||risk.decision||"—","good"],
  ["RIESGO",q.risk||risk.risk||"—",/alto/i.test(String(q.risk||risk.risk||""))?"danger":"warn"],
  ["CONFIANZA",q.selectConfidence||"No disponible",""],
  ["CONFIABILIDAD",q.selectReliability||risk.selectReliability||"No disponible",""],
  ["GAP SELLADO",q.gap||risk.gap||"No disponible",""],
  ["ESTADO DEL POOL",String(q.poolStatus||"No disponible").replace(/\s*👉\s*$/,""),""]
 ];
 return '<div class="race-strip">'+fields.map(function(f){return '<div class="strip-cell '+f[2]+'"><div class="strip-label">'+hpEsc(f[0])+'</div><div class="strip-value">'+hpEsc(f[1])+'</div></div>'}).join("")+'</div>';
}

function hpRaceView(track,dayData,race){
 var a=analysisFor(race),races=dayData.races||[],idx=races.findIndex(function(x){return x.id===race.id}),prev=races[idx-1],next=races[idx+1];
 var buttons='<button class="hm-open" data-match-race="'+hpEsc(race.number)+'" type="button">⚔ HYPEMATCH · HEAD TO HEAD</button><a class="primary" href="#jornada">← VOLVER A JORNADA</a>'+(prev?'<a href="#race-'+hpEsc(prev.number)+'">← R'+hpEsc(prev.number)+'</a>':'')+(next?'<a href="#race-'+hpEsc(next.number)+'">R'+hpEsc(next.number)+' →</a>':'');
 return '<div class="race-screen"><div class="race-controls">'+buttons+'</div>'+
 '<div class="page-header"><div><div class="page-kicker">PLAYERSHYPE · HYPEPREDICT V1</div><h2 class="page-heading">Carrera '+hpEsc(race.number)+' · Análisis completo</h2><div class="page-desc">'+hpEsc(track.name)+' · '+hpEsc(dayData.date)+' · pantalla individual</div></div></div>'+
 hpDecisionStrip(a)+hpWxCard(track,dayData.date)+'<div class="race-page">'+raceCard(race,track.id,dayData.date)+'</div>'+
 (a&&a.status==="published"?hpHorseProfileCards(a):"")+
 '<div class="race-controls">'+buttons+'</div></div>';
}
function render(){
 var id=document.querySelector("#track").value;
 var track=hpTracksForDate(document.querySelector("#date").value||SELECTED_DATE).find(function(x){return x.id===id});
 var selected=document.querySelector("#date").value||SELECTED_DATE;
 var d=day(id,selected),n=hpScreen();
 if(!track||!d||!d.date){
  document.querySelector("#app").innerHTML='<div class="empty"><b>Sin análisis publicados</b><span>No hay hipódromos con análisis HypePredict publicados para '+esc(selected)+'. Escoge otra fecha para consultar el archivo.</span></div>';
  document.querySelector("#status").textContent="Sin análisis publicados · "+selected;
  var nav=document.getElementById("raceNav");if(nav)nav.innerHTML="";
  hpSyncUrl();
  return;
 }
 var races=Array.isArray(d.races)?d.races:[],r=races.find(function(x){return Number(x.number)===n});
 var nav=document.getElementById("raceNav");if(nav)nav.innerHTML=hpRaceNav(races,r?n:0);
 document.querySelector("#app").innerHTML=r?hpRaceView(track,d,r):hpDayView(track,d);
 var published=races.filter(function(x){var a=analysisFor(x);return a&&a.status==="published"&&a.trackId===id&&a.raceId===x.id}).length;
 document.querySelector("#status").textContent="Config "+(DATA.revision||"")+" · "+track.name+" · "+published+"/"+races.length+" análisis · "+(r?"R"+r.number:"Jornada");
 hpSyncUrl();
 document.querySelectorAll("[data-horse-index]").forEach(function(el){el.addEventListener("click",function(){hpOpenHorse(Number(el.dataset.horseIndex))})});
 document.querySelectorAll("[data-match-race]").forEach(el=>el.addEventListener("click",()=>hpMatchOpen(Number(el.dataset.matchRace))));
 hpWxLoad(id);
}
function hpNavigate(){
 hpMatchClose();
 hpCloseHorse();
 if(document.querySelector("#app"))render();
 window.scrollTo(0,0);
 if(hpPendingProfile!==null&&hpScreen()){const p=hpPendingProfile;hpPendingProfile=null;hpOpenHorse(p)}
}


async function load(){
 const oldTrack=$("#track").value, oldDate=SELECTED_DATE||"";
 try{
  $("#status").textContent="Actualizando información pública…";
  const url=new URL(CONFIG_URL,location.href);url.searchParams.set("v",Date.now());
  const res=await fetch(url.href,{cache:"no-store",headers:{"Cache-Control":"no-cache","Pragma":"no-cache"}});
  if(!res.ok)throw new Error("HTTP "+res.status);
  const next=await res.json();
  if(!next||!next.raceDays||!next.hypepredict)throw new Error("Configuración incompleta");
  DATA=next;
  const date=oldDate||REQUESTED_DATE||hpTodayInPuertoRico();
  const track=oldTrack||REQUESTED_TRACK;
  syncDateTracks(date,track);
 }catch(e){
  $("#status").textContent="No se pudo cargar la información pública";
  $("#app").innerHTML=`<div class="empty"><b>No se pudo conectar con HypePredict</b><span>${esc(e.message)}</span></div>`;
 }
}
$('#track').addEventListener('change',()=>{hpGoToJornada();render()});$('#date').addEventListener('change',()=>{hpGoToJornada();syncDateTracks($('#date').value,$('#track').value)});$('#refresh').addEventListener('click',load);window.addEventListener('hashchange',hpNavigate);document.addEventListener('keydown',e=>{if(e.key==='Escape'){hpMatchClose();hpCloseHorse()}});hpWxTimer=setInterval(()=>{const w=document.getElementById('hpWeather');if(w)hpWxLoad(w.dataset.trackId)},300000);document.getElementById('matchModal').addEventListener('click',e=>{if(e.target.id==='matchModal')hpMatchClose()});document.getElementById('horseModal').addEventListener('click',e=>{if(e.target.id==='horseModal')hpCloseHorse()});load();
</script>
</body></html>
